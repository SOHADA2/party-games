      <div class="iosstep"><div class="iosnum">3</div>
        <div class="tx">오른쪽 위 <b>「추가」</b> 를 누르면 끝!</div></div>
      <p class="note" style="text-align:center;margin:18px 0 16px">
        ⚠️ 사파리에서만 됩니다. 카카오톡 안에서 열었다면<br>먼저 <b style="color:var(--dim)">사파리로 열기</b>를 해주세요.</p>
      <button class="btn pri" id="ios-ok">알겠어요</button>
    </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector('#ios-ok').onclick = close;
  ov.onclick = e => { if (e.target === ov) close(); };
}

/* 화면 꺼짐 방지 */
let wakeLock = null;
async function keepAwake(){
  try{ if (!('wakeLock' in navigator)) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
  }catch{}
}
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState === 'visible' && !wakeLock) keepAwake(); });

/* ══════════════════════════════════════════════
   Firebase 동기화 — 호스트가 진실원
══════════════════════════════════════════════ */
const roomRef = code => ref(db, `${ROOT}/rooms/${code}`);

function watchConnection(){
  onValue(ref(db, '.info/connected'), snap => {
    S.online = !!snap.val();
    const d = $('#hd-dot'); if (d) d.classList.toggle('off', !S.online);
    if (S.view !== 'home') render();
  });
}

function pushHostState(){
  if (!S.isHost || !S.code || !S.room) return;
  const r = S.room;
  update(roomRef(S.code), {
    status:r.status||'lobby', host:r.host||S.pid,
    teams:r.teams||{count:0,assign:{}}, scores:r.scores||{}, rotation:r.rotation||{},
    used:r.used||{},
    // ⚠️ yut 은 여기서 쓰지 않는다 — 참가자가 throw/halt 를 직접 쓰기 때문에
    //    통째로 덮으면 던진 결과와 「잠시!」가 날아간다. pushYut()으로 하위 경로만 갱신할 것.
    touchedAt:now(),
  }).catch(()=>{});
}

/* 참가자가 던진 결과를 호스트가 받아 판에 반영한다.
   ⚠️ 반영한 뒤 throw 를 지워야 한다 — 안 지우면 스냅샷마다 같은 결과가 다시 들어온다. */
function yutConsume(){
  const m = YT();
  if (!S.isHost || !m || m.phase !== 'play') return;
  const th = m.throw;
  if (!th || _yutAnim) return;           // ⚠️ 연출 중이면 다음 스냅샷에서 처리(겹치면 판이 꼬인다)
  const ok = m.canThrow && !m.halt && !m.pick
    && S.room.teams?.assign?.[th.by] == Number(m.turn);
  m.throw = null;
  if (!ok){ pushYut({ throw:null }); return; }   // 남의 차례거나 더 못 던지는 상태 → 버린다
  // 태블릿에서도 던지는 걸 보여준 **뒤에** 판에 반영한다(먼저 반영하면 결과가 미리 보인다)
  pushYut({ throw:null });
  // ⚠️ 프로미스를 돌려준다 — 연출이 끝나야 판에 반영되므로 검사에서 기다릴 수 있어야 한다
  return yutThrowAnim(th, `${pname(th.by)} 던지기`).then(() => yutApplyThrow(th, th.by));
}

function subscribe(code){
  if (S.unsub) S.unsub();
  S.unsub = onValue(roomRef(code), snap => applySnapshot(snap.val()));
}

/* 서버 스냅샷 한 장을 받아 이 기기 상태에 반영한다.
   ⚠️ onValue 콜백에서 **떼어 놨다.** 검증 사본은 onValue 를 막기 때문에, 안에 박아두면
      「진행자가 넘어가면 옛 진행자가 내려오는가」 같은 걸 아예 검사할 수 없다. */
function applySnapshot(v){
  if (!v){ if (!S.isHost){ toast('방이 사라졌어요'); leaveRoom(); } return; }
  /* ⚠️ 진행자가 다른 기기로 넘어갔다 — 나는 **즉시 진행자에서 내려와야** 한다.
        안 내려오면 두 기기가 서로 진실원이라 믿고 번갈아 덮어써서 판이 요동친다. */
  if (S.isHost && v.host && v.host !== S.pid){
    S.isHost = false; saveSession();
    S.play = null;            // 진행 도구 상태는 이 기기에만 있었다 — 새 진행자에겐 없다
    if (S.view === 'play') S.view = 'lobby';
    toast(`진행자가 ${(v.players?.[v.host]?.name) || '다른 기기'}님 기기로 넘어갔어요`);
  }
  if (S.isHost){
    // ⚠️ 윷놀이는 v0.13.0 이후 처음으로 **참가자가 방 노드에 쓰는** 게임이다.
    //    호스트가 진실원이지만, 참가자가 쓰는 두 경로만은 서버에서 되받아야 한다.
    //    (v0.8.0 마피아 때와 같은 배선 — 통째로 덮으면 던진 결과가 사라진다.)
    S.room.players = v.players || S.room.players || {};   // 다른 사람 입장만 병합해 받는다
    if (S.room.yut && v.yut){
      S.room.yut.throw = v.yut.throw || null;
      S.room.yut.halt  = v.yut.halt  || null;
    }
  }else{
    S.room = {
      createdAt:v.createdAt||now(), host:v.host||'', status:v.status||'lobby',
      players:v.players||{}, teams:v.teams||{count:0,assign:{}},
      scores:v.scores||{}, rotation:v.rotation||{}, used:v.used||{}, yut:v.yut||null,
    };
  }
  yutConsume();
  render();
}

function startHeartbeat(){
  clearInterval(S.hb);
  const beat = () => {
    if (!S.code || !S.pid) return;
    update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { seen:now() }).catch(()=>{});
  };
  beat(); S.hb = setInterval(beat, 20000);
}

function saveSession(){
  try{ localStorage.setItem(LS, JSON.stringify({ code:S.code, pid:S.pid, isHost:S.isHost, name:myName() })); }catch{}
}
function clearSession(){ try{ localStorage.removeItem(LS); }catch{} }

async function newCode(){
  for (let i = 0; i < 40; i++){
    const c = String(Math.floor(1000 + Math.random()*9000));
    try{
      const v = (await get(roomRef(c))).val();
      // ⚠️ 숙소는 **하룻밤을 잔다** — 밤에 놀고 다음 날 오후에 이어 하면 12시간이 쉽게 넘는다.
      //    그 사이 남이 같은 코드를 받아가면 그 방 점수가 통째로 날아간다. 그래서 48시간.
      if (!v || (now() - (v.touchedAt || v.createdAt || 0)) > 48*3600*1000) return c;
    }catch{ return c; }
  }
  return String(Math.floor(1000 + Math.random()*9000));
}

async function createRoom(name){
  const code = await newCode();
  S.pid = uid(); S.isHost = true; S.code = code;
  S.room = emptyRoom(); S.room.host = S.pid;
  S.room.players[S.pid] = { name, joinedAt:now(), seen:now(), host:true };
  try{ await set(roomRef(code), { ...S.room, touchedAt:now() }); }
  catch{ toast('오프라인 상태 — 이 기기에서만 진행돼요'); }
  saveSession(); subscribe(code); startHeartbeat(); keepAwake();
  go('lobby'); confetti(60);
}

async function joinRoom(code, name){
  let v = null;
  try{ v = (await get(roomRef(code))).val(); }
  catch{ toast('연결 실패 — 인터넷을 확인해 주세요'); return false; }
  if (!v){ toast('그런 방이 없어요'); return false; }
  S.pid = uid(); S.isHost = false; S.code = code;
  S.room = { createdAt:v.createdAt||now(), host:v.host||'', status:v.status||'lobby',
    players:v.players||{}, teams:v.teams||{count:0,assign:{}}, scores:v.scores||{}, rotation:v.rotation||{}, used:v.used||{}, yut:v.yut||null };
  try{ await set(ref(db, `${ROOT}/rooms/${code}/players/${S.pid}`), { name, joinedAt:now(), seen:now() }); }catch{}
  saveSession(); subscribe(code); startHeartbeat(); keepAwake();
  go('lobby'); return true;
}

async function rejoin(sess){
  let v = null;
  try{ v = (await get(roomRef(sess.code))).val(); }catch{}
  if (!v || !v.players || !v.players[sess.pid]) return false;
  S.pid = sess.pid; S.code = sess.code; S.isHost = !!sess.isHost;
  S.room = { createdAt:v.createdAt||now(), host:v.host||'', status:v.status||'lobby',
    players:v.players||{}, teams:v.teams||{count:0,assign:{}}, scores:v.scores||{}, rotation:v.rotation||{}, used:v.used||{}, yut:v.yut||null };
  subscribe(sess.code); startHeartbeat(); keepAwake();
  go('lobby'); return true;
}

function leaveRoom(){
  if (S.unsub) S.unsub();
  clearInterval(S.hb);
  if (S.code && S.pid && !S.isHost) remove(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`)).catch(()=>{});
  Object.assign(S, { unsub:null, code:null, pid:null, isHost:false, room:null, draft:null, gameId:null, _lastPick:{} });
  clearSession(); go('home');
}

/* ══════════════════════════════════════════════
   계산
══════════════════════════════════════════════ */
const players = () => Object.entries(S.room?.players || {}).sort((a,b) => (a[1].joinedAt||0) - (b[1].joinedAt||0));
const pname = pid => S.room?.players?.[pid]?.name || '?';
/* ★ 관전(사회자) 기기는 「선수」가 아니다 — 태블릿을 공용 화면으로 세워둘 때 쓴다.
   players() = 방에 있는 전부(대기실 목록·하트비트용)
   playing()  = 실제로 겨루는 사람만. 팀 편성·역할 뽑기·순번·순위·리더보드는 전부 이쪽을 쓴다.
   ⚠️ 새로 「참가자 수」를 세는 코드를 쓸 때 players() 를 쓰면 태블릿이 선수로 끼어든다. */
/* 이 기기가 태블릿처럼 큰 화면인가 — 큰 화면 CSS(min-width:760 · min-height:640)와 **같은 기준**.
   ⚠️ 가로 폭만 보면 폰 가로 모드(926×428)가 걸린다. 높이를 같이 봐야 한다(디자인 시스템 규칙). */
const bigScreen = () => {
  /* ⚠️ 한 문장으로 `... and (...)` 이라고 쓰면 check.mjs 가 문자열 안의 `and (` 를
        **함수 호출로 오해**한다(끊어진 참조로 잡힌다). 두 번 물어보면 결과는 같다. */
  try{ return matchMedia('(min-width:760px)').matches
            && matchMedia('(min-height:640px)').matches; }
  catch{ return false; }
};
const isSpec = p => !!p?.spec;
const playing = () => players().filter(([,p]) => !isSpec(p));
const myName = () => pname(S.pid);
const isOn = p => !!p.bot || (now() - (p.seen || 0)) < 70000;   // 봇은 항상 접속중 취급

/* ── 테스트 봇 ─────────────────────────────────────────────
   혼자서 게임 도구를 돌려보려면 사람이 더 필요하다.
   ⚠️ 봇도 실제 players 노드에 쓴다(pid가 'bot_'으로 시작).
      로컬에만 두면 다음 스냅샷에서 지워진다(호스트가 players를 서버 값으로 덮어쓰므로).
      이렇게 하면 기존 코드(팀 편성·역할 배정·순위)가 전부 그대로 동작한다. */
/* ⚠️ 봇 이름에 사람 이름을 쓰지 말 것. 실존 인물과 겹쳐 오해를 산다.
   누가 봐도 가짜인 동물 이름만 쓴다. */
const BOT_NAMES = ['펭귄','다람쥐','너구리','수달','판다','햄스터','고양이','토끼','여우','곰','오리','참새'];
const isBot = pid => String(pid).startsWith('bot_');
const botCount = () => players().filter(([pid]) => isBot(pid)).length;

function addBots(n){
  const used = players().map(([,p]) => p.name);
  const upd = {};
  for (let i = 0; i < n; i++){
    const pid = 'bot_' + uid();
    const name = BOT_NAMES.find(x => !used.includes(x)) || ('봇' + (((Math.random()*900)|0) + 100));
    used.push(name);
    const rec = { name, joinedAt: now() + i, seen: now(), bot: true };
    S.room.players[pid] = rec;              // 낙관적 로컬 반영(오프라인에서도 보이게)
    upd['players/' + pid] = rec;
  }
  update(roomRef(S.code), upd).catch(()=>{});
}

function clearBots(){
  const upd = {};
  Object.keys(S.room.players || {}).filter(isBot).forEach(k => {
    delete S.room.players[k]; upd['players/' + k] = null;
  });
  const as = S.room.teams?.assign;
  if (as) Object.keys(as).filter(isBot).forEach(k => delete as[k]);
  Object.keys(S.room.rotation || {}).forEach(g => {
    S.room.rotation[g] = (S.room.rotation[g] || []).filter(x => !isBot(x));
  });
  if (Object.keys(upd).length) update(roomRef(S.code), upd).catch(()=>{});
  pushHostState();
  return Object.keys(upd).length;
}

/* 한 판(sc)이 어떤 사람(pid)에게 준 점수. calcPoints 와 **같은 규칙**을 쓴다.
   ⚠️ 팀전은 그 시점 assign 스냅샷으로 판단한다 — 나중에 팀을 다시 짜도 과거 점수가 안 깨진다. */
function scorePt(sc, pid){
  const w = sc.weight ?? (G(sc.gameId)?.weight ?? 1);
  let got = 0;
  (sc.order || []).forEach((entry, i) => {
    const base = rankPt(i) * w;
    if (sc.mode === 'team'){
      if (Number(sc.assign?.[pid]) === Number(entry)) got += base;
    }else if (entry === pid) got += base;
  });
  return got;
}

function calcPoints(){
  const pts = {};
  for (const [pid] of playing()) pts[pid] = 0;
  for (const sc of Object.values(S.room?.scores || {})){
    const w = sc.weight ?? (G(sc.gameId)?.weight ?? 1);
    (sc.order || []).forEach((entry, i) => {
      const base = rankPt(i) * w;
      if (sc.mode === 'team'){
        Object.entries(sc.assign || {}).forEach(([pid, t]) => {
          if (Number(t) === Number(entry) && pts[pid] != null) pts[pid] += base;
        });
      }else if (pts[entry] != null) pts[entry] += base;
    });
  }
  return pts;
}
const fmtPt = n => (Math.round(n*10)/10).toString().replace(/\.0$/,'');

function playedGames(){
  const m = {};
  for (const sc of Object.values(S.room?.scores || {})) m[sc.gameId] = (m[sc.gameId]||0) + 1;
  return m;
}

/* 아직 그 역할을 안 맡은 사람 중에서 뽑기 (전원 소진 시 리셋) */
function pickRole(gameId){
  const done = (S.room.rotation?.[gameId] || []).filter(p => S.room.players[p] && !isSpec(S.room.players[p]));
  const all = playing().map(([pid]) => pid);
  let pool = all.filter(p => !done.includes(p));
  let reset = false;
  if (!pool.length){ pool = all; reset = true; }
  const pick = pool[Math.floor(Math.random()*pool.length)];
  if (!S.room.rotation) S.room.rotation = {};
  S.room.rotation[gameId] = reset ? [pick] : [...done, pick];
  pushHostState();
  return { pick, reset };
}

function makeTeams(count){
  const all = playing().map(([pid]) => pid);
  for (let i = all.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
  const assign = {};
  all.forEach((pid, i) => { assign[pid] = i % count; });
  S.room.teams = { count, assign };
  pushHostState();
}

/* ══════════════════════════════════════════════
   진행 도구 — 제시어 덱 (몸으로 말해요 / 한글자로 말해요)
   ⚠️ 전부 이 기기 로컬 상태. Firebase에 올리지 않는다 —
      제시어가 다른 사람 폰에 뜨면 게임이 성립하지 않기 때문.
      최종 순위만 기존 scores 흐름으로 저장한다.
══════════════════════════════════════════════ */
const DEFAULT_CATS = ['animal','job','thing','food'];
/* 한 단어 릴레이 기본 범위 — 한 단어로 설명이 되는 것들만.
   ⚠️ 속담·사자성어는 `use` 에 relay 를 안 달았다(문장·한자라 한 단어로 못 잇는다). */
const RELAY_CATS = ['animal','food','thing','job','movie','char','spot','nature'];

/* 「한글자로 말해요」에서 앱이 뽑아주는 글자.
   ⚠️ 아무 글자나 넣으면 안 된다 — 억양·길이만으로 표현이 되는 **소리 흉내에 가까운 글자**라야
      게임이 굴러간다("의","례" 같은 건 입에 붙지 않아 그냥 막힌다).
   ⚠️ 팀마다 **다른 글자**를 준다(같으면 뒷 팀이 앞 팀 방식을 그대로 베낀다). */
const ONE_LETTERS = ['짜','뿅','쿵','삐','옹','빵','딩','랄','뭐','헐',
                     '캬','툭','펑','씩','웅','얍','꽥','뚝','칙','방',
                     '콩','딱','뽀','슝','팡','킁','훅','냠','찡','붕'];

/* 아직 안 쓴 글자 중에서 하나. 다 쓰면 처음부터(팀 수가 글자 수를 넘길 일은 없지만 방어). */
/* 이번 팀 차례의 글자를 준비해 둔다. ⚠️ 렌더 중에 뽑으면 안 된다 —
   render()는 스냅샷마다 불리므로 글자가 매번 바뀌어 버린다. 턴이 바뀔 때만 뽑는다. */
/* 그 팀의 선수 pid (사회자 기기는 뺀다) */
function ensureLetter(){
  const p = S.play; if (!p || p.mode !== 'oneword') return;
  const t = p.order[p.turn];
  if (!p.letters[t]) p.letters[t] = drawLetter();
}

function drawLetter(){
  const p = S.play;
  const used = Object.values(p.letters || {});
  const pool = ONE_LETTERS.filter(x => !used.includes(x));
  const from = pool.length ? pool : ONE_LETTERS;
  return from[(Math.random() * from.length) | 0];
}
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

function startDeckTool(){
  const teams = S.room.teams || {count:0};
  S.play = {
    gameId:S.gameId, kind:'deck', phase:'setup',
    // ⚠️ 한 단어 릴레이는 **방식이 고정**이다(고르는 화면을 띄우지 않는다).
    //    몸으로/한글자는 같은 게임 안의 두 방식이라 setup 에서 고른다.
    mode: S.gameId === 'relay' ? 'relay' : 'body',   // 'body' | 'oneword' | 'relay'
    cats: S.gameId === 'relay' ? [...RELAY_CATS] : [...DEFAULT_CATS], sec:60,
    order:Array.from({length:teams.count}, (_,i) => i),
    turn:0, letters:{}, results:{},

/* ── 🎵 노래 맞히기 ──────────────────────────────────────────

/* ── 🧠 상식 퀴즈 ────────────────────────────────────────────
   ⚠️ 초성 퀴즈와 흐름이 **딱 한 군데** 다르다. 그 한 군데가 이 게임의 핵심이다.
      초성 퀴즈  : 답이 하나로 떨어지므로 → 맞힌 사람을 **바로** 탭한다.
      상식 퀴즈  : 답이 자유 문장이라 **누군가는 정답을 알아야 판정이 된다.**
      그렇다고 노래 맞히기처럼 정답을 진행자에게만 보여주면(.priv) 사회자 전담이 되어
      선수가 한 명 빠진다. → 그래서 **순서를 뒤집었다.**
        run(문제만)  →  「정답 공개」  →  reveal(정답 + 누가 맞혔나)  →  다음
      정답이 뜬 뒤에 탭하므로 다 같이 보고 판정한다. 옥신각신할 일이 없고,
      진행자도 정답을 미리 모르니 **같이 맞힐 수 있다**(mc:'help' 인 이유).
   ⚠️ 그래서 `.priv` 를 붙이면 안 된다 — 전원이 봐야 하는 화면이다(초성 퀴즈와 같다).
   ⚠️ 그리고 **run 단계에는 정답 문자열이 어디에도 렌더되면 안 된다.**
      이 두 가지를 E2E 에 못으로 박아뒀다. 화면을 고칠 때 깨면 게임이 조용히 성립하지 않는다.
   ⚠️ 점수는 따로 안 들고 log 에서 매번 센다(초성 퀴즈와 같은 이유 — 취소가 pop 한 줄). */
/* 기본으로 켜두는 범위 — 세대·성별이 섞여도 누구 하나는 아는 것들.
   ⚠️ 세계사·예술문학·스포츠·IT 는 일부러 뺐다. 문제로는 좋지만 아는 사람만 아는 쪽으로
      쏠려서 첫 판부터 켜두면 한 사람이 독식한다 — 원하면 켜서 쓰는 쪽이 맞다. */
const QUIZ_CATS = ['kor','world','sci','life','pop','trivia'];

/* 선택한 범위의 문제를 { w:문제, a:정답, c:범위 } 로 펴서 돌려준다.
   ⚠️ 문제를 `w` 에 담는 이유 — 중복 방지 헬퍼(freshPick/markUsed)가 `w` 를 본다.
      노래 맞히기가 곡 제목을 `w` 에 담는 것과 똑같은 이유다. */
function quizPool(keys){
  const seen = new Set(), out = [];
  for (const k of keys)
    for (const [q, a] of (QUIZ_DECKS[k]?.qs || []))
      if (!seen.has(q)){ seen.add(q); out.push({ w:q, a, c:k }); }
  return out;
}

function startQuizTool(){
  S.play = {
    gameId:S.gameId, kind:'quiz', phase:'setup',
    cats:[...QUIZ_CATS], n:15,
    sec:5,                       // 생각 시간(초). 0 이면 진행자가 직접 공개한다
    left:0, deck:[], di:0, cur:null, log:[], _t:null,
  };
  go('play');
}
function quizScores(){
  const m = {};
  playing().forEach(([pid]) => { m[pid] = 0; });
  (S.play?.log || []).forEach(x => { if (x.by != null && m[x.by] != null) m[x.by]++; });
  return m;
}
function quizBuildDeck(){
  const p = S.play;
  const { list, wrapped } = freshPick(p.gameId, quizPool(p.cats), p.n || 15);
  p.wrapped = wrapped;
  p.deck = shuffle(list); p.di = 0;
}
function quizNextCard(){
  const p = S.play;
  if (p.di >= p.deck.length) quizBuildDeck();
  p.cur = p.deck[p.di++] || null;
}
function quizNext(){
  const p = S.play;
  if (p.log.length >= p.n) quizFinish();
  else { quizNextCard(); p.phase = 'run'; render(true); startCountdown(quizAutoShow); }
}
/* 시간이 다 되면 진행자가 안 눌러도 정답이 나온다 — 「바로 결과」 */
function quizAutoShow(){
  const p = S.play;
  if (!p || p.kind !== 'quiz' || p.phase !== 'run') return;
  stopPlayTimer();                       // 어디서 불려도 시간이 계속 흐르면 안 된다
  p.phase = 'reveal'; p.left = 0;
  SFX.end(); vib([30,50,30]); render(true);
}
function quizFinish(){
  const p = S.play;
  p.phase = 'done'; stopPlayTimer();
  markUsed(p.gameId, p.log.map(x => x.w));
  SFX.end(); vib([40,60,40]); render(true);
}

/* ── 🔠 초성 퀴즈 ────────────────────────────────────────────
   ⚠️ 이 게임의 비밀은 「화면」이 아니라 「정답 문자열」이다.
      태블릿을 가운데 두고 다 같이 보므로 .priv 로 가릴 대상이 없다 —
      대신 **정답은 맞히기 전까지 어떤 화면에도 렌더하지 않는다.**
      그래서 폰을 잡은 진행자도 같이 맞힐 수 있다(mc:'help' 인 이유).
   ⚠️ 점수를 따로 들고 있지 않고 log 에서 매번 센다. 상태가 하나뿐이라
      「방금 취소」가 log.pop() 한 줄로 끝나고, renderSig 의 log.length 가
      점수 변화를 자동으로 잡는다(따로 서명 필드를 안 늘려도 된다). */
/* 기본으로 켜두는 범위 — 넓을수록 판을 거듭해도 문제가 덜 겹친다(469문제 ≈ 31판).
   ⚠️ 사자성어는 일부러 뺐다. 문제로는 아주 좋지만 난이도가 확 뛰어서
      첫 판부터 켜두면 아무도 못 맞히는 판이 나온다 — 원하면 켜서 쓰는 쪽이 맞다. */
const CHO_CATS = ['movie','music','char','animal','spot','food','place'];

/* ⚠️ 초성 퀴즈는 제시어 덱을 **그대로 쓰면 안 된다** — 답이 여러 개인 문제가 나온다.
   「ㄱㄹ · 동물」이면 기린도 고래도 맞다. 진행자가 판정을 못 하니 게임이 성립하지 않는다.

   실측해보니 원인은 덱 내부 중복보다 **단어 길이**였다:
     1글자 27% · 2글자 19% 충돌  /  3글자 1% · 4글자 2% · 5글자↑ 0%
   짧으면 덱에 없는 답까지 쏟아진다(「ㅂ·동물」= 뱀·벌·붕어·백조…).
   그래서 두 겹으로 거른다:
     ① 공백 뺀 길이 3글자 이상만
     ② 그러고도 초성이 겹치는 것은 **양쪽 다** 뺀다
        (하나만 남겨도 사람은 다른 답을 외친다 — 애초에 그 초성을 안 내는 게 맞다)
   → 지금 1,150개 중 832개가 출제 가능(v0.17.0 확장 후). 4글자로 올리면 반토막 난다. */
const CHO_MIN_LEN = 3;

function choWords(keys){
  const seen = new Set(), all = [];
  for (const k of keys)
    for (const w of (WORD_DECKS[k]?.words || []))
      if (String(w).replace(/\s/g, '').length >= CHO_MIN_LEN && !seen.has(w)){
        seen.add(w); all.push({ w, c:k });
      }
  const by = {};
  all.forEach(x => { (by[cho(x.w)] ||= []).push(x); });
  return all.filter(x => by[cho(x.w)].length === 1);
}

function choBuildDeck(){
  const p = S.play;
  const { list, wrapped } = freshPick(p.gameId, choWords(p.cats), p.n || 15);
  p.wrapped = wrapped;
  p.deck = shuffle(list); p.di = 0;
}

function startChoTool(){
  S.play = {
    gameId:S.gameId, kind:'cho', phase:'setup',
    cats:[...CHO_CATS], n:15,
    deck:[], di:0, cur:null, log:[], _t:null,
  };
  go('play');
}

/* log → {pid: 맞힌 개수}. 못 맞힌 문제는 by:null 이라 안 세어진다. */
function choScores(){
  const m = {};
  playing().forEach(([pid]) => { m[pid] = 0; });
  (S.play?.log || []).forEach(x => { if (x.by != null && m[x.by] != null) m[x.by]++; });
  return m;
}

function choNext(){
  const p = S.play;
  if (p.log.length >= p.n) choFinish();
  else { nextWord(); p.phase = 'run'; render(true); }
}

/* 종료 — 이 판에 나온 문제를 기록해 다음 판에서 빼준다 */
function choFinish(){
  const p = S.play;
  p.phase = 'done'; stopPlayTimer();
  markUsed(p.gameId, p.log.map(x => x.w));
  SFX.end(); vib([40,60,40]); render(true);
}

function buildDeck(){
  const p = S.play;
  const seen = new Set();
  const all = [];
  for (const k of p.cats)
    for (const w of (WORD_DECKS[k]?.words || []))
      if (!seen.has(w)){ seen.add(w); all.push({ w, c:k }); }   // 카테고리 교차 중복 제거
  // 지난 판에 나온 제시어는 빼고 낸다(한 팀이 한 판에 20개쯤 쓰므로 넉넉히 잡는다)
  const { list, wrapped } = freshPick(p.gameId, all, 30);
  p.wrapped = wrapped;
  p.deck = shuffle(list); p.di = 0;
}

function nextWord(){
  const p = S.play;
  // ⚠️ 재고갈 시에도 초성 덱은 초성 규칙으로 다시 채운다(여기서 buildDeck 을 부르면
  //    두 글자 단어가 슬그머니 섞여 들어와 답이 여러 개인 문제가 되살아난다)
  if (p.di >= p.deck.length){ p.kind === 'cho' ? choBuildDeck() : buildDeck(); }
  p.cur = p.deck[p.di++] || { w:'—', c:null };
}

function stopPlayTimer(){ if (S.play?._t){ clearInterval(S.play._t); S.play._t = null; } }

function renderTimer(){
  const p = S.play; if (!p || p.phase !== 'run' || !p.sec) return;
  const bar = document.getElementById('t-bar'), sec = document.getElementById('t-sec');
  if (!bar || !sec) return;
  const pct = Math.max(0, p.left / p.sec) * 100;
  bar.style.width = pct + '%';
  const s = Math.max(0, Math.ceil(p.left));
  if (sec.textContent !== s + '초') sec.textContent = s + '초';
  // ⚠️ 경고 구간을 10초로 고정하면 5초 타이머는 처음부터 끝까지 빨갛다 — 길이에 비례시킨다
  const warn = p.left <= Math.min(10, p.sec * 0.4);
  bar.parentElement.classList.toggle('warn', warn);
  sec.classList.toggle('warn', warn);
}

/* 생각 시간 카운트다운 — 다 되면 onEnd() 를 부른다(상식 퀴즈의 자동 정답 공개).
   ⚠️ p.left 는 **renderSig() 에 넣지 않는다** — 매 틱 전체 재렌더가 돌아 화면이 깜빡인다.
      숫자는 renderTimer() 가 #t-sec / #t-bar 를 직접 갈아끼운다(200ms). */
function startCountdown(onEnd){
  const p = S.play;
  stopPlayTimer();
  if (!p || !p.sec) return;              // 「끄기」면 타이머 없이 진행자가 직접 공개한다
  p.left = p.sec;
  let lastTick = Math.ceil(p.left);
  p._t = setInterval(() => {
    p.left -= 0.2;
    const t = Math.ceil(p.left);
    if (t !== lastTick){ lastTick = t; if (t > 0 && t <= 5) SFX.tick(); }
    if (p.left <= 0){ stopPlayTimer(); onEnd(); return; }
    renderTimer();
  }, 200);
}

function beginTurn(){
  const p = S.play;
  p.hits = []; p.left = p.sec; p.phase = 'run';
  // ⚠️ 여기서 덱을 건드리면 안 된다.
  //    buildDeck() → 팀마다 덱이 되감겨 2팀이 1팀과 똑같은 제시어를 받는다.
  //    nextWord() → 지난 턴 끝에 이미 뽑아둔 제시어가 그냥 버려진다(턴마다 1개씩 증발).
  //    덱은 판 시작(pl-start)에서 한 번 만들고 첫 장까지 뽑아둔다.
  SFX.go(); vib(20);
  render();
  stopPlayTimer();
  let lastTick = Math.ceil(p.left);
  p._t = setInterval(() => {
    p.left -= 0.2;
    const s = Math.ceil(p.left);
    if (s !== lastTick){ lastTick = s; if (s > 0 && s <= 5) SFX.tick(); }
    if (p.left <= 0){ endTurn(); return; }
    renderTimer();
  }, 200);
}

function endTurn(){
  const p = S.play;
  stopPlayTimer();
  p.left = 0;
  p.results[p.order[p.turn]] = p.hits.slice();
  p.phase = 'turnEnd';
  SFX.end(); vib([40,60,40]);
  render();
}

function markWord(ok){
  const p = S.play; if (p.phase !== 'run') return;
  p.hits.push({ w:p.cur.w, ok });
  ok ? SFX.ok() : SFX.pass();
  vib(ok ? 16 : 8);
  nextWord();
  render();
}

/* 공통: 도구 결과 → 기존 순위 입력 화면으로 넘긴다(동점·이견은 거기서 손으로 조정) */
function toScore(order, mode){

  S.draft = { gameId:p.gameId, mode, order,
    weight:G(p.gameId)?.weight ?? 1, assign:JSON.parse(JSON.stringify(teams.assign || {})) };

}

function deckToScore(){

  const cnt = t => (p.results[t] || []).filter(x => x.ok).length;
  toScore([...p.order].sort((a,b) => cnt(b) - cnt(a)), 'team');
}

/* ── 공통 시간 표시/스톱워치 ── */
const fmtSw = s => s == null ? '실패'
  : (s >= 60 ? `${Math.floor(s/60)}분 ${(s%60).toFixed(1)}초` : `${s.toFixed(1)}초`);

function swBegin(){
  const p = S.play; p.t0 = Date.now(); p.elapsed = 0;
  stopPlayTimer();
  p._t = setInterval(() => {
    p.elapsed = (Date.now() - p.t0) / 1000;
    const el = document.getElementById('sw-sec');
    if (el) el.textContent = fmtSw(p.elapsed);
  }, 100);
}

function go(view){
  if (view !== 'play') stopPlayTimer();
  S.ask = null;              // 화면이 바뀌면 열려 있던 경고창은 의미가 없다

const av = (pid, name, cls='') =>
  `<div class="av ${cls}" style="background:${avColor(pid)}">${h(String(name||'?')[0])}</div>`;

/* ── 렌더 게이팅 ────────────────────────────────────────────
   render()는 Firebase 스냅샷마다 호출된다. 각 기기가 20초마다 하트비트(seen)를 쓰므로
   그대로 두면 아무도 아무것도 안 해도 수 초마다 화면 전체가 다시 그려져 깜빡인다.
   → 화면에 실제로 보이는 값만 뽑아 서명(signature)을 만들고, 같으면 렌더를 건너뛴다.
   ⚠️ seen(타임스탬프)이 아니라 isOn(불리언)을 넣는 게 핵심. 안 그러면 매번 서명이 바뀐다. */
let _lastView = null, _lastSig = null;

function renderSig(){
  const r = S.room;
  return JSON.stringify([
    S.view, S.gameId, S.online, S.isHost, S.code,
    r ? Object.entries(r.players).map(([k,p]) => [k, p.name, isOn(p)?1:0, (p.host||k===r.host)?1:0]) : 0,
    r?.teams || 0, r?.scores || 0, r?.rotation || 0, r?.used || 0,
    // ⚠️ yut 을 빼면 각자 폰이 말판 변화에 갱신되지 않는다(참가자 화면이 멈춘다)
    r?.yut || 0,
    S.draft?.order || 0, S._lastPick || 0,
    // ⚠️ 던진 결과의 전달 표시(보내는 중 → 전달됨 / 못 받음)가 안 바뀌면 폰이 멈춘 것처럼 보인다
    S.yutSent?.at || 0, S.yutSent?.ok ?? 0,
    // ⚠️ 경고창을 빼면 창이 뜨지도 닫히지도 않는다
    S.ask?.go || 0, S.histI,
    // ⚠️ 타이머의 left/elapsed(매 틱 변화)는 넣지 않는다 — 재렌더 폭주가 된다.
    //    타이머 숫자는 각 도구의 인터벌이 DOM을 직접 갱신한다.
    S.play ? [S.play.kind, S.play.phase, S.play.turn ?? 0, S.play.di ?? 0,
      (S.play.hits || []).length, S.play.mode ?? 0, (S.play.cats || []).join(''),
      S.play.sec ?? 0, S.play.letters || 0, S.play.shots ?? 0, S.play.round ?? 0,
      (S.play.sel || []).join(''), S.play.rec || 0,
      S.play.pts || 0, S.play.votes || 0, S.play.vi ?? -1,
      (S.play.picked || []).join(''), S.play.judged || 0, S.play.cur?.t || 0,
      S.play.sen || 0, S.play.card || 0, S.play.cnt ?? 0, S.play.sit || 0,
      S.play.reading ?? -1, S.play.n ?? 0, S.play.cur?.w || 0, S.play.useIdx ?? 0,
      (S.play.skins || []).join(''),
      !!S.play.show, !!S.play.pol, !!S.play.doc, !!S.play.incHost,
      !!S.play.running, !!S.play.over, S.play.sul || 0,
      (S.play.pool || []).length, (S.play.log || []).length,
      Object.keys(S.play.results || {}).length] : 0,
  ]);
}

/* 재렌더로 입력 포커스·커서를 잃지 않게 보존 (이름 바꾸는 중 남이 입장해도 안 날아감) */
function grabFocus(){
  const el = document.activeElement;
  if (!el || !el.id || !$('#view').contains(el)) return null;
  return { id:el.id, val:el.value, s:el.selectionStart, e:el.selectionEnd };
}
function restoreFocus(f){
  if (!f) return;
  const el = document.getElementById(f.id); if (!el) return;
  el.value = f.val; el.focus();
  try{ el.setSelectionRange(f.s, f.e); }catch{}
}

/* 경고창을 그린다. #view 안에 **맨 뒤 형제로** 붙여 bind() 가 버튼을 잡게 한다
   (position:fixed 라 어느 컨테이너 안에 있든 화면 전체를 덮는다).
   ⚠️ `.two` 같은 레이아웃 래퍼 **안**에 들어가면 안 되므로 render() 에서 이어 붙인다. */
function vAsk(){
  const q = S.ask; if (!q) return '';
  return `<div class="askov" data-act="ask-no"><div class="askbox" data-act="ask-stay">
    <div class="e">${q.emoji || '⚠️'}</div>
    <div class="t">${h(q.title)}</div>
    ${(q.lose || []).length ? `<ul class="asklose">${q.lose.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
    ${q.safe ? `<p class="safe">${q.safe}</p>` : ''}
    <div class="stack">
      <button class="btn dan" data-act="ask-yes">${h(q.ok || '그래도 나가기')}</button>
      <button class="btn gh" data-act="ask-no">${h(q.no || '취소')}</button>
    </div>
  </div></div>`;
}
/* ⚠️ lose[] 와 safe 는 상수 문자열이라 escapeHtml 없이 들어간다(<b> 를 쓰려고).
      사람 이름 같은 값을 넣을 때는 반드시 h() 를 거칠 것. */
function askLeave(){
  const pts = calcPoints()[S.pid];
  const mine = S.isHost
    ? ['진행자 기기가 사라져서 <b>아무도 순위를 저장할 수 없어요</b>',
       '방 코드를 잊으면 <b>지금까지의 점수로 못 돌아와요</b>']
    : ['다시 들어오면 <b>새 사람으로 취급돼요</b>',
       `지금까지 쌓은 <b>내 점수${pts ? ` ${fmtPt(pts)}점` : ''}이 사라져요</b>`];
  S.ask = { emoji:'🚪', title:'방에서 나갈까요?', lose:mine,
    safe:'지금까지의 순위는 <b>홈 화면 「지난 기록」</b>에 남아서 나중에 다시 볼 수 있어요.',
    ok:'그래도 나가기', go:'leave-go' };
  render(true);
}

function render(force){
  const sig = renderSig();
  if (!force && sig === _lastSig) return;     // 바뀐 게 없으면 손대지 않는다
  const viewChanged = S.view !== _lastView;
  _lastSig = sig; _lastView = S.view;

  const back = $('#hd-back'), title = $('#hd-t'), code = $('#hd-code'), dot = $('#hd-dot');
  const inRoom = !!S.code;
  dot.style.display = inRoom ? '' : 'none';
  dot.classList.toggle('off', !S.online);
  code.style.display = inRoom ? '' : 'none';
  code.innerHTML = inRoom
    ? `${h(S.code)}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8h16v-8"/><path d="M12 3v13"/><path d="M8 7l4-4 4 4"/></svg>` : '';
  // 탭 루트(대기실·게임·순위·설정)는 하단 탭으로 오가므로 뒤로가기는 하위 화면에만 둔다
  back.style.display = ['game','play','score','yut','hist'].includes(S.view) ? '' : 'none';
  // 하단 탭 — 방 안 + 진행 화면이 아닐 때만. 하위 화면은 부모 탭을 켠다.
  const nav = $('#nav');
  const showNav = inRoom && S.view !== 'play' && S.view !== 'home';
  nav.style.display = showNav ? '' : 'none';
  $('#app').classList.toggle('has-nav', showNav);
  const tabOf = { lobby:'lobby', yut:'lobby', games:'games', game:'games', score:'games',
                  board:'board', hist:'board', settings:'settings' }[S.view];
  nav.querySelectorAll('.nav-b').forEach(b => b.classList.toggle('on', b.dataset.nav === tabOf));
  title.textContent = ({ home:'숙소 게임', lobby:'대기실', games:'게임 고르기',
    game:G(S.gameId)?.name || '게임', play:G(S.gameId)?.name || '진행 중',
    score:'순위 입력', board:'종합 순위', settings:'설정', yut:'윷 던지기',
    hist:'지난 기록' })[S.view] || '숙소 게임';

  const v = $('#view');
  const keep = grabFocus();
  v.innerHTML = ({ home:vHome, lobby:vLobby, games:vGames, game:vGame, play:vPlay,
    score:vScore, board:vBoard, settings:vSettings, yut:vYutPhone,
    hist:vHist })[S.view]() + vAsk();

  // 화면 전환일 때만 진입 애니메이션. 제자리 갱신은 애니메이션 없이 조용히 교체한다.
  if (viewChanged){
    v.classList.remove('noanim','enter'); void v.offsetWidth; v.classList.add('enter');
  }else{
    v.classList.remove('enter'); v.classList.add('noanim');
  }

  bind(v);
  restoreFocus(keep);
  snapRoom();          // 점수가 바뀌었으면 이 기기에 최종 순위를 갈무리해 둔다
}

/* 접속 끊김 표시는 시간이 흘러야 바뀌므로(서명에 seen을 안 넣음) 주기적으로 확인만 한다.
   서명이 그대로면 render()가 알아서 아무것도 안 한다. */
setInterval(() => { if (S.code) render(); }, 15000);

$('#hd-back').onclick = () => {
  vib();
  if (S.view === 'play'){ act('pl-quit', {}); return; }
  if (S.view === 'score'){ S.draft = null; go('game'); }
  else if (S.view === 'game') go('games');
  else if (S.view === 'hist') go('home');
  else go('lobby');
};
$('#hd-code').onclick = shareRoom;
$('#nav').querySelectorAll('.nav-b').forEach(b => {
  b.onclick = () => {
    vib();
    if (S.view === 'score') S.draft = null;      // 순위 입력 도중 탭을 옮기면 초안은 버린다
    go(b.dataset.nav);
  };
});

async function shareRoom(){
  const url = `${location.origin}${location.pathname}?r=${S.code}`;
  const text = `🎲 숙소 게임 · 방 코드 ${S.code}\n${url}`;
  try{
    if (navigator.share){ await navigator.share({ title:'숙소 게임', text }); return; }
    await navigator.clipboard.writeText(text);
    toast('방 코드와 링크를 복사했어요');
  }catch{ toast(`방 코드: ${S.code}`); }
}

const offBanner = () => S.online ? '' :
  `<div class="banner warn"><span>⚠️</span><span>인터넷 끊김 — ${S.isHost ? '이 기기에서 계속 진행하고, 연결되면 자동으로 맞춰져요' : '호스트 화면을 봐주세요'}</span></div>`;

/* ── 홈 ── */
/* 윷놀이 진행 중 배너 — 각자 폰에서 「윷 던지기 / ✋ 잠시!」로 들어가는 **유일한 입구**다.
   ⚠️ 예전엔 홈에만 있었다. 그런데 참가자는 입장하면 **대기실**에 머무르므로
      「잠시!」를 누르려면 홈으로 되돌아가야 했다 — 사실상 못 쓰는 기능이었다.
      그래서 홈과 대기실 **양쪽**에 띄운다.
   ⚠️ vHome 은 방에 들어가기 **전에도** 그려진다 → S.room 이 null 이다.
      여기서 S.room.yut 을 옵셔널 체이닝 없이 쓰면 부팅 때 모듈 전체가 죽는다. */
function yutBanner(){
  const y = S.room?.yut; if (!y) return '';
  const mine = myTeam() === y.turn && y.phase === 'play';
  return `
    <button class="g" style="${gcVars('#8878AE')};margin-bottom:10px" data-act="go-yut">
      <div class="g-ic">🎲</div>
      <div class="g-b"><div class="g-n">${mine ? '내 차례! 윷을 던지세요' : '훈민정음 윷놀이 진행 중'}</div>
        <div class="g-m"><span>${y.phase === 'ended'
          ? h(teamName(y.winner)) + ' 승리'
          : h(teamName(y.turn)) + ' 차례 · 탭해서 윷 던지기 / ✋ 잠시!'}</span></div></div>
      <div class="g-ar">›</div>
    </button>`;
}

/* 홈의 「지난 기록」 — 방이 사라져도 여기서 다시 본다 */
function histHtml(){
  const list = histAll();
  if (!list.length) return '';
  return `<div class="sec" style="margin-top:22px">지난 기록 <span class="n">${list.length}</span></div>
    ${list.slice(0, 6).map((r,i) => `
      <button class="rec" data-act="hist-open" data-i="${i}">
        <div class="rec-d"><b>${new Date(r.last).getDate()}</b><span>${fmtDay(r.last).split(' ')[0]}</span></div>
        <div class="rec-b">
          <div class="rec-t">${r.rows?.[0] ? `🥇 ${h(r.rows[0].n)} ${fmtPt(r.rows[0].p)}점` : '기록'}
            ${r.code === S.code ? '<span class="chip hot">지금 방</span>' : ''}</div>
          <div class="rec-s">${fmtTime(r.last)} · ${r.rows?.length || 0}명 · ${r.games?.length || 0}판 · ${h(r.code)}번 방</div>
        </div>
        ${r.code === S.code ? '' : `<span class="rec-x" data-act="hist-del" data-i="${i}">✕</span>`}
      </button>`).join('')}
    ${list.length > 6 ? `<p class="note" style="text-align:center">아래 ${list.length - 6}개는 새 기록이 쌓이면 밀려납니다</p>` : ''}`;
}

/* 지난 기록 상세 — 저장해둔 최종 순위 그대로. 방이 없어도 열린다. */

          <div class="note" style="font-size:12px">${(x.top||[]).map((n,i) => `${MEDAL[i]} ${h(n)}`).join('  ')}</div>

    <div style="height:16px"></div>

        앱을 지우거나 브라우저 기록을 지우면 같이 사라집니다.</p>
      ${r.code === S.code ? `<p class="note" style="margin-top:8px;color:var(--amber)">

}

/* ── 대기실 ── */
function vLobby(){
  const ps = players();
  const nPlay = playing().length, nSpec = ps.length - nPlay;
  const meSpec = isSpec(S.room.players?.[S.pid]);
  const t = S.room.teams || {count:0,assign:{}};
  const played = Object.values(S.room.scores || {}).length;

  /* 참가자는 칩으로 — 점수는 🏆 탭에서 본다. 대기실에서 알고 싶은 건 「누가 들어왔나」뿐 */
  const chips = ps.map(([pid,p],i) => `
    <div class="pchip ${pid===S.pid?'me':''} ${isSpec(p)?'spec':''} ${isOn(p)?'':'off'}" style="animation-delay:${i*30}ms">
      ${av(pid, p.name, 'sm')}
      <span class="nm">${h(p.name)}</span>
      ${pid===S.pid ? '<span class="chip hot">나</span>' : ''}
      ${isSpec(p) ? '<span class="chip sky">📺 사회자</span>'
        : ((p.host || pid===S.room.host) ? '<span class="chip">진행자</span>' : '')}
      ${p.bot ? '<span class="chip elec">🧪</span>' : ''}
      ${isOn(p) ? '' : '<span class="chip">끊김</span>'}
      ${S.isHost && pid!==S.pid ? `<button class="x" data-act="kick" data-pid="${pid}" aria-label="내보내기">✕</button>` : ''}
    </div>`).join('');

  let teamBox = '';
  if (t.count > 1){
    const groups = Array.from({length:t.count}, () => []);
    Object.entries(t.assign || {}).forEach(([pid,i]) => {
      const pl = S.room.players[pid]; if (pl && !isSpec(pl)) groups[i]?.push(pid); });
    teamBox = groups.map((g,i) => `
      <div class="tm" style="--tc:${TEAM_COLORS[i]}">
        <div class="tm-h"><span class="sw"></span>${i+1}팀 <span class="chip">${g.length}명</span></div>
        <div class="tm-p">${g.map(p => `<span class="tag">${h(pname(p))}</span>`).join('') || '<span class="note">비어있음</span>'}</div>
      </div>`).join('');
  }

  const step1 = nPlay >= 2, step2 = t.count > 1;
  return `
    ${offBanner()}
    <div class="two"><div>
    <div class="rc">
      <div class="rc-row">
        <div style="flex:1;min-width:0">
          <div class="rc-lbl">Room Code</div>
          <div class="rc-v">${h(S.code)}</div>
        </div>
        <button class="rc-share" data-act="share">공유</button>
      </div>
      <div class="rc-hint">친구들이 이 코드를 입력하면 바로 들어와요</div>

/* ── 게임 목록 ── */

   ⚠️ 사회자 필요 여부(mc)는 개인전·팀전과 **직교하는 축**이라 묶는 기준으로 쓰지 않는다.
      묶음은 mode 로만 하고, mc 는 칩으로 표시한다. */
function vGames(){
  const done = playedGames();
  const teams = S.room.teams?.count || 0;

  const card = (g,i) => `
    <button class="g ${done[g.id]?'done':''}" data-act="game" data-id="${g.id}" style="${gcVars(g.color)};animation-delay:${i*45}ms">
      <div class="g-ic">${g.emoji}</div>
      <div class="g-b">
        <div class="g-n">${h(g.name)}</div>
        <div class="g-l">${h(g.line || g.tag)}</div>
        <div class="gmeta">
          <span>👥 ${g.minP || 2}명+</span>
          ${g.mins ? `<span>⏱ ${h(g.mins)}</span>` : ''}
          ${g.mc==='need' ? '<span class="chip sky">📺 사회자</span>' : ''}
          ${done[g.id] ? `<span class="chip mint">✓ ${done[g.id]}판</span>` : ''}
        </div>
      </div>
      <div class="g-ar">›</div>
    </button>`;

  const group = (label, sub, list) => !list.length ? '' : `

  const solo = GAMES.filter(g => g.mode !== 'team');
  const team = GAMES.filter(g => g.mode === 'team');

  return `
    ${offBanner()}
    ${group('개인전', '', solo)}
    ${group('팀전', teams > 1 ? `${teams}팀으로 나뉘어 있어요` : '대기실에서 팀을 먼저 나눠주세요', team)}`;
}

function vGame(){

    ${offBanner()}
    <div class="two"><div>

            ${g.privScreen ? '<b style="color:var(--amber)">단 이 게임은 그 화면을 가운데 두지 말고 사회자가 들고 보세요</b> — 화면에 답이 있습니다.' : ''}</span></span>

      return `<div class="mcbox ${g.mc==='need'?'need':''}">

        <span><b>${g.mc==='need' ? '겨루지 않는 사회자가 있어야 깔끔해요' : '지금 안 뛰는 사람이 폰을 맡아주세요'}</b>

      </div>`;
    })() : ''}

    ${g.todo ? `<div class="warnbox"><span class="i">📝</span><span>${h(g.todo)}</span></div>` : ''}

    <!-- ⚠️ 설명 순서를 고정한다: 무슨 게임 → 뭐가 필요 → 어떻게 → 누가 이김.

        ${done.length && S.isHost ? `<div style="height:10px"></div><button class="btn gh sm" data-act="rot-reset" style="width:100%">순번 초기화</button>` : ''}
      </div>` : ''}
    <div class="card">
      ${(g.how || []).length ? `
        <div class="sec" style="margin:0 0 11px">이렇게 진행합니다</div>
        <div class="steps">
          ${g.how.map(x => `<div class="step"><div class="n"></div><div class="t">${h(x)}</div></div>`).join('')}

        <div class="in"><div class="rules">${g.rules}</div></div>

    <!-- 시작 버튼은 하단 고정 — 긴 규칙을 스크롤하다 놓치던 것을 막는다 -->
    <div class="actbar">
      ${g.tool && S.isHost ? `
        <div class="stack">
          <button class="btn pri" data-act="tool-start">${h(g.toolLabel||'▶ 진행 도구로 시작하기')}</button>
          <button class="btn gh sm" data-act="score-start" style="width:100%">도구 없이 순위만 직접 입력</button>

      : `<button class="btn pri" data-act="score-start">✅ 게임 끝 — 순위 입력</button>`}

    </div></div>`;

/* ── 진행 도구 라우터 ── */
function vPlay(){
  const p = S.play; if (!p) return '';
  switch (p.kind){
    case 'deck':  return vDeck();
    case 'cho':   return vCho();
    case 'quiz':  return vQuiz();
    case 'song':  return vSong();
    case 'yut':   return vYut();
    case 'noise': return vNoise();
    case 'cup':   return vCup();
    case 'act':   return vAct();
    case 'smile': return vSmile();
  }
  return '';
}

/* 남은 제시어 박스 — 두 덱 게임이 같이 쓴다(같은 문제를 다르게 보여주면 헷갈린다) */
function stockBox(gid, total, need, unit){
  const used = usedWords(gid).size;
  const left = Math.max(0, total - used);
  if (!used) return `<div class="stockbox">
      <div class="v">${total}</div>
      <div class="t"><b>${unit} ${total}개</b><br>같은 ${unit}는 다음 판에 안 나와요</div>
    </div>`;
  const low = left < need;
  return `<div class="stockbox ${low?'low':''}">
      <div class="v">${left}</div>
      <div class="t"><b>아직 안 나온 ${unit} ${left}개</b><br>
        ${low ? `이번 판을 채우기엔 모자라서 <b>기록을 비우고 처음부터</b> 돕니다`
              : `지금까지 ${used}개 사용 · 전체 ${total}개`}</div>
      <button data-act="used-reset">🔄 초기화</button>
    </div>`;
}

/* ── 🎲 훈민정음 윷놀이 (태블릿 = 말판) ── */
function vYut(){
  const p = S.play, g = G(p.gameId);
  const m = YT();
  const teams = S.room.teams || { count:0 };

  if (!m || p.phase === 'setup') return `
    <div class="gh" style="${gcVars(g.color)};padding:17px">
      <div class="gh-n" style="font-size:18px;padding-right:0">${g.emoji} ${h(g.name)}</div>
      <p class="note" style="margin-top:7px;position:relative">
        이 화면을 가운데 두세요 — 각자 폰으로 윷을 던집니다</p>
    </div>
    <div class="mcbox need">
      <span class="i">📱</span>
      <span><b>모두 같은 방에 들어와 있어야 합니다</b>
        <span class="s">방 코드 <b>${h(S.code)}</b> 로 각자 폰에서 접속하면,
          자기 팀 차례에 <b>윷 던지기</b> 버튼이 뜹니다.</span></span>
    </div>
    <div class="card">
      <div class="sec" style="margin:0 0 10px">팀 <span class="n">${teams.count || 0}팀</span></div>
      ${teams.count >= 2
        ? `<p class="note">팀마다 말 4개로 시작합니다. 4개를 먼저 다 내보내면 이겨요.</p>`
        : `<div class="balbox no"><b>팀을 먼저 나눠주세요</b>
             <span>대기실에서 2팀 이상으로 편성해야 판을 깔 수 있어요.</span></div>`}
    </div>

    ${teams.count >= 2 ? `
      <div class="sec">말 고르기</div>
      <div class="card">
        ${Array.from({ length:teams.count }, (_, ti) => `
          <div class="skinrow">
            <span class="sl">${h(teamName(ti))}</span>
            <div class="sks">
              ${YUT_SKINS.map(sk => `
                <button class="sk ${yutSkinOf(p.skins, ti) === sk.k ? 'on' : ''}"
                  data-act="yut-skin" data-t="${ti}" data-k="${sk.k}" title="${h(sk.name)}">
                  <span class="pv sk-${sk.k}"
                    style="${pcVars(TEAM_COLORS[ti % TEAM_COLORS.length])}"></span>
                </button>`).join('')}
            </div>
          </div>`).join('')}
        <p class="note" style="margin:4px 2px 0">
          색이 비슷해 보여도 <b>모양이 달라서</b> 멀리서도 구분됩니다 — 안 고르면 팀마다 알아서 달라져요.</p>
      </div>` : ''}
    <div style="height:14px"></div>
    <div class="stack">
      <button class="btn pri" data-act="yut-start" ${teams.count >= 2 ? '' : 'disabled'}>🎲 판 깔고 시작</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  const t = m.turn;
  const done = ti => m.pieces[ti].filter(x => x === YUT_HOME).length;
  const wait = ti => m.pieces[ti].filter(x => x === -1).length;
  const sel = S.play.useIdx ?? 0;                 // 지금 쓰려는 윷 결과
  const pend = m.pending || [];
  const use  = pend[sel];

/* ── 🧠 상식 퀴즈 ── */
/* 문제 수 고르기 — 초성 퀴즈·상식 퀴즈가 같이 쓴다.
   ⚠️ 상한은 **실제 낼 수 있는 문제 수**로 묶는다. 40을 고를 수 있는데 12문제밖에 없으면
      「시작하기 — 12문제」와 어긋나 보인다.
   ⚠️ ± 은 20 아래에서는 1씩, 그 위로는 5씩 간다 — 「10문제만」은 정확해야 하지만
      30이냐 32냐는 아무도 안 따진다. 1씩만 가면 40 맞추는 데 스무 번을 눌러야 한다. */
const N_MAX = 50;
const nCap = usable => Math.max(1, Math.min(N_MAX, usable || 1));
const nStep = v => v < 20 ? 1 : 5;
function nPicker(act, n, usable, presets){
  const max = nCap(usable), cur = Math.min(n, max);
  const dn = cur <= 20 ? cur - 1 : Math.max(20, cur - nStep(cur));
  const up = cur < 20 ? cur + 1 : cur + 5;
  return `
    <div class="stepper">
      <button data-act="${act}" data-v="${dn}" ${cur <= 1 ? 'disabled' : ''}>−</button>
      <div class="v">${cur}<small>문제</small>
        ${cur >= max && max === usable ? `<span>이 범위에서 낼 수 있는 전부예요</span>` : ''}</div>
      <button data-act="${act}" data-v="${up}" ${cur >= max ? 'disabled' : ''}>＋</button>
    </div>
    <div class="seg">
      ${presets.filter(x => x <= max).map(x =>
        `<button data-act="${act}" data-v="${x}" class="${cur===x?'on':''}">${x}</button>`).join('')}
      ${max < presets[0] || (max <= 30 && !presets.includes(max))
        ? `<button data-act="${act}" data-v="${max}" class="${cur===max?'on':''}">전부 ${max}</button>` : ''}
    </div>`;
}

        ${usable ? `▶ 시작하기 — ${Math.min(p.n, usable)}문제` : '범위를 하나 이상 골라주세요'}</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>
    </div></div>`;

  const sc = quizScores();
  const board = playing().slice().sort((a,b) => sc[b[0]] - sc[a[0]]);

  /* 4) 종료 */
  if (p.phase === 'done'){
    const solved = p.log.filter(x => x.by != null).length;
    return `
      <div class="pickres">
        <div class="pickres-l">${p.log.length}문제 중</div>
        <div class="pickres-v">${solved}개 맞힘</div>
      </div>
      <div class="sec">점수</div>
      ${board.map(([pid,pl],i) => `
        <div class="tscore" style="--tc:${avColor(pid)};margin-bottom:6px">
          <div class="n" style="display:flex;align-items:center;gap:9px">
            <span style="color:var(--dim2);font-weight:800;min-width:20px">${i+1}</span>
            ${av(pid, pl.name, 'sm')} ${h(pl.name)}</div>
          <div class="v">${sc[pid]}<small>개</small></div>
        </div>`).join('')}
      ${(() => {
        const v = board.map(([pid]) => sc[pid]);
        return v.length !== new Set(v).size
          ? `<p class="note" style="margin:9px 4px 0">동점이 있어요 —
             다음 화면에서 <b>순서를 끌어 바꿀 수 있습니다.</b></p>` : '';
      })()}
      <div class="sec">나온 문제</div>
      ${p.log.map(x => `<div class="sumrow ${x.by?'':'no'}" style="align-items:flex-start">
          <span class="m">${x.by ? '✅' : '⛔'}</span>
          <span class="qa"><span class="w">${h(x.a)}</span>
            <span class="q">${h(x.w)}</span></span>
          <span style="flex:none;font-size:12px;color:var(--dim2);font-weight:700">
            ${x.by ? h(pname(x.by)) : '아무도 못 맞힘'}</span>
        </div>`).join('')}
      <div style="height:18px"></div>
      <div class="stack">
        <button class="btn pri" data-act="quiz-save">🏆 순위 입력하기</button>
        <button class="btn gh" data-act="pl-quit">그만두기</button>
      </div>`;
  }

  /* 직전 문제 한 줄 — 정답 확인을 여기서 해서 진행 템포를 안 끊는다 */
  const last = p.log[p.log.length - 1];
  const lastHtml = last ? `
    <div class="lastq">
      <span>직전 <b>${h(last.a)}</b>${last.by ? ` — ${h(pname(last.by))}` : ' — 못 맞힘'}</span>
      <button class="u" data-act="quiz-undo">방금 취소</button>
    </div>` : '';

  const ql = (p.cur?.w || '').length;
  const qlong = ql > 34 ? 'xlong' : ql > 20 ? 'long' : '';
  const revealing = p.phase === 'reveal';

  /* 2~3) 문제 / 정답 공개
     ⚠️ .priv 를 붙이지 않는다(전원이 봐야 하는 화면).
     ⚠️ run 단계에서는 p.cur.a(정답)를 **어디에도** 넣지 않는다. */
  return `
    <div class="two wide"><div>
    <div class="turnhd">
      <span class="sw" style="--tc:${g.color}"></span>
      <span class="t">🧠 상식 퀴즈</span>
      <span class="r">${p.log.length + 1} / ${p.n}</span>
    </div>
    ${p.sec && !revealing ? `
      <div class="tbar"><i id="t-bar" style="width:${Math.max(0, (p.left||0) / p.sec) * 100}%"></i></div>
      <div class="trow">
        <div class="tsec" id="t-sec">${Math.max(0, Math.ceil(p.left||0))}초</div>
        <div class="thit">시간이 다 되면 정답 공개</div>
      </div>` : ''}
    ${lastHtml}

    <div class="wcard${revealing ? ' rv' : ''}">
      <div style="width:100%">
        <div class="wcat">${QUIZ_DECKS[p.cur?.c]?.emoji || ''} ${h(QUIZ_DECKS[p.cur?.c]?.name || '')}</div>
        <div class="wtxt q ${qlong}">${h(p.cur?.w || '')}</div>
        ${revealing ? `<div class="wans">
          <div class="wans-l">정답</div>
          <div class="wans-v">${h(p.cur?.a || '')}</div>
        </div>` : ''}
      </div>
    </div>
    </div><div>

    ${revealing
      ? `<div class="sec">누가 맞혔나요?</div>
         <div class="choq">
           ${playing().map(([pid,pl]) => `
             <button class="pick" data-act="quiz-hit" data-pid="${pid}">
               ${av(pid, pl.name, 'sm')}
               <div style="flex:1;font-weight:800;font-size:15px;min-width:0;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(pl.name)}</div>
               <span class="chip">${sc[pid]}</span>
             </button>`).join('')}
         </div>
         <div style="height:12px"></div>
         <div class="stack">
           <button class="btn" data-act="quiz-none">🤷 아무도 못 맞힘 — 다음 문제</button>
           <button class="btn gh sm" data-act="quiz-done" style="width:100%">지금 끝내기</button>
         </div>`
      : `<div class="stack">
           <button class="btn pri" data-act="quiz-show">✅ 정답 공개</button>
           <button class="btn gh sm" data-act="quiz-done" style="width:100%">지금 끝내기</button>
         </div>
         <p class="note" style="text-align:center;margin:11px 0 0">
           아는 사람이 <b>소리쳐서</b> 답하세요 ·
           ${p.sec ? `<b>${p.sec}초</b> 뒤에 정답이 자동으로 나옵니다` : '공개하면 다 같이 보고 판정합니다'}</p>`}
    </div></div>`;
}

/* ── 제시어 덱 (몸으로/한글자로 말해요) ── */
function vDeck(){
  const p = S.play;
  const g = G(p.gameId);
  const teams = S.room.teams || {count:0,assign:{}};
  const tc = i => TEAM_COLORS[i % TEAM_COLORS.length];
  const members = i => Object.entries(teams.assign||{})
    .filter(([p,t])=>Number(t)===i && S.room.players[p] && !isSpec(S.room.players[p]))
    .map(([pid])=>pname(pid)).join(', ');
  const wordCount = p.cats.reduce((n,k) => n + (WORD_DECKS[k]?.words.length || 0), 0);

  /* 1) 설정 */
  if (p.phase === 'setup') return `
    <div class="two"><div>
    <div class="gh" style="${gcVars(g.color)};padding:17px">
      <div class="gh-n" style="font-size:18px;padding-right:0">${g.emoji} ${h(g.name)}</div>
      <p class="note" style="margin-top:7px;position:relative">팀마다 한 번씩 돌아가며 진행합니다</p>
    </div>

    ${stockBox(p.gameId, wordCount, 30, '제시어')}

    ${p.mode==='relay' ? `
      <p class="note" style="margin:2px 4px 0">설명자 <b>둘이 한 단어씩 번갈아</b> 던집니다 —
        두 단어를 말하거나 단어가 아니면 <b style="color:var(--rose)">반칙</b>이에요.</p>`
    : `
      <div class="sec">방식</div>
      <div class="seg">
        <button data-act="pl-mode" data-v="body" class="${p.mode==='body'?'on':''}">🕺 몸으로 말해요</button>
        <button data-act="pl-mode" data-v="oneword" class="${p.mode==='oneword'?'on':''}">🗣 한글자로 말해요</button>
      </div>
      <p class="note" style="margin:-2px 4px 0">${p.mode==='body'
        ? '말 없이 몸동작만으로 설명합니다.'
        : '팀이 정한 <b style="color:var(--elec)">한 글자</b>만 써서 설명합니다. 억양·연기는 자유.'}</p>`}

    <div class="sec">제한 시간</div>
    <div class="seg">
      ${[45,60,90].map(s => `<button data-act="pl-sec" data-v="${s}" class="${p.sec===s?'on':''}">${s}초</button>`).join('')}
    </div>

    </div><div>
    <div class="sec">제시어 <span class="n">${wordCount}개</span></div>
    <div class="catgrid">
      ${deckKeys(p.mode==='relay' ? 'relay' : 'body').map(k => `
        <button class="cat ${p.cats.includes(k)?'on':''}" data-act="pl-cat" data-v="${k}">
          <span class="e">${WORD_DECKS[k].emoji}</span>
          <span>${h(WORD_DECKS[k].name)}</span>
          <span class="c">${WORD_DECKS[k].words.length}</span>
        </button>`).join('')}
    </div>

    <div style="height:20px"></div>
    <div class="stack">
      <button class="btn pri" data-act="pl-start" ${!p.cats.length ? 'disabled' : ''}>
        ${p.cats.length ? '▶ 시작하기' : '카테고리를 하나 이상 골라주세요'}</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>
    </div></div>`;

  /* 2) 턴 대기 */
  if (p.phase === 'ready'){
    const t = p.order[p.turn];
    return `
      <div class="turnhd">
        <span class="sw" style="--tc:${tc(t)}"></span>
        <span class="t">${t+1}팀 차례</span>
        <span class="r">${p.turn+1} / ${p.order.length}</span>
      </div>
      <div class="two"><div>

      <div class="card">
        <p class="note" style="font-size:14px;color:var(--dim)">${h(members(t)) || '팀원 없음'}</p>
      </div>

      ${p.mode==='relay' ? `
        <div class="sec">이 게임 방식</div>
        <div class="card">
          <p class="note" style="margin:0;line-height:1.75">
            ① 팀에서 <b>맞히는 사람 1명</b>을 정하고 등을 돌리게 하세요.<br>
            ② 나머지가 화면을 보고 <b>한 단어씩 번갈아</b> 말합니다.<br>
            ③ <b>두 단어</b>를 말하거나 <b>단어가 아니면</b> 반칙 — 패스하고 넘어갑니다.<br>
            <span style="color:var(--dim2)">누가 맞힐지·순서는 팀에서 알아서 정하세요.</span></p>
        </div>` : ''}

      ${p.mode==='oneword' ? `
        <div class="sec">이 팀의 한 글자</div>
        <div class="card" style="text-align:center">
          <div style="font-size:64px;font-weight:900;letter-spacing:-.05em;line-height:1.1;
            background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent">
            ${h(p.letters[t] || '?')}</div>
          <p class="note" style="margin:10px 0 12px">이 글자<b>만</b> 써서 설명해야 합니다 —
            억양·길이·표정은 자유예요</p>
          <button class="btn gh sm" data-act="pl-reletter" style="width:100%">🎲 다른 글자로 바꾸기</button>
        </div>` : ''}

      </div><div>

      <div style="text-align:center;padding:26px 18px;border-radius:var(--r-l);
        background:linear-gradient(150deg,rgba(193,87,58,.14),rgba(160,114,31,.05));
        border:1px solid rgba(160,114,31,.3);margin-bottom:14px">
        <div style="font-size:34px;margin-bottom:10px">📱</div>
        <div style="font-weight:800;font-size:15px;line-height:1.6;word-break:keep-all">
          ${p.mode==='relay' ? `설명하는 두 사람만 화면을 보세요<br>
            <span style="color:var(--dim);font-weight:600;font-size:13.5px">맞히는 사람 쪽으로 화면을 돌리지 마세요</span>`
          : `설명할 사람만 화면을 보세요<br>
            <span style="color:var(--dim);font-weight:600;font-size:13.5px">맞히는 팀은 보면 안 됩니다 — 화면을 돌려 잡으세요</span>`}
        </div>
      </div>

      <div class="stack">
        <button class="btn pri" data-act="pl-begin">${p.sec}초 시작</button>
        <button class="btn gh" data-act="pl-quit">그만두기</button>
      </div>

      </div></div>`;
  }

  /* 3) 진행 중 */
  if (p.phase === 'run'){
    const t = p.order[p.turn];
    const hit = p.hits.filter(x => x.ok).length;
    const wl = (p.cur.w || '').length;
    const long = wl > 14 ? 'xlong' : wl > 8 ? 'long' : '';
    return `
      <div class="turnhd">
        <span class="sw" style="--tc:${tc(t)}"></span>
        <span class="t">${t+1}팀</span>
        <span class="r">${p.turn+1} / ${p.order.length}</span>
      </div>
      <div class="tbar"><i id="t-bar" style="width:100%"></i></div>
      <div class="trow">
        <div class="tsec" id="t-sec">${p.sec}초</div>
        <div class="thit">맞춘 개수 ${hit}</div>
      </div>

      <div class="two"><div>

      ${p.mode==='relay' ? `<div class="lastq" style="margin-bottom:10px">
        <span>🙈 맞히는 사람은 화면을 보면 안 됩니다 · 한 단어씩 번갈아</span>
      </div>` : ''}

      <div class="wcard priv">
        <div>
          ${p.mode==='oneword' && p.letters[t]
            ? `<div class="wletter">🗣 우리 글자 「${h(p.letters[t])}」</div>`
            : `<div class="wcat">${h(WORD_DECKS[p.cur.c]?.name || '')}</div>`}
          <div class="wtxt ${long}">${h(p.cur.w)}</div>
        </div>
      </div>

      </div><div>
      <div class="wbtns">
        <button class="bigbtn pass" data-act="pl-mark" data-v="0">패스</button>
        <button class="bigbtn ok" data-act="pl-mark" data-v="1">정답!</button>
      </div>
      <div style="height:10px"></div>
      <button class="btn gh sm" data-act="pl-stop" style="width:100%">시간 전에 끝내기</button>
      </div></div>`;
  }

  /* 4) 턴 종료 */
  if (p.phase === 'turnEnd'){
    const t = p.order[p.turn];
    const list = p.results[t] || [];
    const hit = list.filter(x => x.ok).length;
    const isLast = p.turn >= p.order.length - 1;
    return `
      <div class="pickres">
        <div class="pickres-l">${t+1}팀 결과</div>
        <div class="pickres-v">${hit}개</div>
      </div>
      ${list.length ? `<div class="sec">제시어</div>
        ${list.map(x => `<div class="sumrow ${x.ok?'':'no'}">
            <span class="m">${x.ok?'✅':'⛔'}</span><span class="w">${h(x.w)}</span></div>`).join('')}`
        : '<div class="empty"><div class="empty-e">😶</div><div class="empty-t">한 개도 못 넘겼어요</div></div>'}
      <div style="height:18px"></div>
      <button class="btn pri" data-act="pl-next">
        ${isLast ? '🏁 전체 결과 보기' : `다음 — ${p.order[p.turn+1]+1}팀 차례`}</button>`;
  }

  /* 5) 전체 종료 */
  const cnt = t => (p.results[t] || []).filter(x => x.ok).length;
  const ranked = [...p.order].sort((a,b) => cnt(b) - cnt(a));
  return `
    <div class="sec">최종 결과</div>
    ${ranked.map((t,i) => `
      <div class="tscore" style="--tc:${tc(t)}">
        <div class="rno ${i<3?'m'+(i+1):''}">${i+1}</div>
        <div class="n">${t+1}팀 <span class="note" style="font-weight:600">${h(members(t))}</span></div>
        <div class="v">${cnt(t)}<small>개</small></div>
      </div>`).join('')}
    <div style="height:18px"></div>
    <div class="stack">
      <button class="btn pri" data-act="pl-save">이 순위로 반영하기</button>
      <button class="btn gh" data-act="pl-quit">점수 반영 없이 나가기</button>
    </div>
    <p class="note" style="text-align:center;margin-top:12px">
      동점이거나 순서를 바꾸고 싶으면 다음 화면에서 조정할 수 있어요</p>`;
}

/* ── 멕썸노이즈 ── */
function vNoise(){
  const p = S.play, g = G(p.gameId);
  const runner = p.order[p.turn], nm = pname(runner);
  const head = `<div class="turnhd"><span class="sw" style="--tc:${avColor(runner)}"></span>
      <span class="t">술래 — ${h(nm)}</span><span class="r">${p.turn+1} / ${p.order.length}</span></div>`;

  if (p.phase === 'ready') return `${head}
    <div style="text-align:center;padding:30px 18px;border-radius:var(--r-l);
      background:linear-gradient(150deg,rgba(193,87,58,.14),rgba(160,114,31,.05));
      border:1px solid rgba(160,114,31,.3);margin-bottom:14px">
      <div style="font-size:38px;margin-bottom:10px">🙈</div>
      <div style="font-weight:800;font-size:15.5px;line-height:1.6;word-break:keep-all">
        ${h(nm)}, 잠깐 뒤돌아서 눈 감고 귀 막기!<br>
        <span style="color:var(--dim);font-weight:600;font-size:13.5px">나머지가 미션 문장을 확인할 거예요</span>
      </div>
    </div>
    <div class="stack">
      <button class="btn pri" data-act="no-brief">📜 미션 문장 만들기</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  if (p.phase === 'brief') return `${head}
    <div class="wcard"><div>
      <div class="wcat">🤫 술래 몰래 확인!</div>
      <div class="wtxt ${p.sen.length>16?'xlong':p.sen.length>10?'long':''}">${h(p.sen)}</div>
    </div></div>
    <div class="warnbox"><span class="i">📢</span><span>다 확인했으면 술래를 부르세요. 술래가 정답에 <b>가까워지면 크게 소리</b>, 멀어지면 조용히!</span></div>
    <div class="stack">
      <button class="btn pri" data-act="race-run">🚦 술래 준비 완료 — 시작!</button>
      <button class="btn" data-act="no-reroll">🔄 다른 문장으로</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  if (p.phase === 'run') return `${head}
    <div class="wcard" style="min-height:150px;padding:28px 18px"><div>
      <div class="wcat">경과 시간</div>
      <div class="bignum" id="sw-sec">${fmtSw(p.elapsed||0)}</div>
    </div></div>
    <p class="note priv" style="text-align:center;margin:0 0 14px">미션 — ${h(p.sen)}<br>(술래에게 보여주지 마세요)</p>
    <div class="wbtns">
      <button class="bigbtn pass" data-act="race-end" data-v="0">🙅 포기</button>
      <button class="bigbtn ok" data-act="race-end" data-v="1">🎉 성공!</button>
    </div>`;

  if (p.phase === 'turnEnd'){
    const r = p.rec[runner];
    return `<div class="pickres">
        <div class="pickres-l">${h(nm)}의 기록</div>
        <div class="pickres-v">${r==null?'실패 😵':fmtSw(r)}</div>
      </div>
      <p class="note" style="text-align:center;margin-bottom:14px">미션 — ${h(p.sen)}</p>
      <button class="btn pri" data-act="race-next">${p.turn>=p.order.length-1?'🏁 전체 결과 보기':'다음 술래 →'}</button>`;
  }
  return vRaceDone(p, '성공까지 걸린 시간이 짧은 순 · 실패는 마지막');
}

/* ── 컵 레이스 ── */
function vCup(){
  const p = S.play;
  const cur = p.order[p.turn], nm = pname(cur);
  const head = `<div class="turnhd"><span class="sw" style="--tc:${avColor(cur)}"></span>
      <span class="t">${h(nm)} 차례</span><span class="r">${p.turn+1} / ${p.order.length}</span></div>`;

  if (p.phase === 'ready') return `${head}
    <div class="card"><p class="note" style="font-size:14px;color:var(--dim);line-height:1.7">
      물이 담긴 컵 아래 휴지를 깔고, 휴지만 당겨서 목표 지점까지!<br>
      물을 쏟거나 휴지가 찢어지면 실패예요.</p></div>
    <div class="stack">
      <button class="btn pri" data-act="race-run">🚦 출발!</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  if (p.phase === 'run') return `${head}
    <div class="wcard" style="min-height:170px;padding:30px 18px"><div>
      <div class="wcat">기록</div>
      <div class="bignum" id="sw-sec">${fmtSw(p.elapsed||0)}</div>
    </div></div>
    <div class="wbtns">
      <button class="bigbtn pass" data-act="race-end" data-v="0">💦 실패</button>
      <button class="bigbtn ok" data-act="race-end" data-v="1">🏁 도착!</button>
    </div>`;

  if (p.phase === 'turnEnd'){
    const r = p.rec[cur];
    return `<div class="pickres">
        <div class="pickres-l">${h(nm)}의 기록</div>
        <div class="pickres-v">${r==null?'실패 💦':fmtSw(r)}</div></div>
      <button class="btn pri" data-act="race-next">${p.turn>=p.order.length-1?'🏁 전체 결과 보기':'다음 사람 →'}</button>`;
  }
  return vRaceDone(p, '빠른 순 · 실패는 마지막');
}

/* ══════════════════════════════════════════════
   역할 뽑기 연출
══════════════════════════════════════════════ */
/* 윷을 던지는 연출. ⚠️ 결과 r 은 이미 정해져 있고, 이 함수는 보여주기만 한다.
   ⚠️ 재진입 금지 — 스냅샷이 연달아 오면 연출이 겹친다(_yutAnim 로 막는다). */
let _yutAnim = false;
async function yutThrowAnim(r, who){
  if (_yutAnim) return;
  _yutAnim = true;
  const ov = document.createElement('div');
  ov.className = 'throw-ov';
  ov.innerHTML = `<div class="throw-b">
      <div class="throw-l">${h(who || '')}</div>
      <div class="throw-sticks">${r.sticks.map(() =>
        `<div class="tstick fly"></div>`).join('')}</div>
      <div class="throw-r" id="thr-r">&nbsp;</div>
      <div class="throw-s" id="thr-s"></div>
    </div>`;
  document.body.appendChild(ov);
  const sticks = [...ov.querySelectorAll('.tstick')];

  SFX.go(); vib(12);
  await sleep(760);                                  // 구르는 시간

  // 하나씩 착지시킨다 — 마지막 짝에서 결과가 갈리는 맛
  for (let i = 0; i < sticks.length; i++){
    const el = sticks[i];
    el.classList.remove('fly'); el.classList.add('land');
    if (r.sticks[i]) el.classList.add('up');
    vib(8); SFX.tick?.();
    await sleep(150);
  }
  const rn = ov.querySelector('#thr-r');
  rn.textContent = r.n; rn.classList.add('on');
  ov.querySelector('#thr-s').textContent =
    `${r.v}칸${r.again ? ' · 한 번 더 던져요!' : ''}`;
  r.again ? SFX.ok() : SFX.pass();
  vib(r.again ? [30,60,30] : 22);
  if (r.again) confetti(45);

  await new Promise(res => {
    const close = () => { ov.remove(); _yutAnim = false; res(); };
    ov.onclick = close;
    setTimeout(() => { if (document.body.contains(ov)) close(); }, 1500);
  });
}

async function rollReveal(label, pool, finalPid){
  const ov = document.createElement('div');
  ov.className = 'roll-ov';
  ov.innerHTML = `<div class="roll-b">
      <div class="roll-l">${h(label)}</div>
      <div class="roll-n spin" id="roll-n">&nbsp;</div>
      <div class="roll-tap" id="roll-tap" style="visibility:hidden">화면을 탭하면 닫혀요</div>
    </div>`;
  document.body.appendChild(ov);
  const el = ov.querySelector('#roll-n');

  const names = pool.map(p => pname(p));
  let delay = 55, t = 0;
  while (t < 1500){
    el.textContent = names[(Math.random()*names.length)|0];
    vib(5);
    await sleep(delay);
    t += delay;
    delay = Math.min(240, delay * 1.13);
  }
  el.classList.remove('spin'); el.classList.add('land');
  el.textContent = pname(finalPid);
  vib([28,50,28]); confetti(70);
  ov.querySelector('#roll-tap').style.visibility = 'visible';

  await new Promise(res => {
    const close = () => { ov.remove(); res(); };
    ov.onclick = close;
    setTimeout(() => { if (document.body.contains(ov)) close(); }, 4200);
  });
}
