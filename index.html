function bind(root){
  // stopPropagation: 버튼 안에 또 다른 data-act(예: 설치 배너의 ✕)가 있을 때 둘 다 발동하는 것 방지
  root.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); act(el.dataset.act, el.dataset); };
  });

  const ci = root.querySelector('#in-code');
  if (ci){
    const paint = () => {
      const v = ci.value;
      root.querySelectorAll('.code-cell').forEach((c,i) => {
        c.classList.toggle('filled', !!v[i]);
        c.classList.toggle('on', i === v.length && document.activeElement === ci);
        c.innerHTML = v[i] ? h(v[i])
          : (i === v.length && document.activeElement === ci ? '<span class="cursor"></span>' : '<span class="ph"></span>');
      });
    };
    ci.oninput = () => {
      ci.value = ci.value.replace(/\D/g,'').slice(0,4);
      paint(); vib(6);
      if (ci.value.length === 4) act('join', {});
    };
    ci.onfocus = paint; ci.onblur = paint;
    root.querySelector('#code-boxes').onclick = () => ci.focus();
    paint();
  }

}

async function act(a, d){
  vib();
  switch(a){

  case 'create': {
    const name = ($('#in-name')?.value || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    await createRoom(name); break;
  }
  case 'join': {
    const name = ($('#in-name')?.value || '').trim();
    const code = ($('#in-code')?.value || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    if (code.length !== 4) return toast('4자리 방 코드를 입력해 주세요');
    await joinRoom(code, name); break;
  }
  case 'rejoin': {
    const sess = JSON.parse(localStorage.getItem(LS) || 'null'); if (!sess) return;
    if (!(await rejoin(sess))){ clearSession(); toast('예전 방을 찾을 수 없어요'); render(true); }
    break;
  }
  case 'share': shareRoom(); break;

  case 'bot-add': {
    if (!S.isHost) return;
    if (players().length + Number(d.n) > 12) return toast('참가자는 12명까지만요');
    addBots(Number(d.n)); confetti(30); render(true);
    toast(`테스트 참가자 ${d.n}명이 들어왔어요`);
    break;
  }
  case 'bot-clear': {
    if (!S.isHost) return;
    const n = clearBots(); render(true);
    toast(n ? `테스트 참가자 ${n}명을 내보냈어요` : '내보낼 봇이 없어요');
    break;
  }

  case 'install': {
    if (_installEvt){
      _installEvt.prompt();
      const r = await _installEvt.userChoice.catch(() => null);
      _installEvt = null;
      if (r?.outcome !== 'accepted') toast('나중에 크롬 메뉴에서도 설치할 수 있어요');
      render(true);
    }else{
      showIosInstall();
    }
    break;
  }
  case 'install-off': {
    try{ localStorage.setItem('pg_install_off','1'); }catch{}
    render(true); break;
  }

  case 'kick': {
    if (!S.isHost) return;
    delete S.room.players[d.pid];
    remove(ref(db, `${ROOT}/rooms/${S.code}/players/${d.pid}`)).catch(()=>{});
    render(); break;
  }
  case 'teams': {
    const n = Number(d.n);
    if (n < 2){ S.room.teams = {count:0,assign:{}}; pushHostState(); }
    else if (playing().length < n) return toast(`${n}팀을 나누려면 선수가 ${n}명 이상 필요해요`);
    else { makeTeams(n); confetti(45); }
    render(); break;
  }

  case 'go-games': go('games'); break;
  case 'go-board': go('board'); break;
  case 'go-settings': go('settings'); break;
  case 'game': S.gameId = d.id; go('game'); break;

  case 'pick': {
    if (!S.isHost) return toast('진행자만 뽑을 수 있어요');
    const g = G(S.gameId);
    const before = (S.room.rotation?.[g.id] || []).filter(p => S.room.players[p] && !isSpec(S.room.players[p]));
    const all = playing().map(([pid]) => pid);
    const pool = all.filter(p => !before.includes(p));
    const { pick, reset } = pickRole(S.gameId);
    S._lastPick[S.gameId] = pick;
    await rollReveal(g.role, (pool.length ? pool : all), pick);
    render();
    if (reset) toast('전원이 한 바퀴 돌아서 순번을 새로 시작해요');
    break;
  }
  case 'used-reset': {
    if (!S.isHost) return;
    const gid = S.play?.gameId || S.gameId;
    if (!usedWords(gid).size) return toast('아직 기록이 없어요');
    S.ask = { emoji:'🔄', title:'나온 제시어 기록을 지울까요?',
      lose:['<b>이미 나왔던 제시어가 다시 나올 수 있어요</b>'],
      safe:'점수와 순위는 그대로 남아요. 처음부터 다시 시작하는 셈이 됩니다.',
      ok:'기록 지우기', go:'used-reset-go', d:{ gid } };
    render(true); break;
  }
  case 'used-reset-go': {
    resetUsed(d.gid || S.play?.gameId || S.gameId);
    render(true); toast('처음부터 다시 시작합니다'); break;
  }
  case 'rot-reset': {
    if (!S.isHost) return;
    if (S.room.rotation) delete S.room.rotation[S.gameId];
    delete S._lastPick[S.gameId];
    pushHostState(); render(); toast('순번을 초기화했어요'); break;
  }

  /* ── 진행 도구 ── */
  case 'tool-start': {
    if (!S.isHost) return toast('진행 도구는 진행자 기기에서 열어주세요');
    const g = G(S.gameId), n = playing().length;
    // ⚠️ 최소 인원은 GAMES[].minP 한 곳에서만 읽는다.
    //    예전엔 여기 2/3 이 하드코딩돼 있어서 상세 화면 표시와 따로 놀 수 있었다.
    if (g.minP && n < g.minP) return toast(`${g.minP}명 이상 필요해요 (지금 ${n}명)`);
    if (g.mode === 'team' && (S.room.teams?.count || 0) < 2)
      return toast('팀전이에요 — 대기실에서 팀을 먼저 나눠주세요');
    ({ deck:startDeckTool, noise:startNoiseTool, cup:startCupTool,
       act:startActTool, smile:startSmileTool, cho:startChoTool,
       song:startSongTool, yut:startYutTool, quiz:startQuizTool })[g.tool]?.();
    break;
  }
  case 'pl-mode': S.play.mode = d.v; render(); break;
  case 'pl-sec':  S.play.sec = Number(d.v); render(); break;
  case 'pl-cat': {
    // ⚠️ 다른 게임 전용 카테고리가 섞여 들어오지 않게 막는다
    //    (몸으로 말해요에 사자성어가 들어가면 표현할 방법이 없다)
    {
      const tool = S.play?.kind === 'cho' ? 'cho'
        : S.play?.mode === 'relay' ? 'relay' : 'body';
      if (!deckKeys(tool).includes(d.v)) return;
    }
    const c = S.play.cats;
    const i = c.indexOf(d.v);
    i < 0 ? c.push(d.v) : c.splice(i, 1);
    render(); break;
  }
  case 'pl-start': {
    if (!S.play.cats.length) return toast('카테고리를 하나 이상 골라주세요');
    Object.assign(S.play, { phase:'ready', turn:0, results:{}, letters:{} });
    ensureLetter();
    buildDeck();                       // 판 전체가 하나의 덱을 이어 쓴다(팀 간 중복 방지)
    if (!S.play.deck.length) return toast('낼 제시어가 없어요 — 카테고리를 더 골라주세요');
    nextWord();                        // 첫 장을 미리 뽑아둔다(턴 시작마다 뽑으면 한 장씩 샌다)
    if (S.play.wrapped) toast('제시어를 한 바퀴 다 썼어요 — 처음부터 다시 돕니다');
    render(); break;
  }
  case 'pl-begin': beginTurn(); break;
  case 'pl-reletter': {
    const p = S.play, t = p.order[p.turn];
    p.letters[t] = drawLetter();
    SFX.go(); vib(12); render(true); break;
  }
  /* 🎲 훈민정음 윷놀이 — 태블릿(호스트) */
  case 'yut-start': {
    if (!S.isHost) return toast('말판은 진행자 기기에서 열어주세요');
    if ((S.room.teams?.count || 0) < 2) return toast('대기실에서 팀을 먼저 나눠주세요');
    yutStart(); S.play.phase = 'play'; confetti(60); render(true); break;
  }
  case 'yut-skin': {
    const p = S.play; if (!p) return;
    p.skins = [...(p.skins || [])];
    p.skins[Number(d.t)] = d.k;
    SFX.pass(); vib(8); render(true); break;
  }
  case 'yut-use': S.play.useIdx = Number(d.i); render(true); break;
  case 'yut-move': {
    const idx = S.play.useIdx ?? 0;
    yutMoveFrom(Number(d.pos), idx);
    S.play.useIdx = 0;                 // 하나 쓰면 다시 첫 번째를 가리킨다
    break;
  }
  case 'yut-pickback': yutPickBack(Number(d.pos)); break;
  case 'yut-skip': yutSkip(); break;
  case 'yut-halt-ok': yutHaltResolve(true);  break;
  case 'yut-halt-no': yutHaltResolve(false); break;
  case 'yut-throw-here': {           // 폰이 안 되는 사람 대신 태블릿에서 던져준다
    const m = YT(); if (!m || m.phase !== 'play' || !m.canThrow) return;
    const r = throwYut();
    yutThrowAnim(r, `${h(teamName(m.turn))} 던지기`).then(() => yutApplyThrow(r, S.pid));
    break;
  }
  case 'yut-score': {
    const m = YT(); if (!m) return;
    // 완주한 말이 많은 팀 순
    const order = m.pieces.map((arr, ti) => ti)
      .sort((a, b) => m.pieces[b].filter(x => x === YUT_HOME).length
                    - m.pieces[a].filter(x => x === YUT_HOME).length);
    toScore(order, 'team'); break;
  }
  case 'yut-clear': {
    S.ask = { emoji:'🎲', title:'윷판을 정리하고 끝낼까요?',
      lose:['말의 위치와 <b>지금까지의 판이 사라져요</b>', '순위로 <b>반영되지 않아요</b>'],
      safe:'끝까지 두면 「순위 반영하기」로 종합 순위에 올릴 수 있어요.',
      ok:'그래도 끝내기', go:'yut-clear-go' };
    render(true); break;
  }
  case 'yut-clear-go': {
    S.room.yut = null;
    remove(ref(db, `${ROOT}/rooms/${S.code}/yut`)).catch(()=>{});
    stopPlayTimer(); S.play = null; go('game'); break;
  }

  /* 🎲 각자 폰 */
  case 'go-yut': go('yut'); break;
  case 'yut-throw': {
    const m = YT();
    if (!m || m.phase !== 'play') return;
    if (myTeam() !== m.turn) return toast('우리 팀 차례가 아니에요');
    if (!m.canThrow) return toast('먼저 진행자 화면에서 말을 옮기세요');
    const r = throwYut();
    if (S.isHost){                                   // 태블릿을 직접 쥔 사람이 던진 경우
      yutThrowAnim(r, `${pname(S.pid)} 던지기`).then(() => yutApplyThrow(r, S.pid));
      break;
    }
    /* ⚠️ 참가자는 yut/throw 에만 쓴다(호스트가 읽어서 반영). 다른 필드를 건드리면 판이 깨진다.
       연출은 내 폰에서 먼저 돌리고, 결과는 그대로 서버에 올린다(연출이 결과를 바꾸지 않는다).
       ⚠️ 예전엔 `.catch(()=>{})` 로 **실패를 통째로 삼켰다.** 폰에서는 윷이 굴러가니
          던진 사람은 됐다고 믿는데 태블릿엔 아무 일도 안 일어난다 — 그게 「연동이 되는지
          모르겠다」의 정체였다. 이제 보낸 뒤 **판에 올라간 것까지** 확인해서 보여준다. */
    const at = now();
    S.yutSent = { at, n:r.n, ok:null };
    yutThrowAnim(r, '내 차례');
    set(ref(db, `${ROOT}/rooms/${S.code}/yut/throw`), { ...r, by:S.pid, at })
      .then(() => { if (S.yutSent && S.yutSent.at === at) S.yutSent.ok = true; render(true); })
      .catch(() => { if (S.yutSent && S.yutSent.at === at) S.yutSent.ok = false;
                     toast('보내지 못했어요 — 인터넷을 확인하세요'); render(true); });
    // 시간이 지나도 판에 안 올라오면 「못 받았어요」로 바꿔줘야 한다(가만히 두면 영원히 보내는 중)
    setTimeout(() => render(true), YUT_DELIVER_MS + 300);
    break;
  }
  /* 태블릿(공용 화면)에서 지적 — 누가 눌렀는지가 아니라 「지적이 들어왔다」가 중요하다.
     ⚠️ 폰에서 누르는 yut-halt 와 달리 「우리 팀은 못 누른다」 가드를 걸지 않는다.
        태블릿은 다 같이 둘러앉아 보는 기기라 누른 사람이 곧 상대팀이다
        (진행 중인 팀이 자기를 지적할 이유가 없다). */
  case 'yut-halt-here': {
    const m = YT();
    if (!S.isHost) return;
    if (!m || m.phase !== 'play' || m.halt || m.pick) return;
    const t = yutHaltTeam(m, d.team); if (t == null) return;
    m.halt = { by:S.pid, team:t, at:now(), board:true };
    pushYut({ halt:m.halt });
    SFX.end(); vib([30,50,30]); render(true); break;
  }
  case 'yut-halt': {
    const m = YT();
    if (!m || m.phase !== 'play' || m.halt || m.pick) return;
    const t = yutHaltTeam(m, d.team); if (t == null) return;
    if (myTeam() === t) return toast('우리 팀은 지적할 수 없어요');
    const payload = { by:S.pid, team:t, at:now() };
    if (S.isHost){ m.halt = payload; pushYut({ halt:payload }); }
    else set(ref(db, `${ROOT}/rooms/${S.code}/yut/halt`), payload).catch(()=>{});
    SFX.end(); vib([30,50,30]); toast('✋ 잠시! — 진행자 화면에서 판단합니다'); break;
  }
  /* 🔄 재시작 — 말을 전부 집으로, 기록·벌점까지 처음부터. 팀과 말 모양은 그대로 둔다. */
  case 'yut-restart': {
    if (!S.isHost) return toast('말판은 진행자 기기에서 다시 시작해주세요');
    S.ask = { emoji:'🔄', title:'윷판을 처음부터 다시 시작할까요?',
      lose:['말 위치·기록·<b>영어 벌점이 전부 사라져요</b>',
            '지금 판은 <b>순위에 반영되지 않아요</b>'],
      safe:'팀과 말 모양은 그대로예요. 끝까지 두면 「순위 입력하기」로 올릴 수 있어요.',
      ok:'처음부터 다시', go:'yut-restart-go' };
    render(true); break;
  }
  case 'yut-restart-go': {
    yutStart(); S.play.phase = 'play';
    SFX.go(); confetti(40); toast('처음부터 다시 시작합니다'); render(true); break;
  }

  /* 🎵 노래 맞히기 */
  case 'song-n': S.play.n = Number(d.v); render(); break;
  case 'song-cat': {
    const c = S.play.cats, i = c.indexOf(d.v);
    i < 0 ? c.push(d.v) : c.splice(i, 1);
    render(); break;
  }
  case 'song-start': {
    const p = S.play;
    if (!p.cats.length) return toast('범위를 하나 이상 골라주세요');
    p.log = []; songBuildDeck();
    if (!p.deck.length) return toast('그 범위에는 낼 곡이 없어요');
    if (p.wrapped) toast('곡을 한 바퀴 다 썼어요 — 처음부터 다시 돕니다');
    songNextCard(); p.phase = 'run';
    SFX.go(); vib(20); render(true); break;
  }
  case 'song-hit': {
    const p = S.play; if (p.phase !== 'run') return;
    p.log.push({ w:p.cur.w, a:p.cur.a, c:p.cur.c, by:d.pid });
    SFX.ok(); vib(16); songNext(); break;
  }
  case 'song-pass': {
    const p = S.play; if (p.phase !== 'run') return;
    p.phase = 'reveal'; SFX.pass(); vib(8); render(true); break;
  }
  case 'song-skip': {
    const p = S.play;
    p.log.push({ w:p.cur.w, a:p.cur.a, c:p.cur.c, by:null });
    songNext(); break;
  }
  case 'song-undo': {
    const p = S.play;
    const x = p.log.pop(); if (!x) return;
    p.cur = { w:x.w, a:x.a, c:x.c }; p.phase = 'run';
    SFX.pass(); vib(8); render(true); break;
  }
  case 'song-done': {
    if (!S.play.log.length) return toast('아직 들은 곡이 없어요');
    songFinish(); break;
  }
  case 'song-save': {
    const sc = songScores();
    toScore(playing().map(([pid]) => pid).sort((a,b) => sc[b] - sc[a]), 'solo');
    break;
  }

  /* 🔠 초성 퀴즈 */
  case 'cho-n': {
    const max = nCap(choWords(S.play.cats).length);
    S.play.n = Math.max(1, Math.min(max, Number(d.v) || 1));
    render(true); break;
  }
  case 'cho-start': {
    const p = S.play;
    if (!p.cats.length) return toast('범위를 하나 이상 골라주세요');
    p.log = []; choBuildDeck();
    if (!p.deck.length) return toast('그 범위에는 낼 문제가 없어요 — 범위를 더 골라주세요');
    if (p.wrapped) toast('문제를 한 바퀴 다 썼어요 — 처음부터 다시 돕니다');
    nextWord(); p.phase = 'run';
    SFX.go(); vib(20); render(true); break;
  }
  case 'cho-hit': {
    const p = S.play; if (p.phase !== 'run') return;
    p.log.push({ w:p.cur.w, c:p.cur.c, by:d.pid });
    SFX.ok(); vib(16); choNext(); break;
  }
  case 'cho-pass': {
    const p = S.play; if (p.phase !== 'run') return;
    p.phase = 'reveal'; SFX.pass(); vib(8); render(true); break;
  }
  case 'cho-skip': {
    const p = S.play;
    p.log.push({ w:p.cur.w, c:p.cur.c, by:null });
    choNext(); break;
  }
  case 'cho-undo': {
    // 잘못 탭한 경우 — 그 문제를 되돌려 다시 출제한다(덱 인덱스는 그대로 두면 된다)
    const p = S.play;
    const x = p.log.pop(); if (!x) return;
    p.cur = { w:x.w, c:x.c }; p.phase = 'run';
    SFX.pass(); vib(8); render(true); break;
  }
  case 'cho-done': {
    if (!S.play.log.length) return toast('아직 푼 문제가 없어요');
    choFinish(); break;
  }
  case 'cho-save': {
    const sc = choScores();
    toScore(playing().map(([pid]) => pid).sort((a,b) => sc[b] - sc[a]), 'solo');
    break;
  }

  /* 🧠 상식 퀴즈 */
  case 'quiz-n': {
    const max = nCap(quizPool(S.play.cats).length);
    S.play.n = Math.max(1, Math.min(max, Number(d.v) || 1));
    render(true); break;
  }
  case 'quiz-cat': {
    const c = S.play.cats, i = c.indexOf(d.v);
    i < 0 ? c.push(d.v) : c.splice(i, 1);
    render(); break;
  }
  case 'quiz-start': {
    const p = S.play;
    if (!p.cats.length) return toast('범위를 하나 이상 골라주세요');
    p.log = []; quizBuildDeck();
    if (!p.deck.length) return toast('그 범위에는 낼 문제가 없어요 — 범위를 더 골라주세요');
    if (p.wrapped) toast('문제를 한 바퀴 다 썼어요 — 처음부터 다시 돕니다');
    quizNextCard(); p.phase = 'run';
    SFX.go(); vib(20); render(true); startCountdown(quizAutoShow); break;
  }
  /* ⚠️ 정답 공개가 먼저다 — 그 다음에 누가 맞혔는지 고른다(위 설계 주석 참조) */
  case 'quiz-show': {
    const p = S.play; if (p.phase !== 'run') return;
    stopPlayTimer();                       // 진행자가 먼저 눌렀으면 카운트다운은 끝난다
    p.phase = 'reveal'; SFX.pass(); vib(8); render(true); break;
  }
  case 'quiz-sec': {
    S.play.sec = Math.max(0, Number(d.v) || 0);
    if (S.play.phase === 'run') startCountdown(quizAutoShow);
    render(true); break;
  }
  case 'quiz-hit': {
    const p = S.play; if (p.phase !== 'reveal') return;
    p.log.push({ w:p.cur.w, a:p.cur.a, c:p.cur.c, by:d.pid });
    SFX.ok(); vib(16); quizNext(); break;
  }
  case 'quiz-none': {
    const p = S.play; if (p.phase !== 'reveal') return;
    p.log.push({ w:p.cur.w, a:p.cur.a, c:p.cur.c, by:null });
    quizNext(); break;
  }
  case 'quiz-undo': {
    // 다른 사람을 잘못 눌렀을 때 — 정답이 뜬 상태(reveal)로 되돌려 다시 고르게 한다
    const p = S.play;
    const x = p.log.pop(); if (!x) return;
    stopPlayTimer();                       // 되돌아간 곳은 정답이 보이는 화면이라 시간이 흐르면 안 된다
    p.cur = { w:x.w, a:x.a, c:x.c }; p.phase = 'reveal';
    SFX.pass(); vib(8); render(true); break;
  }
  case 'quiz-done': {
    if (!S.play.log.length) return toast('아직 푼 문제가 없어요');
    quizFinish(); break;
  }
  case 'quiz-save': {
    const sc = quizScores();
    toScore(playing().map(([pid]) => pid).sort((a,b) => sc[b] - sc[a]), 'solo');
    break;
  }

  case 'pl-mark': markWord(d.v === '1'); break;
  case 'pl-stop': endTurn(); break;
  case 'pl-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1){
      p.phase = 'done'; confetti(70);
      // 이 판에 실제로 화면에 뜬 제시어만 기록한다(안 넘긴 카드는 아직 안 쓴 것)
      markUsed(p.gameId, Object.values(p.results).flat().map(x => x.w));
    }
    else { p.turn++; p.phase = 'ready'; ensureLetter(); }
    render(); break;
  }
  case 'pl-save': deckToScore(); break;

  /* ── 멕썸노이즈 · 컵 레이스 (race-* 공유) ── */
  case 'no-brief': case 'no-reroll': {
    const p = S.play;
    p.sen = jo(pname(p.order[p.turn]), '이', '가') + ' ' + noiseSentence();
    p.phase = 'brief'; vib(8); render(true); break;
  }
  case 'race-run': {
    S.play.phase = 'run'; SFX.go(); vib(20);
    render(true); swBegin(); break;
  }
  case 'race-end': {
    const p = S.play; stopPlayTimer();
    const ok = d.v === '1';
    p.rec[p.order[p.turn]] = ok ? Math.round((p.elapsed || 0) * 10) / 10 : null;
    p.phase = 'turnEnd';
    ok ? SFX.ok() : SFX.end(); vib(ok ? [20,40,20] : 30);
    render(true); break;
  }
  case 'race-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1){ p.phase = 'done'; confetti(70); }
    else { p.turn++; p.phase = 'ready'; }
    render(true); break;
  }
  case 'race-save': {
    const p = S.play;
    toScore([...p.order].sort((a,b) => (p.rec[a] ?? 1e9) - (p.rec[b] ?? 1e9)), 'solo');
    break;
  }

  /* ── 연기 대결 ── */
  case 'ac-reroll': actDraw(); vib(8); render(true); break;
  case 'ac-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1) p.phase = 'done';
    else { p.turn++; actDraw(); }
    render(true); break;
  }
  case 'ac-score': { stopPlayTimer(); S.play = null; act('score-start', {}); break; }

  /* ── 스마일~! ── */
  case 'sm-sul': {
    const p = S.play;
    p.sul = d.pid;
    p.pool = playing().map(([pid]) => pid).filter(x => x !== d.pid);
    p.shots = 10; p.sel = []; p.phase = 'run';
    SFX.go(); render(true); break;
  }
  case 'sm-shot': {
    const p = S.play;
    if (p.shots > 0){ p.shots--; SFX.tick(); vib(10); }
    if (p.shots <= 0){ p.phase = 'judge'; p.sel = []; SFX.end(); }
    render(true); break;
  }
  case 'sm-judge': S.play.phase = 'judge'; S.play.sel = []; render(true); break;
  case 'sm-back':  S.play.phase = 'run'; render(true); break;
  case 'sm-sel': {
    const p = S.play, i = p.sel.indexOf(d.pid);
    i < 0 ? p.sel.push(d.pid) : p.sel.splice(i, 1);
    render(true); break;
  }
  case 'sm-apply': {
    const p = S.play;
    p.log.push({ r:p.log.length + 1, sul:p.sul, caught:[...p.sel] });
    if (p.sel.length === 1){
      const nx = p.sel[0];
      p.sul = nx;
      p.pool = playing().map(([pid]) => pid).filter(x => x !== nx);
    }else if (p.sel.length > 1){
      p.pool = [...p.sel];      // 걸린 사람들끼리 재진행 (술래 유지)
    }                            // 0명 → 같은 술래·같은 대상 다시
    p.shots = 10; p.sel = []; p.round++; p.phase = 'run';
    render(true); break;
  }
  case 'sm-done': S.play.phase = 'done'; render(true); break;
  case 'sm-score': { stopPlayTimer(); S.play = null; act('score-start', {}); break; }

  /* 경고창 — 「예」를 누르면 q.go 를 그대로 부른다.
     ⚠️ q.go 는 **다시 물어보지 않는 액션**이어야 한다(-go 접미사). 안 그러면 창이 다시 뜬다.
     ⚠️ await 하지 않는다 — act() 는 switch 를 동기로 들어가므로 상태 변경이 즉시 일어난다.
        (검증 시나리오가 act('ask-yes') 다음 줄에서 바로 상태를 본다) */
  case 'ask-stay': break;                       // 상자 안을 눌렀을 때 닫히지 않게
  case 'ask-no': S.ask = null; render(true); break;
  case 'ask-yes': {
    const q = S.ask; S.ask = null;
    if (q?.go) act(q.go, q.d || {}); else render(true);
    break;
  }

  case 'pl-quit': {
    const p = S.play;
    const prog = p && (p.phase === 'run' || (p.turn || 0) > 0
      || Object.keys(p.results || {}).length > 0 || Object.keys(p.rec || {}).length > 0
      || (p.log || []).length > 0);
    if (!prog){ stopPlayTimer(); S.play = null; go('game'); break; }
    S.ask = { emoji:'🎮', title:'진행 중인 게임을 그만둘까요?',
      lose:['지금까지의 <b>기록·점수가 저장되지 않고 사라져요</b>',
            '제시어·시간·순서를 <b>처음부터 다시</b> 해야 해요'],
      safe:'끝까지 하면 「이 순위로 반영하기」로 종합 순위에 올릴 수 있어요.',
      ok:'그래도 그만두기', go:'pl-quit-go' };
    render(true); break;
  }
  case 'pl-quit-go': { stopPlayTimer(); S.play = null; go('game'); break; }

  case 'score-start': {
    if (!S.isHost) return toast('순위 입력은 진행자 기기에서 해주세요');
    const g = G(S.gameId);
    const teams = S.room.teams || {count:0};
    if (g.mode === 'team' && teams.count < 2) return toast('팀전이에요 — 대기실에서 팀을 먼저 나눠주세요');
    S.draft = { gameId:g.id, mode:(g.mode==='team' && teams.count>1) ? 'team' : 'solo',
      order:[], weight:g.weight, assign:JSON.parse(JSON.stringify(teams.assign || {})) };
    go('score'); break;
  }
  case 'pickrank': {
    S.draft.order.push(S.draft.mode === 'team' ? Number(d.id) : d.id);
    render(); break;
  }
  case 'undo': S.draft.order.pop(); render(); break;
  case 'score-cancel': S.draft = null; go('game'); break;
  case 'score-save': {
    const dr = S.draft;
    const sid = 's' + now().toString(36) + Math.random().toString(36).slice(2,6);
    if (!S.room.scores) S.room.scores = {};
    S.room.scores[sid] = { gameId:dr.gameId, mode:dr.mode, order:dr.order,
      weight:dr.weight, assign:dr.assign, at:now() };
    pushHostState(); S.draft = null;
    go('board'); confetti(110); vib([20,40,20]);
    toast('순위가 반영됐어요');
    break;
  }
  case 'del-score': {
    if (!S.isHost) return;
    delete S.room.scores[d.sid];
    set(ref(db, `${ROOT}/rooms/${S.code}/scores`), S.room.scores).catch(()=>{});
    render(); break;
  }

  /* 이 기기를 「사회자(화면)」로 — 겨루지 않는다.
     ⚠️ 자기 players/{pid} 노드만 쓴다(참가자도 쓸 수 있는 경로). 권위 필드는 안 건드린다.
     ⚠️ 팀 배정이 남아 있으면 유령 팀원이 되므로 같이 지운다.
        점수 기록(scores)은 지우지 않는다 — 해제하면 그대로 되살아난다. */
  /* 🎛 진행자를 이 기기로 — 태블릿이 「화면」만 되고 도구는 폰에 남던 것을 없앤다.
     ⚠️ 진행 도구(S.play)는 **진행자 기기 메모리에만** 있다(윷판만 방 노드에 있다).
        도구를 켠 채로 넘기면 그 판이 통째로 사라지므로 막는다. */
  case 'host-take': {
    if (S.isHost) return toast('이미 이 기기가 진행자예요');
    if (!S.room?.players?.[S.pid]) return;
    if (S.play) return toast('진행 중인 게임을 먼저 끝내고 넘겨주세요');
    S._takeSpec = d.spec === '1';
    S.ask = { emoji:'🎛', title:'이 기기를 진행자로 바꿀까요?',
      lose:[`지금 진행자인 <b>${h(pname(S.room.host) || '다른 기기')}</b>님 기기는 <b>일반 참가자가 돼요</b>`,
            '그 기기에서 <b>게임 도구를 켜 둔 게 있으면 사라져요</b>'],
      safe:'순위·팀·나온 제시어는 <b>서버에 있어서 그대로 넘어와요</b>. 언제든 다시 넘길 수 있어요.',
      ok:'이 기기로 진행하기', go:'host-take-go' };
    render(true); break;
  }
  case 'host-take-go': {
    const old = S.room.host;
    S.isHost = true; S.room.host = S.pid; saveSession();
    /* ⚠️ 진행자 표시(players/*.host)도 같이 옮긴다 — 안 옮기면 참가자 칩에
          「진행자」가 두 명으로 보인다. */
    update(roomRef(S.code), {
      host: S.pid,
      [`players/${S.pid}/host`]: true,
      ...(old && old !== S.pid ? { [`players/${old}/host`]: null } : {}),
    }).catch(() => toast('넘기지 못했어요 — 인터넷을 확인하세요'));
    const me = S.room.players?.[S.pid]; if (me) me.host = true;
    if (old && S.room.players?.[old]) S.room.players[old].host = false;
    pushHostState();                       // 새 진행자가 곧바로 진실원임을 알린다
    /* 태블릿에서 「이 태블릿으로 진행하기」로 들어온 경우 — 사회자(화면)까지 한 번에 */
    if (S._takeSpec && me && !isSpec(me) && playing().length > 1){
      me.spec = true;
      update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { spec:true }).catch(()=>{});
      if (S.room.teams?.assign?.[S.pid] != null){ delete S.room.teams.assign[S.pid]; pushHostState(); }
    }
    S._takeSpec = false;
    vib(18); confetti(30); render(true);
    toast('🎛 이제 이 기기가 진행자예요');
    break;
  }
  case 'spec-toggle': {
    const me = S.room.players?.[S.pid]; if (!me) break;
    const on = !isSpec(me);
    if (on && playing().length <= 1) return toast('선수가 아무도 안 남아요');
    me.spec = on;
    update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { spec:on }).catch(()=>{});
    if (on && S.room.teams?.assign?.[S.pid] != null){
      delete S.room.teams.assign[S.pid];
      if (S.isHost) pushHostState();
    }
    vib(12); render(true);
    toast(on ? '📺 이 기기는 사회자(화면)입니다 — 겨루지 않아요' : '다시 선수로 참가합니다');
    break;
  }

  case 'rename': {
    const n = ($('#in-rename')?.value || '').trim();
    if (!n) return toast('이름을 입력해 주세요');
    S.room.players[S.pid].name = n;
    update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { name:n }).catch(()=>{});
    saveSession(); render(); toast('이름을 바꿨어요'); break;
  }
  case 'reset-scores': {
    if (!S.room.scores || !Object.keys(S.room.scores).length) return toast('아직 점수가 없어요');
    S.ask = { emoji:'🗑', title:'점수를 전부 지울까요?',
      lose:['지금까지 저장한 <b>모든 판의 순위가 사라져요</b>', '<b>되돌릴 수 없어요</b>'],
      safe:'참가자·팀·방 코드는 그대로 남아요.', ok:'전부 지우기', go:'reset-scores-go' };
    render(true); break;
  }
  case 'reset-scores-go': {
    S.room.scores = {};
    set(ref(db, `${ROOT}/rooms/${S.code}/scores`), {}).catch(()=>{});
    render(); toast('점수를 초기화했어요'); break;
  }
  case 'reset-rot': {
    S.room.rotation = {}; S._lastPick = {};
    pushHostState(); render(); toast('순번을 초기화했어요'); break;
  }
  /* 지난 기록 — 방이 사라져도 이 기기에 남아 있는 최종 순위 */
  case 'hist-open': S.histI = Number(d.i) || 0; go('hist'); break;
  case 'go-home': go('home'); break;
  case 'hist-del': {
    const i = Number(d.i) || 0, r = histAll()[i];
    if (!r) return;
    // ⚠️ 지금 들어가 있는 방의 기록은 살아 있는 값이라, 지워도 다음 렌더에 다시 쌓인다
    if (r.code === S.code) return toast('지금 들어가 있는 방이에요 — 방을 나가면 지울 수 있어요');
    S.ask = { emoji:'🗂', title:`${fmtDay(r.last)} 기록을 지울까요?`,
      lose:['이 <b>최종 순위와 진행한 게임 목록이 사라져요</b>',
            '방은 이미 없을 수 있어서 <b>되살릴 수 없어요</b>'],
      safe:'다른 날짜의 기록은 그대로 남아요.', ok:'이 기록 지우기', go:'hist-del-go', d:{ i } };
    render(true); break;
  }
  case 'hist-del-go': {
    const i = Number(d.i) || 0;
    const list = histAll(); list.splice(i, 1); histPut(list);
    _histSig = '';                       // 지운 뒤 같은 방에 있으면 다시 쌓이게 한다
    if (S.view === 'hist') go('home'); else render(true);
    toast('기록을 지웠어요'); break;
  }

  case 'leave': askLeave(); break;
  case 'leave-go': leaveRoom(); break;
  }
}

/* ══════════════════════════════════════════════
   부팅
══════════════════════════════════════════════ */
watchConnection();
render();

(async () => {
  const q = new URLSearchParams(location.search).get('r');
  const sess = (() => { try{ return JSON.parse(localStorage.getItem(LS) || 'null'); }catch{ return null; } })();
  if (sess && (!q || q === sess.code)){
    if (await rejoin(sess)) return;
    clearSession();
  }
  if (q && /^\d{4}$/.test(q)){
    const el = $('#in-code');
    if (el){ el.value = q; el.dispatchEvent(new Event('input')); }
  }
})();

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
