<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12101a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>숙소에서 하기 좋은 게임 모음</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#12101a; --bg2:#1a1726; --card:#211d31; --card2:#2a2540;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --tx:#f2eefb; --tx2:#a79fc0; --tx3:#6f6789;
  --ac:#ffcb5c; --ac2:#ff8f5c; --ok:#5ce39a; --no:#ff6b7d; --bl:#6fa8ff;
  --sh:0 8px 28px rgba(0,0,0,.45);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(1000px 600px at 15% -10%, rgba(255,143,92,.14), transparent 60%),
    radial-gradient(800px 500px at 90% 0%, rgba(111,168,255,.12), transparent 55%),
    var(--bg);
  color:var(--tx);
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit;font-size:16px}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* ── 헤더 ── */
header{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  background:rgba(18,16,26,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.hd-back{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;color:var(--tx2);background:rgba(255,255,255,.05)}
.hd-t{flex:1;min-width:0;font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-code{
  font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:800;font-size:15px;letter-spacing:.14em;
  color:var(--ac);background:rgba(255,203,92,.12);border:1px solid rgba(255,203,92,.3);
  padding:5px 10px;border-radius:9px;
}
.hd-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.hd-dot.off{background:var(--no)}

main{flex:1;padding:16px 14px calc(28px + var(--safe-b))}

/* ── 공통 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.h1{font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.25;margin:0 0 6px}
.h2{font-size:13px;font-weight:800;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;margin:22px 4px 10px}
.sub{color:var(--tx2);font-size:14px;margin:0 0 18px;word-break:keep-all}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:16px;border-radius:14px;font-weight:800;font-size:16px;
  background:var(--card2);border:1px solid var(--line2);transition:transform .08s;
}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#241a04;border:0;box-shadow:0 6px 18px rgba(255,143,92,.28)}
.btn.gh{background:transparent;border:1px dashed var(--line2);color:var(--tx2);font-weight:700}
.btn.sm{padding:11px 14px;font-size:14px;border-radius:11px;width:auto}
.btn.dan{color:var(--no);border-color:rgba(255,107,125,.35)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px}
.row>*{flex:1}
.inp{
  width:100%;padding:15px 14px;border-radius:13px;background:var(--bg2);
  border:1px solid var(--line2);color:var(--tx);outline:none;font-weight:600;
}
.inp:focus{border-color:var(--ac)}
.inp.code{text-align:center;font-size:32px;font-weight:900;letter-spacing:.3em;font-family:'JetBrains Mono',ui-monospace,monospace;padding-left:.3em}
.note{font-size:12.5px;color:var(--tx3);line-height:1.6;word-break:keep-all}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.07);color:var(--tx2)}
.pill.ac{background:rgba(255,203,92,.15);color:var(--ac)}
.pill.ok{background:rgba(92,227,154,.14);color:var(--ok)}
.pill.no{background:rgba(255,107,125,.14);color:var(--no)}

/* ── 플레이어 ── */
.plist{display:flex;flex-direction:column;gap:8px}
.pl{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:13px;
  background:var(--bg2);border:1px solid var(--line);
}
.av{
  width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  font-weight:900;font-size:15px;color:#1a1526;
}
.pl-n{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--tx3);background:rgba(255,255,255,.05);flex:none}
.off-dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex:none}

/* ── 게임 카드 ── */
.glist{display:flex;flex-direction:column;gap:10px}
.g{
  display:flex;align-items:center;gap:13px;padding:14px;border-radius:15px;
  background:var(--card);border:1px solid var(--line);text-align:left;width:100%;
  transition:transform .08s,border-color .15s;
}
.g:active{transform:scale(.985)}
.g-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--card2);flex:none}
.g-b{flex:1;min-width:0}
.g-n{font-weight:800;font-size:15.5px;letter-spacing:-.02em;margin-bottom:3px;word-break:keep-all}
.g-m{font-size:12px;color:var(--tx3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.g-ar{color:var(--tx3);font-size:18px;flex:none}
.g.played{border-color:rgba(92,227,154,.3)}

/* ── 규칙 ── */
.rules{white-space:pre-wrap;word-break:keep-all;font-size:14.5px;line-height:1.75;color:#ded7f0}
.rules b{color:var(--ac)}
.warnbox{background:rgba(255,143,92,.09);border:1px solid rgba(255,143,92,.28);border-radius:12px;padding:12px 13px;font-size:13px;color:#ffcaa8;word-break:keep-all;line-height:1.6}

/* ── 순위 입력 ── */
.rank-slot{
  display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:13px;
  background:linear-gradient(90deg,rgba(255,203,92,.10),transparent);border:1px solid rgba(255,203,92,.22);margin-bottom:7px;
}
.rank-no{width:30px;height:30px;border-radius:9px;background:var(--ac);color:#241a04;font-weight:900;display:grid;place-items:center;font-size:14px;flex:none}
.pick{
  display:flex;align-items:center;gap:10px;padding:13px;border-radius:13px;width:100%;text-align:left;
  background:var(--bg2);border:1px solid var(--line2);margin-bottom:7px;
}
.pick:active{transform:scale(.985)}

/* ── 리더보드 ── */
.lb{display:flex;flex-direction:column;gap:8px}
.lb-r{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.lb-r.t1{background:linear-gradient(100deg,rgba(255,203,92,.16),var(--card));border-color:rgba(255,203,92,.38)}
.lb-r.t2{background:linear-gradient(100deg,rgba(200,208,230,.10),var(--card));border-color:rgba(200,208,230,.25)}
.lb-r.t3{background:linear-gradient(100deg,rgba(214,141,86,.10),var(--card));border-color:rgba(214,141,86,.25)}
.lb-rk{width:30px;text-align:center;font-weight:900;font-size:17px;color:var(--tx3);flex:none}
.lb-n{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-p{font-weight:900;font-size:19px;color:var(--ac);font-family:'JetBrains Mono',ui-monospace,monospace}
.lb-p small{font-size:11px;color:var(--tx3);font-weight:700;margin-left:2px}

/* ── 팀 ── */
.tm{border-radius:14px;padding:13px;border:1px solid var(--line);margin-bottom:10px;background:var(--card)}
.tm-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;margin-bottom:9px}
.tm-c{width:11px;height:11px;border-radius:4px}
.tm-p{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 10px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:700}

/* ── 토스트/모달 ── */
#toast{
  position:fixed;left:50%;bottom:calc(26px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:#312a47;border:1px solid var(--line2);color:var(--tx);
  padding:12px 18px;border-radius:13px;font-weight:700;font-size:14px;
  box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:88vw;text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ov{position:fixed;inset:0;background:rgba(8,6,14,.75);backdrop-filter:blur(6px);z-index:150;display:grid;place-items:center;padding:20px}
.ov-b{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:22px;width:100%;max-width:400px;box-shadow:var(--sh)}

/* ── 큰 결과 표시 ── */
.big{
  text-align:center;padding:34px 20px;border-radius:20px;
  background:linear-gradient(150deg,rgba(255,203,92,.16),rgba(255,143,92,.07));
  border:1px solid rgba(255,203,92,.35);
}
.big-l{font-size:13px;font-weight:800;color:var(--ac);letter-spacing:.1em;margin-bottom:12px}
.big-v{font-size:38px;font-weight:900;letter-spacing:-.03em;line-height:1.15;word-break:keep-all}

.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line2);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{padding:10px 13px;border-radius:11px;font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.banner.warn{background:rgba(255,107,125,.12);border:1px solid rgba(255,107,125,.3);color:#ffb3bc}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hd-back" id="hd-back" style="display:none">‹</button>
    <div class="hd-t" id="hd-t">숙소 게임</div>
    <div class="hd-dot" id="hd-dot" style="display:none"></div>
    <button class="hd-code" id="hd-code" style="display:none"></button>
  </header>
  <main id="view"></main>
</div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

/* 순위 → 포인트 (마리오카트식). 6등 이하는 1점 */
const RANK_POINTS = [10, 7, 5, 3, 2];
const rankPt = i => RANK_POINTS[i] ?? 1;

const TEAM_COLORS = ['#ff8f5c','#6fa8ff','#5ce39a','#c78fff','#ffcb5c','#ff6b9d'];
const AV_COLORS   = ['#ffcb5c','#ff8f5c','#6fa8ff','#5ce39a','#c78fff','#ff6b9d','#7fe3d4','#ffa8a8','#b0d17a','#e0a3ff','#8fd0ff','#ffd28f'];

/* ══════════════════════════════════════════════
   게임 레지스트리 — 여기에 한 줄 추가하면 앱 전체에 반영됨
══════════════════════════════════════════════ */
const GAMES = [
  {
    id:'noise', name:'멕썸노이즈', emoji:'🔊', mode:'solo', weight:1,
    role:'술래', tag:'술래 1명',
    rules:
`정답에 가까운 행동을 하면 나머지가 소리를 질러 알려주는 게임.

<b>준비</b>
· 술래 1명을 뽑는다.
· 나머지는 "OO이(가) OO을(를) OO한다" 형태의 미션 문장을 하나 정한다.
· 술래는 그 문장을 모른다.

<b>진행</b>
· 술래가 아무 행동이나 시도한다.
· 정답에 가까워질수록 나머지가 크게 소리를 지른다.
· 멀어지면 조용해진다.
· 제한 시간 안에 미션을 정확히 수행하면 성공.

<b>순위</b>
· 전원이 한 번씩 술래를 하고, 성공까지 걸린 시간이 짧은 순.`
  },
  {
    id:'smile', name:'스마일~!', emoji:'📸', mode:'solo', weight:1,
    role:'술래', tag:'술래 1명 · 사진 10장',
    rules:
`술래가 찍은 사진에 걸리면 다음 술래가 되는 게임.

<b>조건</b>
· 술래는 총 <b>10장</b>까지 찍을 수 있다.
· 카메라는 <b>클로즈업(줌) 배율</b>로 촬영한다.

<b>진행</b>
· 술래가 "스마일~!"을 외치면 모두 멈추고 술래를 향해 포즈를 취한다.
· 이때 움직이면 술래가 된다.
· 술래가 사진을 찍는다. 찍고 난 뒤에는 다시 움직이거나 자리를 옮길 수 있다.

<b>판정</b>
· 10장 안에 <b>딱 1명</b>만 찍혔다면 그 사람이 다음 술래.
· 2명 이상 찍혔다면, 안 찍힌 사람은 빠지고 찍힌 사람들끼리 한 번 더 진행.

<b>순위</b>
· 마지막까지 안 걸린 사람이 1등. 술래가 된 순서의 역순.`
  },
  {
    id:'body', name:'몸으로 말해요 / 한글자로 말해요', emoji:'🕺', mode:'team', weight:1.5,
    role:'사회자', tag:'팀전 · 사회자 필요',
    rules:
`<b>① 몸으로 말해요</b>
· 사회자가 제시어를 낸다 (노래 제목, 영화 제목 등).
· 설명자는 말 없이 몸동작만으로 설명하고 팀원이 맞춘다.

<b>② 한글자로 말해요</b>
· 각 팀은 <b>딱 한 글자</b>를 정한다. (예: "짜")
· 그 한 글자만 사용해 억양·연기·몸동작으로 제시어를 설명한다.
· 팀원이 맞추면 성공.

<b>순위</b>
· 제한 시간 안에 맞춘 개수가 많은 팀 순.`
  },
  {
    id:'mafia', name:'상황극 마피아', emoji:'🎭', mode:'solo', weight:1.5,
    role:'사회자', tag:'개인전 · 사회자 필요',
    rules:
`마피아 게임 + 역할극.

<b>준비</b>
· 사회자가 배경 상황을 정한다 (회사 회식, 수학여행, 크루즈 등).
· 각자 역할(직업·캐릭터)을 배정받고, 그중 마피아가 섞여 있다.

<b>진행</b>
· 낮에는 자기 역할에 맞춰 연기하며 토론한다.
· 캐릭터를 유지한 채로 서로를 의심해야 한다.
· 밤에는 마피아가 한 명을 지목한다.

<b>순위</b>
· 승리 진영 전원이 상위. 그 안에서 MVP를 앞순위로.`
  },
  {
    id:'watch', name:'안 봤어도 들키지마', emoji:'🎬', mode:'solo', weight:1.5,
    role:'출제자', tag:'개인전 · 코인제 · 출제자 로테이션',
    rules:
`<b>흐름</b>
· 시계방향으로 한 명씩 돌아가며 출제자가 된다.
· 출제자는 영화 / 드라마 / 애니 중 하나를 골라, <b>본 사람만 아는 문제</b>를 하나 만들고 작품 이름을 공개한다.
· 작품 이름이 공개된 순간부터 <b>10분 토론</b> 시작.
· 아는 척, 모르는 척 하며 서로를 혼란스럽게 만든다.

<b>지목</b>
· 토론이 끝나면 다 같이 <b>"너 이거 안 봤지!"</b>를 외치며 손가락으로 가리킨다.
· 1명당 <b>2지목</b> 가능 (한 사람에게 몰아주기 가능), 출제자는 <b>1지목</b>.
· 가장 많이 지목받은 사람이 문제를 푼다.
· 동점이면 그 사람들끼리 재지목.

<b>코인</b>
· 맞추면 → 지목받은 수만큼 코인 획득.
· 틀리면 → 지목한 사람들과 출제자가 각각 코인 1개.

<b>팁</b>
· 출제자: 모두 아는 문제를 내면 코인을 못 받는다. 난이도 조절이 핵심.
· 참가자: 맞출 자신이 있으면 일부러 의심을 사서 코인을 벌 수 있다.
· 확신하면 한 사람에게 2지목 몰아주기.
· 진짜 모르면 오히려 대놓고 "몰라" 하기 — 코인 노리고 연기하는 걸로 보이게.

<b>순위</b>
· 전원이 출제자를 한 번씩 하면 종료. 코인이 많은 순.

<b>문제 예시</b>
· 태극기 휘날리며 — 주인공 두 명의 관계는?`,
    todo:'출제자 규칙 미완: "마지막 문제를 아무도 못 맞추면 출제자의 ___" 부분이 비어 있음 (페널티인지 보너스인지 확정 필요)'

  },
  {

    role:null, tag:'물리 게임',
    rules:
`물이 담긴 컵을 휴지로 당겨 옮기는 레이스.

<b>준비</b>

<b>진행</b>
· 휴지만 당겨서 컵을 목표 지점까지 옮긴다.
· 물을 쏟거나 휴지가 찢어지면 실패.

<b>순위</b>
· 성공한 사람 중 걸린 시간이 짧은 순.`
  },
];
const G = id => GAMES.find(g => g.id === id);

/* ══════════════════════════════════════════════
   상태
══════════════════════════════════════════════ */
const LS = 'partygames_session';
const S = {
  view:'home',
  code:null,
  pid:null,
  isHost:false,
  online:true,
  room:null,          // {createdAt,host,players,teams,scores,rotation,status}
  gameId:null,        // 상세/점수 입력 중인 게임
  draft:null,         // 순위 입력 draft {gameId,mode,order:[],assign}
  unsub:null,
  hb:null,
};

const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const emptyRoom = () => ({ createdAt:now(), host:'', status:'lobby', players:{}, teams:{count:0,assign:{}}, scores:{}, rotation:{} });

function toast(msg, ms=2200){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), ms);
}
function uid(){ return Math.random().toString(36).slice(2,10) + now().toString(36).slice(-4); }
function avColor(pid){
  let n = 0; for (const c of String(pid)) n = (n*31 + c.charCodeAt(0)) >>> 0;
  return AV_COLORS[n % AV_COLORS.length];
}
function vib(ms=12){ try{ navigator.vibrate?.(ms); }catch{} }

/* 화면 꺼짐 방지 */
let wakeLock = null;
async function keepAwake(){
  try{
    if (!('wakeLock' in navigator)) return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
  }catch{}
}
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState === 'visible' && !wakeLock) keepAwake(); });

/* ══════════════════════════════════════════════
   Firebase 동기화
   원칙: 호스트 기기가 진실원. RTDB는 미러.
        - 호스트: 로컬 room을 고치고 즉시 렌더 → 서버로 write-through(실패해도 무시)
                  서버 스냅샷에서는 players만 병합해서 받음(다른 사람 입장 감지)
        - 참여자: 서버 스냅샷을 그대로 반영 + 자기 players 노드만 write
══════════════════════════════════════════════ */
const roomRef = code => ref(db, `${ROOT}/rooms/${code}`);

function watchConnection(){
  onValue(ref(db, '.info/connected'), snap => {
    S.online = !!snap.val();
    const d = $('#hd-dot'); if (d) d.classList.toggle('off', !S.online);
    if (S.view !== 'home') render();
  });
}

function pushHostState(){
  if (!S.isHost || !S.code || !S.room) return;
  const r = S.room;
  update(roomRef(S.code), {
    status: r.status || 'lobby',
    host: r.host || S.pid,
    teams: r.teams || {count:0,assign:{}},
    scores: r.scores || {},
    rotation: r.rotation || {},
    touchedAt: now(),
  }).catch(()=>{});
}

function subscribe(code){
  if (S.unsub) S.unsub();
  S.unsub = onValue(roomRef(code), snap => {
    const v = snap.val();
    if (!v){
      if (!S.isHost){ toast('방이 사라졌어요'); leaveRoom(); }
      return;
    }
    if (S.isHost){
      // 호스트: 다른 사람 입장/이름변경만 받아옴
      S.room.players = v.players || S.room.players || {};
    }else{
      S.room = {
        createdAt: v.createdAt || now(),
        host: v.host || '',
        status: v.status || 'lobby',
        players: v.players || {},
        teams: v.teams || {count:0,assign:{}},
        scores: v.scores || {},
        rotation: v.rotation || {},
      };
    }
    render();
  });
}

function startHeartbeat(){
  clearInterval(S.hb);
  const beat = () => {
    if (!S.code || !S.pid) return;
    update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { seen: now() }).catch(()=>{});
  };
  beat();
  S.hb = setInterval(beat, 20000);
}

function saveSession(){
  try{ localStorage.setItem(LS, JSON.stringify({ code:S.code, pid:S.pid, isHost:S.isHost, name:myName() })); }catch{}
}
function clearSession(){ try{ localStorage.removeItem(LS); }catch{} }

/* ── 방 만들기 / 참여 ── */
async function newCode(){
  for (let i = 0; i < 40; i++){
    const c = String(Math.floor(1000 + Math.random()*9000));
    try{
      const s = await get(roomRef(c));
      const v = s.val();
      // 12시간 지난 방은 재사용
      if (!v || (now() - (v.touchedAt || v.createdAt || 0)) > 12*3600*1000) return c;
    }catch{ return c; }
  }
  return String(Math.floor(1000 + Math.random()*9000));
}

async function createRoom(name){
  const code = await newCode();
  S.pid = uid(); S.isHost = true; S.code = code;
  S.room = emptyRoom();
  S.room.host = S.pid;
  S.room.players[S.pid] = { name, joinedAt:now(), seen:now(), host:true };
  try{ await set(roomRef(code), { ...S.room, touchedAt:now() }); }
  catch{ toast('오프라인 상태 — 이 기기에서만 진행돼요'); }
  saveSession(); subscribe(code); startHeartbeat(); keepAwake();
  go('lobby');
}

async function joinRoom(code, name){
  let v = null;
  try{ v = (await get(roomRef(code))).val(); }
  catch{ toast('연결 실패 — 인터넷을 확인해 주세요'); return false; }
  if (!v){ toast('그런 방이 없어요'); return false; }

  S.pid = uid(); S.isHost = false; S.code = code;
  S.room = {
    createdAt:v.createdAt||now(), host:v.host||'', status:v.status||'lobby',
    players:v.players||{}, teams:v.teams||{count:0,assign:{}}, scores:v.scores||{}, rotation:v.rotation||{}
  };
  try{ await set(ref(db, `${ROOT}/rooms/${code}/players/${S.pid}`), { name, joinedAt:now(), seen:now() }); }
  catch{}
  saveSession(); subscribe(code); startHeartbeat(); keepAwake();
  go('lobby');
  return true;
}

async function rejoin(sess){
  let v = null;
  try{ v = (await get(roomRef(sess.code))).val(); }catch{}
  if (!v) return false;
  if (!v.players || !v.players[sess.pid]) return false;
  S.pid = sess.pid; S.code = sess.code; S.isHost = !!sess.isHost;
  S.room = {
    createdAt:v.createdAt||now(), host:v.host||'', status:v.status||'lobby',
    players:v.players||{}, teams:v.teams||{count:0,assign:{}}, scores:v.scores||{}, rotation:v.rotation||{}
  };
  subscribe(sess.code); startHeartbeat(); keepAwake();
  go('lobby');
  return true;
}

function leaveRoom(){
  if (S.unsub) S.unsub();
  clearInterval(S.hb);
  if (S.code && S.pid && !S.isHost) remove(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`)).catch(()=>{});
  S.unsub = null; S.code = null; S.pid = null; S.isHost = false; S.room = null; S.draft = null; S.gameId = null;
  clearSession();
  go('home');
}

/* ══════════════════════════════════════════════
   계산
══════════════════════════════════════════════ */
const players = () => Object.entries(S.room?.players || {})
  .sort((a,b) => (a[1].joinedAt||0) - (b[1].joinedAt||0));
const pname = pid => S.room?.players?.[pid]?.name || '?';
const myName = () => pname(S.pid);
const isOnline = p => (now() - (p.seen || 0)) < 70000;

function calcPoints(){
  const pts = {};
  for (const [pid] of players()) pts[pid] = 0;
  for (const sc of Object.values(S.room?.scores || {})){
    const w = sc.weight ?? (G(sc.gameId)?.weight ?? 1);
    (sc.order || []).forEach((entry, i) => {
      const base = rankPt(i) * w;
      if (sc.mode === 'team'){
        Object.entries(sc.assign || {}).forEach(([pid, t]) => {
          if (Number(t) === Number(entry) && pts[pid] != null) pts[pid] += base;
        });
      }else if (pts[entry] != null){
        pts[entry] += base;
      }
    });
  }
  return pts;
}
const fmtPt = n => (Math.round(n*10)/10).toString().replace(/\.0$/,'');

function playedGames(){
  const m = {};
  for (const sc of Object.values(S.room?.scores || {})) m[sc.gameId] = (m[sc.gameId]||0) + 1;
  return m;
}

/* 아직 그 역할을 안 맡은 사람 중에서 뽑기 (전원 소진 시 리셋) */
function pickRole(gameId){
  const done = (S.room.rotation?.[gameId] || []).filter(p => S.room.players[p]);
  const all = players().map(([pid]) => pid);
  let pool = all.filter(p => !done.includes(p));
  let reset = false;
  if (!pool.length){ pool = all; reset = true; }
  const pick = pool[Math.floor(Math.random()*pool.length)];
  if (!S.room.rotation) S.room.rotation = {};
  S.room.rotation[gameId] = reset ? [pick] : [...done, pick];
  pushHostState();
  return { pick, reset };
}

function makeTeams(count){
  const all = players().map(([pid]) => pid);
  for (let i = all.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
  const assign = {};
  all.forEach((pid, i) => { assign[pid] = i % count; });
  S.room.teams = { count, assign };
  pushHostState();
}

/* ══════════════════════════════════════════════
   라우팅 / 렌더
══════════════════════════════════════════════ */
function go(view){ S.view = view; render(); window.scrollTo(0,0); }

  back.style.display = showBack ? '' : 'none';
  title.textContent = ({
    home:'숙소 게임', lobby:'대기실', games:'게임 고르기',
    game:G(S.gameId)?.name || '게임', score:'순위 입력', board:'종합 순위', settings:'설정'
  })[S.view] || '숙소 게임';

  const v = $('#view');
  v.innerHTML = ({

  })[S.view]();

$('#hd-back').onclick = () => {

};
$('#hd-code').onclick = shareRoom;

async function shareRoom(){
  const url = `${location.origin}${location.pathname}?r=${S.code}`;
  const text = `숙소 게임 방 코드: ${S.code}\n${url}`;
  try{
    if (navigator.share){ await navigator.share({ title:'숙소 게임', text }); return; }
    await navigator.clipboard.writeText(text);
    toast('방 코드와 링크를 복사했어요');
  }catch{ toast(`방 코드: ${S.code}`); }
}

function offlineBanner(){

}

function vLobby(){
  const ps = players();

  const plist = ps.map(([pid,p]) => `
    <div class="pl">

    <div style="height:20px"></div>
    <button class="btn pri" data-act="go-games">🎲 게임 고르기</button>
    <div style="height:8px"></div>
    <div class="row">
      <button class="btn" data-act="go-board">🏆 종합 순위${played ? ` (${played}판)` : ''}</button>
      <button class="btn" data-act="go-settings" style="flex:0 0 62px">⚙️</button>

  return `

    ${g.todo ? `<div class="warnbox" style="margin-bottom:12px">📝 ${h(g.todo)}</div>` : ''}

    <div class="card">
      <div class="h2" style="margin:0 0 12px">규칙</div>
      <div class="rules">${g.rules}</div>
    </div>

    <button class="btn pri" data-act="score-start">✅ 게임 끝 — 순위 입력</button>`;
}

/* ── 순위 입력 ── */
function vScore(){
  const g = G(S.gameId); if (!g) return '';
  const d = S.draft;
  const isTeam = d.mode === 'team';
  const teams = S.room.teams || {count:0,assign:{}};

  const entries = isTeam
    ? Array.from({length:teams.count}, (_,i) => ({ id:i, label:`${i+1}팀`, sub:Object.entries(teams.assign||{}).filter(([,t])=>Number(t)===i).map(([p])=>pname(p)).join(', '), color:TEAM_COLORS[i] }))
    : players().map(([pid,p]) => ({ id:pid, label:p.name, sub:'', color:avColor(pid) }));

  const remain = entries.filter(e => !d.order.some(o => String(o) === String(e.id)));

  const chosen = d.order.map((oid, i) => {
    const e = entries.find(x => String(x.id) === String(oid));
    return `<div class="rank-slot">
        <div class="rank-no">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800">${h(e?.label || '?')}</div>
          ${e?.sub ? `<div class="note">${h(e.sub)}</div>` : ''}
        </div>
        <div style="font-weight:900;color:var(--ac);font-family:monospace">+${fmtPt(rankPt(i)*d.weight)}</div>
      </div>`;
  }).join('');

  return `
    ${offlineBanner()}
    <div class="card">
      <div style="font-weight:900;font-size:16px;margin-bottom:4px">${g.emoji} ${h(g.name)}</div>
      <div class="note">${isTeam ? '잘한 팀' : '잘한 사람'} 순서대로 탭하세요. 배점 ×${d.weight}</div>
    </div>

    ${chosen ? `<div class="h2">순위</div>${chosen}
      <button class="btn gh sm" data-act="undo" style="width:100%;margin-top:4px">↩︎ 마지막 취소</button>` : ''}

    ${remain.length ? `
      <div class="h2">${d.order.length ? `${d.order.length+1}등 고르기` : '1등 고르기'}</div>
      ${remain.map(e => `
        <button class="pick" data-act="pickrank" data-id="${e.id}">
          <div class="av" style="background:${e.color}">${h(String(e.label)[0])}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800">${h(e.label)}</div>
            ${e.sub ? `<div class="note">${h(e.sub)}</div>` : ''}
          </div>
        </button>`).join('')}` : ''}

    <div style="height:14px"></div>
    <button class="btn pri" data-act="score-save" ${d.order.length < 2 ? 'disabled' : ''}>
      ${d.order.length < 2 ? '최소 2명(팀)은 순위를 정해주세요' : '저장하고 순위 반영'}
    </button>
    <div style="height:8px"></div>
    <button class="btn gh" data-act="score-cancel">취소</button>`;
}

/* ── 종합 순위 ── */
function vBoard(){
  const pts = calcPoints();
  const rows = players().map(([pid,p]) => ({ pid, name:p.name, pt:pts[pid]||0 }))
    .sort((a,b) => b.pt - a.pt || a.name.localeCompare(b.name));
  const scores = Object.entries(S.room.scores || {}).sort((a,b) => (b[1].at||0) - (a[1].at||0));

  return `
    ${offlineBanner()}
    ${rows.length ? `<div class="lb">${rows.map((r,i) => `
      <div class="lb-r ${i<3?'t'+(i+1):''}">
        <div class="lb-rk">${['🥇','🥈','🥉'][i] || (i+1)}</div>
        <div class="av" style="background:${avColor(r.pid)}">${h(r.name[0])}</div>
        <div class="lb-n">${h(r.name)}${r.pid===S.pid?' <span class="pill ac">나</span>':''}</div>
        <div class="lb-p">${fmtPt(r.pt)}<small>점</small></div>
      </div>`).join('')}</div>` : '<p class="note">아직 참가자가 없어요</p>'}

    <div class="h2">진행한 게임 ${scores.length}판</div>
    ${scores.length ? scores.map(([sid,sc]) => {
      const g = G(sc.gameId);
      const names = (sc.order||[]).slice(0,3).map((o,i) =>
        `${i+1}. ${sc.mode==='team' ? `${Number(o)+1}팀` : h(pname(o))}`).join('  ');
      return `<div class="card" style="padding:13px 14px;display:flex;align-items:center;gap:12px">
        <div style="font-size:22px">${g?.emoji||'🎲'}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:14px">${h(g?.name || sc.gameId)}</div>
          <div class="note">${names}</div>
        </div>
        ${S.isHost ? `<button class="pl-x" data-act="del-score" data-sid="${sid}">✕</button>` : ''}
      </div>`;
    }).join('') : '<p class="note">아직 없어요. 게임을 하나 끝내고 순위를 입력해 보세요.</p>'}

    <div style="height:14px"></div>
    <div class="card">
      <div class="h2" style="margin:0 0 8px">점수 방식</div>
      <p class="note">1등 10점 · 2등 7점 · 3등 5점 · 4등 3점 · 5등 2점 · 이하 1점<br>
      여기에 게임별 배점(×0.5 ~ ×1.5)을 곱합니다. 팀전은 팀 순위 점수를 팀원 전원에게 똑같이 줍니다.</p>
    </div>`;
}

/* ── 설정 ── */
function vSettings(){
  return `
    <div class="card">
      <div class="h2" style="margin:0 0 10px">내 이름</div>
      <input class="inp" id="in-rename" maxlength="8" value="${h(myName())}">
      <div style="height:8px"></div>
      <button class="btn sm" data-act="rename" style="width:100%">이름 바꾸기</button>
    </div>
    ${S.isHost ? `
    <div class="card">
      <div class="h2" style="margin:0 0 10px">진행자 도구</div>
      <button class="btn gh sm" data-act="reset-scores" style="width:100%;margin-bottom:8px">점수 전체 초기화</button>
      <button class="btn gh sm" data-act="reset-rot" style="width:100%">술래·출제자 순번 초기화</button>
    </div>` : ''}
    <div class="card">
      <div class="h2" style="margin:0 0 10px">방</div>
      <p class="note" style="margin-bottom:10px">${S.isHost ? '진행자입니다. 이 기기가 점수의 기준이 되니, 게임 중에는 앱을 닫지 마세요.' : '참가자입니다.'}</p>
      <button class="btn dan sm" data-act="leave" style="width:100%">방 나가기</button>
    </div>
    <p class="note" style="text-align:center;margin-top:18px">${APP_VERSION}</p>`;
}

/* ══════════════════════════════════════════════
   이벤트
══════════════════════════════════════════════ */
function bind(root){
  root.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = () => act(el.dataset.act, el.dataset);
  });
  const ci = root.querySelector('#in-code');
  if (ci) ci.oninput = () => { ci.value = ci.value.replace(/\D/g,'').slice(0,4); if (ci.value.length === 4) act('join', {}); };
}

async function act(a, d){
  vib();
  switch(a){

  case 'create': {
    const name = ($('#in-name')?.value || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    await createRoom(name);
    break;
  }
  case 'join': {
    const name = ($('#in-name')?.value || '').trim();
    const code = ($('#in-code')?.value || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    if (code.length !== 4) return toast('4자리 방 코드를 입력해 주세요');
    await joinRoom(code, name);
    break;
  }
  case 'rejoin': {
    const sess = JSON.parse(localStorage.getItem(LS) || 'null');
    if (!sess) return;
    const ok = await rejoin(sess);
    if (!ok){ clearSession(); toast('예전 방을 찾을 수 없어요'); render(); }
    break;
  }
  case 'share': shareRoom(); break;

  case 'kick': {
    if (!S.isHost) return;
    delete S.room.players[d.pid];
    remove(ref(db, `${ROOT}/rooms/${S.code}/players/${d.pid}`)).catch(()=>{});
    render();
    break;
  }
  case 'teams': {
    const n = Number(d.n);
    if (n < 2){ S.room.teams = {count:0,assign:{}}; pushHostState(); }
    else if (players().length < n) return toast(`${n}팀을 나누려면 ${n}명 이상 필요해요`);
    else makeTeams(n);
    render();
    break;
  }

  case 'go-games': go('games'); break;
  case 'go-board': go('board'); break;
  case 'go-settings': go('settings'); break;

  case 'game': S.gameId = d.id; go('game'); break;

  case 'pick': {
    if (!S.isHost) return toast('진행자만 뽑을 수 있어요');
    const { pick, reset } = pickRole(S.gameId);
    S._lastPick = S._lastPick || {};
    S._lastPick[S.gameId] = pick;
    render();
    if (reset) toast('전원이 한 바퀴 돌아서 순번을 새로 시작해요');
    break;
  }
  case 'rot-reset': {
    if (!S.isHost) return;
    if (S.room.rotation) delete S.room.rotation[S.gameId];
    if (S._lastPick) delete S._lastPick[S.gameId];
    pushHostState(); render(); toast('순번을 초기화했어요');
    break;
  }

  case 'score-start': {
    if (!S.isHost) return toast('순위 입력은 진행자 기기에서 해주세요');
    const g = G(S.gameId);
    const teams = S.room.teams || {count:0};
    const mode = (g.mode === 'team' && teams.count > 1) ? 'team' : 'solo';
    if (g.mode === 'team' && teams.count < 2) return toast('팀전이에요 — 대기실에서 팀을 먼저 나눠주세요');
    S.draft = { gameId:g.id, mode, order:[], weight:g.weight, assign: JSON.parse(JSON.stringify(teams.assign || {})) };
    go('score');
    break;
  }
  case 'pickrank': {
    const id = S.draft.mode === 'team' ? Number(d.id) : d.id;
    S.draft.order.push(id);
    render();
    break;
  }
  case 'undo': S.draft.order.pop(); render(); break;
  case 'score-cancel': S.draft = null; go('game'); break;
  case 'score-save': {
    const d2 = S.draft;
    const sid = 's' + now().toString(36) + Math.random().toString(36).slice(2,6);
    if (!S.room.scores) S.room.scores = {};
    S.room.scores[sid] = { gameId:d2.gameId, mode:d2.mode, order:d2.order, weight:d2.weight, assign:d2.assign, at:now() };
    pushHostState();
    S.draft = null;
    go('board');
    toast('순위가 반영됐어요');
    break;
  }
  case 'del-score': {
    if (!S.isHost) return;
    delete S.room.scores[d.sid];
    set(ref(db, `${ROOT}/rooms/${S.code}/scores`), S.room.scores).catch(()=>{});
    render();
    break;
  }

  case 'rename': {
    const n = ($('#in-rename')?.value || '').trim();
    if (!n) return toast('이름을 입력해 주세요');
    S.room.players[S.pid].name = n;
    update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { name:n }).catch(()=>{});
    saveSession(); render(); toast('이름을 바꿨어요');
    break;
  }
  case 'reset-scores': {
    if (!confirm('점수를 전부 지울까요? 되돌릴 수 없어요.')) return;
    S.room.scores = {};
    set(ref(db, `${ROOT}/rooms/${S.code}/scores`), {}).catch(()=>{});
    render(); toast('점수를 초기화했어요');
    break;
  }
  case 'reset-rot': {
    S.room.rotation = {}; S._lastPick = {};
    pushHostState(); render(); toast('순번을 초기화했어요');
    break;
  }
  case 'leave': {
    if (S.isHost && !confirm('진행자가 나가면 점수 기준 기기가 사라져요. 나갈까요?')) return;
    leaveRoom();
    break;
  }
  }
}

/* ══════════════════════════════════════════════
   부팅
══════════════════════════════════════════════ */
watchConnection();
render();

(async () => {
  const q = new URLSearchParams(location.search).get('r');
  const sess = (() => { try{ return JSON.parse(localStorage.getItem(LS) || 'null'); }catch{ return null; } })();
  if (sess && (!q || q === sess.code)){
    const ok = await rejoin(sess);
    if (ok) return;
    clearSession();
  }
  if (q && /^\d{4}$/.test(q)){
    const el = $('#in-code'); if (el) el.value = q;
  }
})();

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
