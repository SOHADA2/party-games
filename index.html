/* ── 진행 도구 라우터 ── */
function vPlay(){
  const p = S.play; if (!p) return '';
  switch (p.kind){
    case 'deck':  return vDeck();
    case 'cho':   return vCho();
    case 'song':  return vSong();
    case 'yut':   return vYut();
    case 'noise': return vNoise();
    case 'cup':   return vCup();
    case 'act':   return vAct();
    case 'smile': return vSmile();
  }
  return '';
}

/* 남은 제시어 박스 — 두 덱 게임이 같이 쓴다(같은 문제를 다르게 보여주면 헷갈린다) */
function stockBox(gid, total, need, unit){
  const used = usedWords(gid).size;
  const left = Math.max(0, total - used);
  if (!used) return `<div class="stockbox">
      <div class="v">${total}</div>
      <div class="t"><b>${unit} ${total}개</b><br>같은 ${unit}는 다음 판에 안 나와요</div>
    </div>`;
  const low = left < need;
  return `<div class="stockbox ${low?'low':''}">
      <div class="v">${left}</div>
      <div class="t"><b>아직 안 나온 ${unit} ${left}개</b><br>
        ${low ? `이번 판을 채우기엔 모자라서 <b>기록을 비우고 처음부터</b> 돕니다`
              : `지금까지 ${used}개 사용 · 전체 ${total}개`}</div>
      <button data-act="used-reset">🔄 초기화</button>
    </div>`;
}

/* ── 🎲 훈민정음 윷놀이 (태블릿 = 말판) ── */
function vYut(){
  const p = S.play, g = G(p.gameId);
  const m = YT();
  const teams = S.room.teams || { count:0 };

  if (!m || p.phase === 'setup') return `
    <div class="gh" style="${gcVars(g.color)};padding:17px">
      <div class="gh-n" style="font-size:18px;padding-right:0">${g.emoji} ${h(g.name)}</div>
      <p class="note" style="margin-top:7px;position:relative">
        이 화면을 가운데 두세요 — 각자 폰으로 윷을 던집니다</p>
    </div>
    <div class="mcbox need">
      <span class="i">📱</span>
      <span><b>모두 같은 방에 들어와 있어야 합니다</b>
        <span class="s">방 코드 <b>${h(S.code)}</b> 로 각자 폰에서 접속하면,
          자기 팀 차례에 <b>윷 던지기</b> 버튼이 뜹니다.</span></span>
    </div>
    <div class="card">
      <div class="sec" style="margin:0 0 10px">팀 <span class="n">${teams.count || 0}팀</span></div>
      ${teams.count >= 2
        ? `<p class="note">팀마다 말 4개로 시작합니다. 4개를 먼저 다 내보내면 이겨요.</p>`
        : `<div class="balbox no"><b>팀을 먼저 나눠주세요</b>
             <span>대기실에서 2팀 이상으로 편성해야 판을 깔 수 있어요.</span></div>`}
    </div>
    <div style="height:14px"></div>
    <div class="stack">
      <button class="btn pri" data-act="yut-start" ${teams.count >= 2 ? '' : 'disabled'}>🎲 판 깔고 시작</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  const t = m.turn;
  const done = ti => m.pieces[ti].filter(x => x === YUT_HOME).length;
  const wait = ti => m.pieces[ti].filter(x => x === -1).length;
  const sel = S.play.useIdx ?? 0;                 // 지금 쓰려는 윷 결과
  const pend = m.pending || [];
  const use  = pend[sel];

  /* 집을 수 있는 칸 — 평소엔 이동, 벌칙 중엔 되돌릴 말 고르기 */
  const picking = !!m.pick;
  const hot = picking
    ? [...new Set(m.pieces[m.pick.team].filter(x => x >= 0 && x !== YUT_HOME))]
    : (use ? [...new Set(m.pieces[t].filter(x => x >= 0 && x !== YUT_HOME))] : []);
  const hotAct = picking ? 'yut-pickback' : 'yut-move';

  const board = `
    <div class="board">
      <!-- ⚠️ 선은 SVG. div 회전은 칸과 좌표가 안 맞는다.
           ⚠️ 진짜 윷판은 대각선이 **X자로 둘 다** 있다(둘 다 실제로 지나간다). -->
      <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none">
        <rect x="0" y="0" width="100" height="100" fill="none"
          stroke="currentColor" stroke-width="0.7" vector-effect="non-scaling-stroke"/>
        <line x1="100" y1="0" x2="0" y2="100" stroke="currentColor"
          stroke-width="0.7" vector-effect="non-scaling-stroke"/>
        <line x1="0" y1="0" x2="100" y2="100" stroke="currentColor"
          stroke-width="0.7" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="cellwrap">
        ${YUT_CELLS.map((c, i) => {
          if (!c) return '';
          const here = yutAt(m.pieces, i);
          const can = hot.includes(i);
          const label = i === 0 ? '날' : i === 23 ? '방' : YUT_START.includes(i) ? '⤢' : '';
          return `<div class="cell ${c.big ? 'big' : ''} ${can ? 'pick' : ''}"
            style="left:${c.x}%;top:${c.y}%" ${can ? `data-act="${hotAct}" data-pos="${i}"` : ''}>
            ${label}
            ${here.length ? `<div class="pcs">${here.map(x =>
              `<div class="pc" style="background:${TEAM_COLORS[x.t % TEAM_COLORS.length]}"></div>`).join('')}</div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;

  if (m.halt) return `
    <div class="haltbig">
      <div class="t">✋ 잠시!</div>
      <div class="s"><b>${h(pname(m.halt.by))}</b>님이
        <b>${h(teamName(m.halt.team))}</b>의 영어를 지적했습니다.<br>
        정말 영어를 썼나요? 다 같이 판단하고 눌러주세요.</div>
    </div>
    <div class="stack">
      <button class="btn dan" data-act="yut-halt-ok">✋ 인정 — ${h(teamName(m.halt.team))}이 말 1개 되돌리기</button>
      <button class="btn gh" data-act="yut-halt-no">아니었어요 — 계속 진행</button>
    </div>
    ${board}`;

  if (m.pick) return `
    <div class="haltbig">
      <div class="t">✋ ${h(teamName(m.pick.team))} — 되돌릴 말을 고르세요</div>
      <div class="s">영어를 썼습니다. <b>${h(teamName(m.pick.team))}이 직접</b>
        판에서 말 하나를 골라 집으로 보내세요.<br>
        <span style="color:var(--dim2)">방금 나온 말을 버리고 앞선 말을 지켜도 됩니다</span></div>
    </div>
    ${board}
    <p class="note" style="text-align:center">초록으로 표시된 말 중에서 고르세요</p>`;

  if (m.phase === 'ended') return `
    <div class="pickres">
      <div class="pickres-l">훈민정음 윷놀이</div>
      <div class="pickres-v">${h(teamName(m.winner))} 승리!</div>
    </div>
    ${board}
    <div class="sec">기록</div>
    <div class="card"><div class="ylog">${(m.log || []).map(x => `<div>${h(x)}</div>`).join('')}</div></div>
    <div style="height:14px"></div>
    <div class="stack">
      <button class="btn pri" data-act="yut-score">🏆 순위 입력하기</button>
      <button class="btn" data-act="yut-start">🔄 새 판</button>
      <button class="btn gh" data-act="yut-clear">🧹 정리 — 종료</button>
    </div>`;

  const canMove = m.pieces[t].some(x => x !== YUT_HOME);
  return `
    <div class="homebox">
      ${m.pieces.map((_, ti) => `
        <div class="hteam ${ti === t ? 'on' : ''}">
          <span class="dot" style="background:${TEAM_COLORS[ti % TEAM_COLORS.length]}"></span>
          ${h(teamName(ti))} <span style="color:var(--dim2)">난 말 ${done(ti)}/4</span>
          ${wait(ti) ? `<span style="color:var(--dim2)">· 집 ${wait(ti)}</span>` : ''}
          ${(m.penalty || {})[ti] ? `<span style="color:var(--rose)">· 영어 ${m.penalty[ti]}</span>` : ''}
        </div>`).join('')}
    </div>

    ${m.last ? `<div class="sticks">
        ${m.last.sticks.map(u => `<div class="stick ${u ? 'up' : ''}"></div>`).join('')}
        <div class="sname">${h(m.last.n)}</div>
      </div>` : ''}

    ${pend.length ? `
      <div class="sec">쓸 결과를 고르세요 <span class="n">${pend.length}개</span></div>
      <div class="pendrow">
        ${pend.map((x, k) => `<button class="pend ${k === sel ? 'on' : ''}"
          data-act="yut-use" data-i="${k}">${h(x.n)}<small>${x.v}칸</small></button>`).join('')}
      </div>
      <p class="note" style="margin:8px 4px 12px">
        ${use ? `<b>${h(use.n)}</b> 로 움직일 말을 판에서 고르세요` : ''}
        ${m.canThrow ? ' · 아직 더 던질 수 있어요' : ''}</p>`
    : `<div class="rollbig" style="background:rgba(0,0,0,.26);border-color:var(--line2)">
        <div class="v" style="font-size:26px;background:none;-webkit-text-fill-color:currentColor;color:var(--tx)">
          ${h(teamName(t))} 차례</div>
        <div class="s">${m.canThrow ? '그 팀 사람이 <b>자기 폰에서 윷을 던지세요</b>' : ''}</div>
      </div>`}

    ${board}

    ${(() => {
      if (!use) return '';
      const waiting = wait(t);
      // ⚠️ 집에 있는 말은 판에 칸이 없다 → 버튼이 없으면 말을 아예 못 낸다
      const outBtn = waiting
        ? `<button class="btn pri" data-act="yut-move" data-pos="-1" style="margin-bottom:10px">
             🏁 새 말 내보내기 (집에 ${waiting}개)</button>` : '';
      if (!hot.length && !waiting) return `<div class="balbox warn">
          <b>움직일 말이 없어요</b><span>턴을 넘겨주세요.</span></div>
        <button class="btn" data-act="yut-skip" style="margin-bottom:12px">턴 넘기기</button>`;
      return outBtn;
    })()}

    <div class="sec">기록</div>
    <div class="card"><div class="ylog">${(m.log || []).length
      ? m.log.map(x => `<div>${h(x)}</div>`).join('') : '<div>아직 던진 사람이 없어요</div>'}</div></div>
    <div style="height:12px"></div>
    <div class="stack">
      ${m.canThrow ? `<button class="btn gh sm" data-act="yut-throw-here" style="width:100%">🎲 여기서 대신 던지기</button>` : ''}
      ${!canMove ? `<button class="btn gh sm" data-act="yut-skip" style="width:100%">턴 넘기기</button>` : ''}
      <button class="btn gh sm" data-act="pl-quit" style="width:100%">나가기 (판 유지)</button>
    </div>`;
}

/* ── 🎲 각자 폰 화면 ── */
function vYutPhone(){
  const m = YT();
  if (!m) return `<div class="empty"><div class="empty-e">🎲</div>
      <div class="empty-t">아직 판이 안 깔렸어요</div>
      <div class="note">태블릿에서 「판 깔고 시작」을 누르면 여기에 윷이 나타납니다</div></div>`;

  const mt = myTeam();
  const mine = mt >= 0 && mt === m.turn;
  const ended = m.phase === 'ended';
  const canThrow = mine && m.canThrow && !m.halt && !m.pick && !ended;

  return `
    <div class="gh" style="${gcVars('#C89BFF')};padding:18px">
      <div class="gh-em">🎲</div>
      <div class="gh-n" style="font-size:19px;padding-right:0">훈민정음 윷놀이</div>
      <div class="gh-m">
        <span class="chip">${mt >= 0 ? h(teamName(mt)) : '팀 없음'}</span>
        <span class="chip ${mine && !ended ? 'amb' : ''}">${ended ? '끝' : mine ? '내 차례!' : h(teamName(m.turn)) + ' 차례'}</span>
      </div>
    </div>

    ${ended ? `<div class="pickres"><div class="pickres-l">결과</div>
        <div class="pickres-v">${h(teamName(m.winner))} 승리!</div></div>`
    : m.halt ? `<div class="haltbig"><div class="t">✋ 잠시!</div>
        <div class="s">지금 다 같이 판단 중이에요 — 태블릿을 보세요.</div></div>`
    : m.pick ? `<div class="haltbig"><div class="t">✋ ${h(teamName(m.pick.team))} 벌칙</div>
        <div class="s">${myTeam() === m.pick.team
          ? '<b>우리 팀이 되돌릴 말을 고를 차례예요</b> — 태블릿에서 고르세요.'
          : `${h(teamName(m.pick.team))}이 되돌릴 말을 고르는 중입니다.`}</div></div>`
    : `
      ${m.last ? `<div class="sticks">
          ${m.last.sticks.map(u => `<div class="stick ${u ? 'up' : ''}"></div>`).join('')}
          <div class="sname">${h(m.last.n)}</div>
        </div>` : ''}
      ${(m.pending || []).length ? `<p class="note" style="text-align:center;margin:0 0 12px">
          모아둔 결과 <b>${m.pending.map(x => h(x.n)).join(' · ')}</b> — 태블릿에서 말을 옮기세요</p>` : ''}

      <button class="bigthrow" data-act="yut-throw" ${canThrow ? '' : 'disabled'}>
        ${!mine ? `${h(teamName(m.turn))} 차례예요`
          : m.canThrow ? '🎲 윷 던지기' : '태블릿에서 말을 옮기세요'}
      </button>
      <p class="note" style="text-align:center;margin:10px 0 16px">
        ${mt < 0 ? '<b>대기실에서 팀에 들어가야</b> 던질 수 있어요'
                 : '윷·모가 나오면 <b>한 번 더</b> 던집니다'}</p>`}

    ${!ended && !m.halt && !m.pick ? `
      <div class="sec">영어를 썼나요?</div>
      <button class="haltbtn" data-act="yut-halt">✋ 잠시!</button>
      <p class="note" style="text-align:center;margin-top:9px">
        상대팀이 영어를 쓰면 누르세요 — 인정되면 <b>그 팀이 말 1개를 골라</b> 집으로 돌려보냅니다.<br>
        <span style="color:var(--dim2)">우리 팀은 지적할 수 없어요</span></p>` : ''}

    <div class="sec">기록</div>
    <div class="card"><div class="ylog">${(m.log || []).length
      ? m.log.slice(0, 5).map(x => `<div>${h(x)}</div>`).join('') : '<div>아직 기록이 없어요</div>'}</div></div>`;
}

/* ── 🎵 노래 맞히기 ── */
function vSong(){
  const p = S.play;
  const g = G(p.gameId);
  const usable = songPool(p.cats).length;

  /* 1) 설정 — 범위가 곧 난이도다 */
  if (p.phase === 'setup') return `
    <div class="gh" style="${gcVars(g.color)};padding:17px">
      <div class="gh-n" style="font-size:18px;padding-right:0">${g.emoji} ${h(g.name)}</div>
      <p class="note" style="margin-top:7px;position:relative">
        사회자 폰으로 유튜브 뮤직에서 틀어주세요 — 곡 정보는 사회자만 봅니다</p>
    </div>

    <div class="mcbox need">
      <span class="i">📵</span>
      <span><b>이 게임만은 태블릿을 가운데 두지 마세요</b>
        <span class="s">정답이 이 화면에 있습니다. 노래를 트는 사람은 답을 다 보게 되니
          <b>겨루지 않는 사회자</b>가 자기 폰으로 진행하세요.</span></span>
    </div>

    ${stockBox(p.gameId, usable, p.n, '곡')}

    <div class="sec">곡 수</div>
    <div class="seg">
      ${[5,10,15].map(n => `<button data-act="song-n" data-v="${n}" class="${p.n===n?'on':''}">${n}곡</button>`).join('')}
    </div>

    <div class="sec">범위 <span class="n">${usable}곡</span></div>
    <div class="catgrid">
      ${SONG_KEYS.map(k => `
        <button class="cat ${p.cats.includes(k)?'on':''}" data-act="song-cat" data-v="${k}">
          <span class="e">${SONG_DECKS[k].emoji}</span>
          <span>${h(SONG_DECKS[k].name)}</span>
          <span class="c">${SONG_DECKS[k].songs.length}</span>
        </button>`).join('')}
    </div>
    <p class="note" style="margin:9px 4px 0">
      <b>범위가 곧 난이도예요.</b> 세대가 섞였으면 여러 연도를 같이 켜세요 —
      한 연도만 켜면 그 시절을 모르는 사람은 한 곡도 못 맞힙니다.
      <b>만화·동요</b>는 누구나 아니까 몸풀기로 좋아요.</p>

    <div style="height:20px"></div>
    <div class="stack">
      <button class="btn pri" data-act="song-start" ${usable ? '' : 'disabled'}>
        ${usable ? `▶ 시작하기 — ${Math.min(p.n, usable)}곡` : '범위를 하나 이상 골라주세요'}</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  const sc = songScores();
  const board = playing().slice().sort((a,b) => sc[b[0]] - sc[a[0]]);

  /* 3) 종료 */
  if (p.phase === 'done'){
    const solved = p.log.filter(x => x.by != null).length;
    return `
      <div class="pickres">
        <div class="pickres-l">${p.log.length}곡 중</div>
        <div class="pickres-v">${solved}곡 맞힘</div>
      </div>
      <div class="sec">점수</div>
      ${board.map(([pid,pl],i) => `
        <div class="tscore" style="--tc:${avColor(pid)};margin-bottom:6px">
          <div class="n" style="display:flex;align-items:center;gap:9px">
            <span style="color:var(--dim2);font-weight:800;min-width:20px">${i+1}</span>
            ${av(pid, pl.name, 'sm')} ${h(pl.name)}</div>
          <div class="v">${sc[pid]}<small>곡</small></div>
        </div>`).join('')}
      ${(() => { const v = board.map(([pid]) => sc[pid]);
        return v.length !== new Set(v).size
          ? `<p class="note" style="margin:9px 4px 0">동점이 있어요 —
             다음 화면에서 <b>순서를 끌어 바꿀 수 있습니다.</b></p>` : ''; })()}
      <div class="sec">나온 곡</div>
      ${p.log.map(x => `<div class="sumrow ${x.by?'':'no'}">
          <span class="m">${x.by ? '✅' : '⛔'}</span>
          <span class="w">${h(x.w)} <span style="color:var(--dim2);font-weight:600">— ${h(x.a)}</span></span>
          <span style="margin-left:auto;font-size:12px;color:var(--dim2);font-weight:700">
            ${x.by ? h(pname(x.by)) : '아무도 못 맞힘'}</span>
        </div>`).join('')}
      <div style="height:18px"></div>
      <div class="stack">
        <button class="btn pri" data-act="song-save">🏆 순위 입력하기</button>
        <button class="btn gh" data-act="pl-quit">그만두기</button>
      </div>`;
  }

  const last = p.log[p.log.length - 1];
  const revealing = p.phase === 'reveal';

  /* 2) 진행 중 / 정답 공개 */
  return `
    <div class="turnhd">
      <span class="sw" style="--tc:${g.color}"></span>
      <span class="t">🎵 노래 맞히기</span>
      <span class="r">${p.log.length + 1} / ${p.n}</span>
    </div>
    ${last ? `<div class="lastq">
        <span>직전 <b>${h(last.w)}</b>${last.by ? ` — ${h(pname(last.by))}` : ' — 못 맞힘'}</span>
        <button class="u" data-act="song-undo">방금 취소</button>
      </div>` : ''}

    ${revealing
      ? `<div class="wcard">
           <div>
             <div class="wcat">정답</div>
             <div class="wtxt ${(p.cur?.w||'').length > 8 ? 'long' : ''}">${h(p.cur?.w || '')}</div>
             <div class="wans" style="margin-top:12px;padding-top:12px">
               <div class="wans-l">${h(SONG_DECKS[p.cur?.c]?.name || '')}</div>
               <div class="wans-v" style="font-size:22px">${h(p.cur?.a || '')}</div>
             </div>
           </div>
         </div>
         <div class="stack">
           <button class="btn pri" data-act="song-skip">다음 곡 →</button>
           <button class="btn gh sm" data-act="song-done" style="width:100%">지금 끝내기</button>
         </div>`
      : `<!-- ⚠️ .priv — 정답이라 진행자 한 사람만 본다. 큰 화면에서 커지면 안 된다. -->
         <div class="wcard priv">
           <div>
             <div class="wcat">🙈 사회자만 보세요 · ${h(SONG_DECKS[p.cur?.c]?.name || '')}</div>
             <div class="wtxt ${(p.cur?.w||'').length > 8 ? 'long' : ''}">${h(p.cur?.w || '')}</div>
             <div class="note priv" style="margin-top:8px">${h(p.cur?.a || '')}</div>
           </div>
         </div>
         <a class="btn pri ytbtn" href="${p.cur ? ytMusicUrl(p.cur.w, p.cur.a) : '#'}"
            target="_blank" rel="noopener">▶ 유튜브 뮤직에서 열기</a>
         <p class="note" style="text-align:center;margin:9px 0 14px">
           새 탭에서 열려요 · 재생하고 돌아오면 여기 그대로 있습니다</p>

         <div class="sec">누가 맞혔나요?</div>
         <div class="choq">
           ${playing().map(([pid,pl]) => `
             <button class="pick" data-act="song-hit" data-pid="${pid}">
               ${av(pid, pl.name, 'sm')}
               <div style="flex:1;font-weight:800;font-size:15px;min-width:0;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(pl.name)}</div>
               <span class="chip">${sc[pid]}</span>
             </button>`).join('')}
         </div>
         <div style="height:12px"></div>
         <div class="stack">
           <button class="btn" data-act="song-pass">🤷 아무도 못 맞힘 — 정답 공개</button>
           <button class="btn gh sm" data-act="song-done" style="width:100%">지금 끝내기</button>
         </div>`}`;
}

/* ── 🔠 초성 퀴즈 ── */
function vCho(){
  const p = S.play;
  const g = G(p.gameId);
  // ⚠️ 원래 개수(416)가 아니라 **초성 퀴즈로 낼 수 있는 개수**를 보여준다.
  //    걸러진 걸 모르면 "왜 이 단어는 안 나오지?" 가 된다.
  const usable = choWords(p.cats).length;

  /* 1) 설정 */
  if (p.phase === 'setup') return `
    <div class="gh" style="${gcVars(g.color)};padding:17px">
      <div class="gh-n" style="font-size:18px;padding-right:0">${g.emoji} ${h(g.name)}</div>
      <p class="note" style="margin-top:7px;position:relative">
        화면을 가운데 두고 다 같이 봅니다 — 정답은 맞히기 전까지 안 뜹니다</p>
    </div>

    ${stockBox(p.gameId, usable, p.n, '문제')}

    <div class="sec">문제 수</div>
    <div class="seg">
      ${[10,15,20].map(n => `<button data-act="cho-n" data-v="${n}" class="${p.n===n?'on':''}">${n}문제</button>`).join('')}
    </div>

    <div class="sec">출제 범위 <span class="n">${usable}문제</span></div>
    <div class="catgrid">
      ${deckKeys('cho').map(k => `
        <button class="cat ${p.cats.includes(k)?'on':''}" data-act="pl-cat" data-v="${k}">
          <span class="e">${WORD_DECKS[k].emoji}</span>
          <span>${h(WORD_DECKS[k].name)}</span>
          <span class="c">${choWords([k]).length}</span>
        </button>`).join('')}
    </div>
    <p class="note" style="margin:9px 4px 0">
      <b>답이 하나로 정해지는 것만</b> 냅니다 — 두 글자 단어(ㄱㄹ = 기린? 고래?)와
      초성이 겹치는 단어는 아예 빠집니다. 그래서 표시된 개수가 원래 덱보다 적어요.<br>
      범위를 넓게 켤수록 <b>판을 거듭해도 문제가 덜 겹칩니다.</b>
      <b>속담·사자성어</b>는 난이도가 확 올라가니 취향껏 켜세요.</p>

    <div style="height:20px"></div>
    <div class="stack">
      <button class="btn pri" data-act="cho-start" ${usable ? '' : 'disabled'}>
        ${usable ? `▶ 시작하기 — ${Math.min(p.n, usable)}문제` : '범위를 하나 이상 골라주세요'}</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  const sc = choScores();
  const board = playing().slice().sort((a,b) => sc[b[0]] - sc[a[0]]);

  /* 4) 종료 */
  if (p.phase === 'done'){
    const solved = p.log.filter(x => x.by != null).length;
    return `
      <div class="pickres">
        <div class="pickres-l">${p.log.length}문제 중</div>
        <div class="pickres-v">${solved}개 맞힘</div>
      </div>
      <div class="sec">점수</div>
      ${board.map(([pid,pl],i) => `
        <div class="tscore" style="--tc:${avColor(pid)};margin-bottom:6px">
          <div class="n" style="display:flex;align-items:center;gap:9px">
            <span style="color:var(--dim2);font-weight:800;min-width:20px">${i+1}</span>
            ${av(pid, pl.name, 'sm')} ${h(pl.name)}</div>
          <div class="v">${sc[pid]}<small>개</small></div>
        </div>`).join('')}
      ${(() => {
        const v = board.map(([pid]) => sc[pid]);
        return v.length !== new Set(v).size
          ? `<p class="note" style="margin:9px 4px 0">동점이 있어요 —
             다음 화면에서 <b>순서를 끌어 바꿀 수 있습니다.</b></p>` : '';
      })()}
      <div class="sec">나온 문제</div>
      ${p.log.map(x => `<div class="sumrow ${x.by?'':'no'}">
          <span class="m">${x.by ? '✅' : '⛔'}</span>
          <span class="w">${h(x.w)}</span>
          <span style="margin-left:auto;font-size:12px;color:var(--dim2);font-weight:700">
            ${x.by ? h(pname(x.by)) : '아무도 못 맞힘'}</span>
        </div>`).join('')}
      <div style="height:18px"></div>
      <div class="stack">
        <button class="btn pri" data-act="cho-save">🏆 순위 입력하기</button>
        <button class="btn gh" data-act="pl-quit">그만두기</button>
      </div>`;
  }

  /* 직전 문제 한 줄 — 정답 확인을 여기서 해서 진행 템포를 안 끊는다 */
  const last = p.log[p.log.length - 1];
  const lastHtml = last ? `
    <div class="lastq">
      <span>직전 <b>${h(last.w)}</b>${last.by ? ` — ${h(pname(last.by))}` : ' — 못 맞힘'}</span>
      <button class="u" data-act="cho-undo">방금 취소</button>
    </div>` : '';

  const wl = (p.cur?.w || '').length;
  const long = wl > 14 ? 'xlong' : wl > 8 ? 'long' : '';
  const revealing = p.phase === 'reveal';

  /* 2~3) 진행 중 / 정답 공개 — ⚠️ .priv 를 붙이지 않는다(전원이 봐야 하는 화면) */
  return `
    <div class="turnhd">
      <span class="sw" style="--tc:${g.color}"></span>
      <span class="t">🔠 초성 퀴즈</span>
      <span class="r">${p.log.length + 1} / ${p.n}</span>
    </div>
    ${lastHtml}

    <div class="wcard">
      <div>
        <div class="wcat">${h(WORD_DECKS[p.cur?.c]?.name || '')}</div>
        <div class="wtxt cho ${long}">${h(cho(p.cur?.w || ''))}</div>
        ${revealing ? `<div class="wans">
          <div class="wans-l">정답</div>
          <div class="wans-v">${h(p.cur?.w || '')}</div>
        </div>` : ''}
      </div>
    </div>

    ${revealing
      ? `<div class="stack">
           <button class="btn pri" data-act="cho-skip">다음 문제 →</button>
           <button class="btn gh sm" data-act="cho-done" style="width:100%">지금 끝내기</button>
         </div>`
      : `<div class="sec">누가 맞혔나요?</div>
         <div class="choq">
           ${playing().map(([pid,pl]) => `
             <button class="pick" data-act="cho-hit" data-pid="${pid}">
               ${av(pid, pl.name, 'sm')}
               <div style="flex:1;font-weight:800;font-size:15px;min-width:0;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h(pl.name)}</div>
               <span class="chip">${sc[pid]}</span>
             </button>`).join('')}
         </div>
         <div style="height:12px"></div>
         <div class="stack">
           <button class="btn" data-act="cho-pass">🤷 아무도 못 맞힘 — 정답 공개</button>
           <button class="btn gh sm" data-act="cho-done" style="width:100%">지금 끝내기</button>
         </div>`}`;
}

/* ── 제시어 덱 (몸으로/한글자로 말해요) ── */
function vDeck(){
  const p = S.play;
  const g = G(p.gameId);
  const teams = S.room.teams || {count:0,assign:{}};
  const tc = i => TEAM_COLORS[i % TEAM_COLORS.length];
  const members = i => Object.entries(teams.assign||{})
    .filter(([p,t])=>Number(t)===i && S.room.players[p] && !isSpec(S.room.players[p]))
    .map(([pid])=>pname(pid)).join(', ');
  const wordCount = p.cats.reduce((n,k) => n + (WORD_DECKS[k]?.words.length || 0), 0);

  /* 1) 설정 */
  if (p.phase === 'setup') return `
    <div class="gh" style="${gcVars(g.color)};padding:17px">
      <div class="gh-n" style="font-size:18px;padding-right:0">${g.emoji} ${h(g.name)}</div>
      <p class="note" style="margin-top:7px;position:relative">팀마다 한 번씩 돌아가며 진행합니다</p>
    </div>

    ${stockBox(p.gameId, wordCount, 30, '제시어')}

    <div class="sec">방식</div>
    <div class="seg">
      <button data-act="pl-mode" data-v="body" class="${p.mode==='body'?'on':''}">🕺 몸으로 말해요</button>
      <button data-act="pl-mode" data-v="oneword" class="${p.mode==='oneword'?'on':''}">🗣 한글자로 말해요</button>
    </div>
    <p class="note" style="margin:-2px 4px 0">${p.mode==='body'
      ? '말 없이 몸동작만으로 설명합니다.'
      : '팀이 정한 <b style="color:var(--elec)">한 글자</b>만 써서 설명합니다. 억양·연기는 자유.'}</p>

    <div class="sec">제한 시간</div>
    <div class="seg">
      ${[45,60,90].map(s => `<button data-act="pl-sec" data-v="${s}" class="${p.sec===s?'on':''}">${s}초</button>`).join('')}
    </div>

    <div class="sec">제시어 <span class="n">${wordCount}개</span></div>
    <div class="catgrid">
      ${deckKeys('body').map(k => `
        <button class="cat ${p.cats.includes(k)?'on':''}" data-act="pl-cat" data-v="${k}">
          <span class="e">${WORD_DECKS[k].emoji}</span>
          <span>${h(WORD_DECKS[k].name)}</span>
          <span class="c">${WORD_DECKS[k].words.length}</span>
        </button>`).join('')}
    </div>

    <div style="height:20px"></div>
    <div class="stack">
      <button class="btn pri" data-act="pl-start" ${!p.cats.length ? 'disabled' : ''}>
        ${p.cats.length ? '▶ 시작하기' : '카테고리를 하나 이상 골라주세요'}</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  /* 2) 턴 대기 */
  if (p.phase === 'ready'){
    const t = p.order[p.turn];
    return `
      <div class="turnhd">
        <span class="sw" style="--tc:${tc(t)}"></span>
        <span class="t">${t+1}팀 차례</span>
        <span class="r">${p.turn+1} / ${p.order.length}</span>
      </div>
      <div class="card">
        <p class="note" style="font-size:14px;color:var(--dim)">${h(members(t)) || '팀원 없음'}</p>
      </div>

      ${p.mode==='oneword' ? `
        <div class="sec">이 팀의 한 글자</div>
        <div class="card" style="text-align:center">
          <div style="font-size:64px;font-weight:900;letter-spacing:-.05em;line-height:1.1;
            background:var(--hero);-webkit-background-clip:text;background-clip:text;color:transparent">
            ${h(p.letters[t] || '?')}</div>
          <p class="note" style="margin:10px 0 12px">이 글자<b>만</b> 써서 설명해야 합니다 —
            억양·길이·표정은 자유예요</p>
          <button class="btn gh sm" data-act="pl-reletter" style="width:100%">🎲 다른 글자로 바꾸기</button>
        </div>` : ''}

      <div style="text-align:center;padding:26px 18px;border-radius:var(--r-l);
        background:linear-gradient(150deg,rgba(255,107,74,.14),rgba(255,184,77,.05));
        border:1px solid rgba(255,184,77,.3);margin-bottom:14px">
        <div style="font-size:34px;margin-bottom:10px">📱</div>
        <div style="font-weight:800;font-size:15px;line-height:1.6;word-break:keep-all">
          설명할 사람만 화면을 보세요<br>
          <span style="color:var(--dim);font-weight:600;font-size:13.5px">맞히는 팀은 보면 안 됩니다 — 화면을 돌려 잡으세요</span>
        </div>
      </div>

      <div class="stack">
        <button class="btn pri" data-act="pl-begin">${p.sec}초 시작</button>
        <button class="btn gh" data-act="pl-quit">그만두기</button>
      </div>`;
  }

  /* 3) 진행 중 */
  if (p.phase === 'run'){
    const t = p.order[p.turn];
    const hit = p.hits.filter(x => x.ok).length;
    const wl = (p.cur.w || '').length;
    const long = wl > 14 ? 'xlong' : wl > 8 ? 'long' : '';
    return `
      <div class="turnhd">
        <span class="sw" style="--tc:${tc(t)}"></span>
        <span class="t">${t+1}팀</span>
        <span class="r">${p.turn+1} / ${p.order.length}</span>
      </div>
      <div class="tbar"><i id="t-bar" style="width:100%"></i></div>
      <div class="trow">
        <div class="tsec" id="t-sec">${p.sec}초</div>
        <div class="thit">맞춘 개수 ${hit}</div>
      </div>

      <div class="wcard priv">
        <div>
          ${p.mode==='oneword' && p.letters[t]
            ? `<div class="wletter">🗣 우리 글자 「${h(p.letters[t])}」</div>`
            : `<div class="wcat">${h(WORD_DECKS[p.cur.c]?.name || '')}</div>`}
          <div class="wtxt ${long}">${h(p.cur.w)}</div>
        </div>
      </div>

      <div class="wbtns">
        <button class="bigbtn pass" data-act="pl-mark" data-v="0">패스</button>
        <button class="bigbtn ok" data-act="pl-mark" data-v="1">정답!</button>
      </div>
      <div style="height:10px"></div>
      <button class="btn gh sm" data-act="pl-stop" style="width:100%">시간 전에 끝내기</button>`;
  }

  /* 4) 턴 종료 */
  if (p.phase === 'turnEnd'){
    const t = p.order[p.turn];
    const list = p.results[t] || [];
    const hit = list.filter(x => x.ok).length;
    const isLast = p.turn >= p.order.length - 1;
    return `
      <div class="pickres">
        <div class="pickres-l">${t+1}팀 결과</div>
        <div class="pickres-v">${hit}개</div>
      </div>
      ${list.length ? `<div class="sec">제시어</div>
        ${list.map(x => `<div class="sumrow ${x.ok?'':'no'}">
            <span class="m">${x.ok?'✅':'⛔'}</span><span class="w">${h(x.w)}</span></div>`).join('')}`
        : '<div class="empty"><div class="empty-e">😶</div><div class="empty-t">한 개도 못 넘겼어요</div></div>'}
      <div style="height:18px"></div>
      <button class="btn pri" data-act="pl-next">
        ${isLast ? '🏁 전체 결과 보기' : `다음 — ${p.order[p.turn+1]+1}팀 차례`}</button>`;
  }

  /* 5) 전체 종료 */
  const cnt = t => (p.results[t] || []).filter(x => x.ok).length;
  const ranked = [...p.order].sort((a,b) => cnt(b) - cnt(a));
  return `
    <div class="sec">최종 결과</div>
    ${ranked.map((t,i) => `
      <div class="tscore" style="--tc:${tc(t)}">
        <div class="rno ${i<3?'m'+(i+1):''}">${i+1}</div>
        <div class="n">${t+1}팀 <span class="note" style="font-weight:600">${h(members(t))}</span></div>
        <div class="v">${cnt(t)}<small>개</small></div>
      </div>`).join('')}
    <div style="height:18px"></div>
    <div class="stack">
      <button class="btn pri" data-act="pl-save">이 순위로 반영하기</button>
      <button class="btn gh" data-act="pl-quit">점수 반영 없이 나가기</button>
    </div>
    <p class="note" style="text-align:center;margin-top:12px">
      동점이거나 순서를 바꾸고 싶으면 다음 화면에서 조정할 수 있어요</p>`;
}

/* ── 멕썸노이즈 ── */
function vNoise(){
  const p = S.play, g = G(p.gameId);
  const runner = p.order[p.turn], nm = pname(runner);
  const head = `<div class="turnhd"><span class="sw" style="--tc:${avColor(runner)}"></span>
      <span class="t">술래 — ${h(nm)}</span><span class="r">${p.turn+1} / ${p.order.length}</span></div>`;

  if (p.phase === 'ready') return `${head}
    <div style="text-align:center;padding:30px 18px;border-radius:var(--r-l);
      background:linear-gradient(150deg,rgba(255,107,74,.14),rgba(255,184,77,.05));
      border:1px solid rgba(255,184,77,.3);margin-bottom:14px">
      <div style="font-size:38px;margin-bottom:10px">🙈</div>
      <div style="font-weight:800;font-size:15.5px;line-height:1.6;word-break:keep-all">
        ${h(nm)}, 잠깐 뒤돌아서 눈 감고 귀 막기!<br>
        <span style="color:var(--dim);font-weight:600;font-size:13.5px">나머지가 미션 문장을 확인할 거예요</span>
      </div>
    </div>
    <div class="stack">
      <button class="btn pri" data-act="no-brief">📜 미션 문장 만들기</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  if (p.phase === 'brief') return `${head}
    <div class="wcard"><div>
      <div class="wcat">🤫 술래 몰래 확인!</div>
      <div class="wtxt ${p.sen.length>16?'xlong':p.sen.length>10?'long':''}">${h(p.sen)}</div>
    </div></div>
    <div class="warnbox"><span class="i">📢</span><span>다 확인했으면 술래를 부르세요. 술래가 정답에 <b>가까워지면 크게 소리</b>, 멀어지면 조용히!</span></div>
    <div class="stack">
      <button class="btn pri" data-act="race-run">🚦 술래 준비 완료 — 시작!</button>
      <button class="btn" data-act="no-reroll">🔄 다른 문장으로</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  if (p.phase === 'run') return `${head}
    <div class="wcard" style="min-height:150px;padding:28px 18px"><div>
      <div class="wcat">경과 시간</div>
      <div class="bignum" id="sw-sec">${fmtSw(p.elapsed||0)}</div>
    </div></div>
    <p class="note priv" style="text-align:center;margin:0 0 14px">미션 — ${h(p.sen)}<br>(술래에게 보여주지 마세요)</p>
    <div class="wbtns">
      <button class="bigbtn pass" data-act="race-end" data-v="0">🙅 포기</button>
      <button class="bigbtn ok" data-act="race-end" data-v="1">🎉 성공!</button>
    </div>`;

  if (p.phase === 'turnEnd'){
    const r = p.rec[runner];
    return `<div class="pickres">
        <div class="pickres-l">${h(nm)}의 기록</div>
        <div class="pickres-v">${r==null?'실패 😵':fmtSw(r)}</div>
      </div>
      <p class="note" style="text-align:center;margin-bottom:14px">미션 — ${h(p.sen)}</p>
      <button class="btn pri" data-act="race-next">${p.turn>=p.order.length-1?'🏁 전체 결과 보기':'다음 술래 →'}</button>`;
  }
  return vRaceDone(p, '성공까지 걸린 시간이 짧은 순 · 실패는 마지막');
}

/* ── 컵 레이스 ── */
function vCup(){
  const p = S.play;
  const cur = p.order[p.turn], nm = pname(cur);
  const head = `<div class="turnhd"><span class="sw" style="--tc:${avColor(cur)}"></span>
      <span class="t">${h(nm)} 차례</span><span class="r">${p.turn+1} / ${p.order.length}</span></div>`;

  if (p.phase === 'ready') return `${head}
    <div class="card"><p class="note" style="font-size:14px;color:var(--dim);line-height:1.7">
      물이 담긴 컵 아래 휴지를 깔고, 휴지만 당겨서 목표 지점까지!<br>
      물을 쏟거나 휴지가 찢어지면 실패예요.</p></div>
    <div class="stack">
      <button class="btn pri" data-act="race-run">🚦 출발!</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  if (p.phase === 'run') return `${head}
    <div class="wcard" style="min-height:170px;padding:30px 18px"><div>
      <div class="wcat">기록</div>
      <div class="bignum" id="sw-sec">${fmtSw(p.elapsed||0)}</div>
    </div></div>
    <div class="wbtns">
      <button class="bigbtn pass" data-act="race-end" data-v="0">💦 실패</button>
      <button class="bigbtn ok" data-act="race-end" data-v="1">🏁 도착!</button>
    </div>`;

  if (p.phase === 'turnEnd'){
    const r = p.rec[cur];
    return `<div class="pickres">
        <div class="pickres-l">${h(nm)}의 기록</div>
        <div class="pickres-v">${r==null?'실패 💦':fmtSw(r)}</div></div>
      <button class="btn pri" data-act="race-next">${p.turn>=p.order.length-1?'🏁 전체 결과 보기':'다음 사람 →'}</button>`;
  }
  return vRaceDone(p, '빠른 순 · 실패는 마지막');
}

function vScore(){
  const g = G(S.gameId); if (!g) return '';
  const d = S.draft;
  if (!d) return `<div class="empty"><div class="empty-e">🏁</div>
    <div class="empty-t">입력할 순위가 없어요</div>

    <button class="btn" data-act="go-board" style="margin-top:14px">🏆 종합 순위 보기</button>`;
  const isTeam = d.mode === 'team';
  const teams = S.room.teams || {count:0,assign:{}};

  const entries = isTeam
    ? Array.from({length:teams.count}, (_,i) => ({ id:i, label:`${i+1}팀`,
        sub:Object.entries(teams.assign||{})
          .filter(([p,t])=>Number(t)===i && S.room.players[p] && !isSpec(S.room.players[p]))
          .map(([p])=>pname(p)).join(', '),
        color:TEAM_COLORS[i] }))
    : playing().map(([pid,p]) => ({ id:pid, label:p.name, sub:'', color:avColor(pid) }));

  const remain = entries.filter(e => !d.order.some(o => String(o) === String(e.id)));

  const chosen = d.order.map((oid,i) => {
    const e = entries.find(x => String(x.id) === String(oid));
    return `<div class="rslot">
        <div class="rno ${i<3?'m'+(i+1):''}">${i+1}</div>

        </div>
        <div class="rpt">+${fmtPt(rankPt(i)*d.weight)}</div>
      </div>`;
  }).join('');

  return `
    ${offBanner()}
    <div class="gh" style="${gcVars(g.color)};padding:17px">
      <div class="gh-n" style="font-size:18px;padding-right:0">${g.emoji} ${h(g.name)}</div>

    </div>

    ${chosen ? `<div class="sec">순위</div>${chosen}
      <button class="btn gh sm" data-act="undo" style="width:100%;margin-top:3px">↩︎ 마지막 취소</button>` : ''}

    ${remain.length ? `
      <div class="sec">${d.order.length+1}등 고르기</div>
      ${remain.map(e => `
        <button class="pick" data-act="pickrank" data-id="${e.id}">
          <div class="av sm" style="background:${e.color}">${h(String(e.label)[0])}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800;font-size:15px">${h(e.label)}</div>
            ${e.sub ? `<div class="note" style="font-size:11.5px">${h(e.sub)}</div>` : ''}
          </div>
        </button>`).join('')}` : ''}

    <div style="height:18px"></div>
    <div class="stack">
      <button class="btn pri" data-act="score-save" ${d.order.length < 2 ? 'disabled' : ''}>
        ${d.order.length < 2 ? '최소 2명(팀)은 정해주세요' : '저장하고 순위 반영'}</button>

    </div>`;
}

function vBoard(){
  const pts = calcPoints();

    .sort((a,b) => b.pt - a.pt || a.name.localeCompare(b.name));
  const scores = Object.entries(S.room.scores || {}).sort((a,b) => (b[1].at||0) - (a[1].at||0));
  const hasScore = rows.some(r => r.pt > 0);

  let podium = '';
  if (hasScore && rows.length >= 3){
    const ord = [[rows[1],2],[rows[0],1],[rows[2],3]];
    podium = `<div class="podium">${ord.map(([r,rk],i) => `
      <div class="pod p${rk}" style="animation-delay:${i*90}ms">
        <div class="pod-m">${MEDAL[rk-1]}</div>
        <div class="pod-av">${av(r.pid, r.name, rk===1?'':'sm')}</div>

        <div class="pod-p">${fmtPt(r.pt)}<small>점</small></div>
      </div>`).join('')}</div>`;
  }
  const listFrom = podium ? 3 : 0;

  return `
    ${offBanner()}
    ${podium}
    ${rows.length ? `<div class="lb">${rows.slice(listFrom).map((r,i) => `
      <div class="lb-r ${r.pid===S.pid?'me':''}" style="animation-delay:${i*35}ms">
        <div class="lb-rk">${listFrom+i+1}</div>
        ${av(r.pid, r.name, 'sm')}
        <div class="lb-n">${h(r.name)}${r.pid===S.pid?'<span class="chip hot">나</span>':''}</div>
        <div class="lb-p">${fmtPt(r.pt)}<small>점</small></div>
      </div>`).join('')}</div>` : ''}

    <div class="sec">진행한 게임 <span class="n">${scores.length}</span></div>
    ${scores.length ? scores.map(([sid,sc]) => {
      const g = G(sc.gameId);

        `${MEDAL[i]} ${sc.mode==='team' ? `${Number(o)+1}팀` : h(pname(o))}`).join('  ');
      return `<div class="hist" style="${gcVars(g?.color)}">
        <div class="hist-ic">${g?.emoji||'🎲'}</div>
        <div class="hist-b">
          <div class="hist-n">${h(g?.name || sc.gameId)}</div>
          <div class="note" style="font-size:12px">${names}</div>
        </div>
        ${S.isHost ? `<button class="pl-x" data-act="del-score" data-sid="${sid}">✕</button>` : ''}
      </div>`;
    }).join('') : `<div class="empty">
        <div class="empty-e">🏁</div>
        <div class="empty-t">아직 기록이 없어요</div>
        <div class="note">게임을 하나 끝내고 순위를 입력해 보세요</div>
      </div>`}

    <div style="height:16px"></div>
    <div class="card">
      <div class="sec" style="margin:0 0 9px">점수 방식</div>
      <p class="note">1등 <b style="color:var(--amber)">10점</b> · 2등 7점 · 3등 5점 · 4등 3점 · 5등 2점 · 이하 1점<br>

/* ══════════════════════════════════════════════
   역할 뽑기 연출
══════════════════════════════════════════════ */
/* 윷을 던지는 연출. ⚠️ 결과 r 은 이미 정해져 있고, 이 함수는 보여주기만 한다.
   ⚠️ 재진입 금지 — 스냅샷이 연달아 오면 연출이 겹친다(_yutAnim 로 막는다). */
let _yutAnim = false;
async function yutThrowAnim(r, who){
  if (_yutAnim) return;
  _yutAnim = true;
  const ov = document.createElement('div');
  ov.className = 'throw-ov';
  ov.innerHTML = `<div class="throw-b">
      <div class="throw-l">${h(who || '')}</div>
      <div class="throw-sticks">${r.sticks.map(() =>
        `<div class="tstick fly"></div>`).join('')}</div>
      <div class="throw-r" id="thr-r">&nbsp;</div>
      <div class="throw-s" id="thr-s"></div>
    </div>`;
  document.body.appendChild(ov);
  const sticks = [...ov.querySelectorAll('.tstick')];

  SFX.go(); vib(12);
  await sleep(760);                                  // 구르는 시간

  // 하나씩 착지시킨다 — 마지막 짝에서 결과가 갈리는 맛
  for (let i = 0; i < sticks.length; i++){
    const el = sticks[i];
    el.classList.remove('fly'); el.classList.add('land');
    if (r.sticks[i]) el.classList.add('up');
    vib(8); SFX.tick?.();
    await sleep(150);
  }
  const rn = ov.querySelector('#thr-r');
  rn.textContent = r.n; rn.classList.add('on');
  ov.querySelector('#thr-s').textContent =
    `${r.v}칸${r.again ? ' · 한 번 더 던져요!' : ''}`;
  r.again ? SFX.ok() : SFX.pass();
  vib(r.again ? [30,60,30] : 22);
  if (r.again) confetti(45);

  await new Promise(res => {
    const close = () => { ov.remove(); _yutAnim = false; res(); };
    ov.onclick = close;
    setTimeout(() => { if (document.body.contains(ov)) close(); }, 1500);
  });
}

async function rollReveal(label, pool, finalPid){
  const ov = document.createElement('div');
  ov.className = 'roll-ov';
  ov.innerHTML = `<div class="roll-b">
      <div class="roll-l">${h(label)}</div>
      <div class="roll-n spin" id="roll-n">&nbsp;</div>
      <div class="roll-tap" id="roll-tap" style="visibility:hidden">화면을 탭하면 닫혀요</div>
    </div>`;
  document.body.appendChild(ov);
  const el = ov.querySelector('#roll-n');

  const names = pool.map(p => pname(p));
  let delay = 55, t = 0;
  while (t < 1500){
    el.textContent = names[(Math.random()*names.length)|0];
    vib(5);
    await sleep(delay);
    t += delay;
    delay = Math.min(240, delay * 1.13);
  }
  el.classList.remove('spin'); el.classList.add('land');
  el.textContent = pname(finalPid);
  vib([28,50,28]); confetti(70);
  ov.querySelector('#roll-tap').style.visibility = 'visible';

  await new Promise(res => {
    const close = () => { ov.remove(); res(); };
    ov.onclick = close;
    setTimeout(() => { if (document.body.contains(ov)) close(); }, 4200);
  });
}

function bind(root){
  // stopPropagation: 버튼 안에 또 다른 data-act(예: 설치 배너의 ✕)가 있을 때 둘 다 발동하는 것 방지
  root.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); act(el.dataset.act, el.dataset); };
  });

  const ci = root.querySelector('#in-code');
  if (ci){
    const paint = () => {
      const v = ci.value;
      root.querySelectorAll('.code-cell').forEach((c,i) => {
        c.classList.toggle('filled', !!v[i]);
        c.classList.toggle('on', i === v.length && document.activeElement === ci);
        c.innerHTML = v[i] ? h(v[i])
          : (i === v.length && document.activeElement === ci ? '<span class="cursor"></span>' : '<span class="ph"></span>');
      });
    };
    ci.oninput = () => {
      ci.value = ci.value.replace(/\D/g,'').slice(0,4);
      paint(); vib(6);
      if (ci.value.length === 4) act('join', {});
    };
    ci.onfocus = paint; ci.onblur = paint;
    root.querySelector('#code-boxes').onclick = () => ci.focus();
    paint();
  }

}

async function act(a, d){
  vib();
  switch(a){

  case 'create': {
    const name = ($('#in-name')?.value || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    await createRoom(name); break;
  }
  case 'join': {
    const name = ($('#in-name')?.value || '').trim();
    const code = ($('#in-code')?.value || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    if (code.length !== 4) return toast('4자리 방 코드를 입력해 주세요');
    await joinRoom(code, name); break;
  }
  case 'rejoin': {
    const sess = JSON.parse(localStorage.getItem(LS) || 'null'); if (!sess) return;
    if (!(await rejoin(sess))){ clearSession(); toast('예전 방을 찾을 수 없어요'); render(true); }
    break;
  }
  case 'share': shareRoom(); break;

  case 'bot-add': {
    if (!S.isHost) return;
    if (players().length + Number(d.n) > 12) return toast('참가자는 12명까지만요');
    addBots(Number(d.n)); confetti(30); render(true);
    toast(`테스트 참가자 ${d.n}명이 들어왔어요`);
    break;
  }
  case 'bot-clear': {
    if (!S.isHost) return;
    const n = clearBots(); render(true);
    toast(n ? `테스트 참가자 ${n}명을 내보냈어요` : '내보낼 봇이 없어요');
    break;
  }

  case 'install': {
    if (_installEvt){
      _installEvt.prompt();
      const r = await _installEvt.userChoice.catch(() => null);
      _installEvt = null;
      if (r?.outcome !== 'accepted') toast('나중에 크롬 메뉴에서도 설치할 수 있어요');
      render(true);
    }else{
      showIosInstall();
    }
    break;
  }
  case 'install-off': {
    try{ localStorage.setItem('pg_install_off','1'); }catch{}
    render(true); break;
  }

  case 'kick': {
    if (!S.isHost) return;
    delete S.room.players[d.pid];
    remove(ref(db, `${ROOT}/rooms/${S.code}/players/${d.pid}`)).catch(()=>{});
    render(); break;
  }
  case 'teams': {
    const n = Number(d.n);
    if (n < 2){ S.room.teams = {count:0,assign:{}}; pushHostState(); }
    else if (playing().length < n) return toast(`${n}팀을 나누려면 선수가 ${n}명 이상 필요해요`);
    else { makeTeams(n); confetti(45); }
    render(); break;
  }

  case 'go-games': go('games'); break;
  case 'go-board': go('board'); break;
  case 'go-settings': go('settings'); break;
  case 'game': S.gameId = d.id; go('game'); break;

  case 'pick': {
    if (!S.isHost) return toast('진행자만 뽑을 수 있어요');
    const g = G(S.gameId);
    const before = (S.room.rotation?.[g.id] || []).filter(p => S.room.players[p] && !isSpec(S.room.players[p]));
    const all = playing().map(([pid]) => pid);
    const pool = all.filter(p => !before.includes(p));
    const { pick, reset } = pickRole(S.gameId);
    S._lastPick[S.gameId] = pick;
    await rollReveal(g.role, (pool.length ? pool : all), pick);
    render();
    if (reset) toast('전원이 한 바퀴 돌아서 순번을 새로 시작해요');
    break;
  }
  case 'used-reset': {
    if (!S.isHost) return;
    const gid = S.play?.gameId || S.gameId;
    if (!usedWords(gid).size) return toast('아직 기록이 없어요');
    if (!confirm('지금까지 나온 제시어 기록을 지울까요?\n처음부터 다시 시작하는 셈이 됩니다.')) return;
    resetUsed(gid); render(true); toast('처음부터 다시 시작합니다'); break;
  }
  case 'rot-reset': {
    if (!S.isHost) return;
    if (S.room.rotation) delete S.room.rotation[S.gameId];
    delete S._lastPick[S.gameId];
    pushHostState(); render(); toast('순번을 초기화했어요'); break;
  }

  /* ── 진행 도구 ── */
  case 'tool-start': {
    if (!S.isHost) return toast('진행 도구는 진행자 기기에서 열어주세요');
    const g = G(S.gameId), n = playing().length;
    // ⚠️ 최소 인원은 GAMES[].minP 한 곳에서만 읽는다.
    //    예전엔 여기 2/3 이 하드코딩돼 있어서 상세 화면 표시와 따로 놀 수 있었다.
    if (g.minP && n < g.minP) return toast(`${g.minP}명 이상 필요해요 (지금 ${n}명)`);
    if (g.mode === 'team' && (S.room.teams?.count || 0) < 2)
      return toast('팀전이에요 — 대기실에서 팀을 먼저 나눠주세요');
    ({ deck:startDeckTool, noise:startNoiseTool, cup:startCupTool,
       act:startActTool, smile:startSmileTool, cho:startChoTool,
       song:startSongTool, yut:startYutTool })[g.tool]?.();
    break;
  }
  case 'pl-mode': S.play.mode = d.v; render(); break;
  case 'pl-sec':  S.play.sec = Number(d.v); render(); break;
  case 'pl-cat': {
    // ⚠️ 다른 게임 전용 카테고리가 섞여 들어오지 않게 막는다
    //    (몸으로 말해요에 사자성어가 들어가면 표현할 방법이 없다)
    {
      const tool = S.play?.kind === 'cho' ? 'cho' : 'body';
      if (!deckKeys(tool).includes(d.v)) return;
    }
    const c = S.play.cats;
    const i = c.indexOf(d.v);
    i < 0 ? c.push(d.v) : c.splice(i, 1);
    render(); break;
  }
  case 'pl-start': {
    if (!S.play.cats.length) return toast('카테고리를 하나 이상 골라주세요');
    Object.assign(S.play, { phase:'ready', turn:0, results:{}, letters:{} });
    ensureLetter();
    buildDeck();                       // 판 전체가 하나의 덱을 이어 쓴다(팀 간 중복 방지)
    if (!S.play.deck.length) return toast('낼 제시어가 없어요 — 카테고리를 더 골라주세요');
    nextWord();                        // 첫 장을 미리 뽑아둔다(턴 시작마다 뽑으면 한 장씩 샌다)
    if (S.play.wrapped) toast('제시어를 한 바퀴 다 썼어요 — 처음부터 다시 돕니다');
    render(); break;
  }
  case 'pl-begin': beginTurn(); break;
  case 'pl-reletter': {
    const p = S.play, t = p.order[p.turn];
    p.letters[t] = drawLetter();
    SFX.go(); vib(12); render(true); break;
  }
  /* 🎲 훈민정음 윷놀이 — 태블릿(호스트) */
  case 'yut-start': {
    if (!S.isHost) return toast('말판은 진행자 기기에서 열어주세요');
    if ((S.room.teams?.count || 0) < 2) return toast('대기실에서 팀을 먼저 나눠주세요');
    yutStart(); S.play.phase = 'play'; confetti(60); render(true); break;
  }
  case 'yut-use': S.play.useIdx = Number(d.i); render(true); break;
  case 'yut-move': {
    const idx = S.play.useIdx ?? 0;
    yutMoveFrom(Number(d.pos), idx);
    S.play.useIdx = 0;                 // 하나 쓰면 다시 첫 번째를 가리킨다
    break;
  }
  case 'yut-pickback': yutPickBack(Number(d.pos)); break;
  case 'yut-skip': yutSkip(); break;
  case 'yut-halt-ok': yutHaltResolve(true);  break;
  case 'yut-halt-no': yutHaltResolve(false); break;
  case 'yut-throw-here': {           // 폰이 안 되는 사람 대신 태블릿에서 던져준다
    const m = YT(); if (!m || m.phase !== 'play' || !m.canThrow) return;
    const r = throwYut();
    yutThrowAnim(r, `${h(teamName(m.turn))} 던지기`).then(() => yutApplyThrow(r, S.pid));
    break;
  }
  case 'yut-score': {
    const m = YT(); if (!m) return;
    // 완주한 말이 많은 팀 순
    const order = m.pieces.map((arr, ti) => ti)
      .sort((a, b) => m.pieces[b].filter(x => x === YUT_HOME).length
                    - m.pieces[a].filter(x => x === YUT_HOME).length);
    toScore(order, 'team'); break;
  }
  case 'yut-clear': {
    if (!confirm('판을 정리하고 끝낼까요?')) return;
    S.room.yut = null;
    remove(ref(db, `${ROOT}/rooms/${S.code}/yut`)).catch(()=>{});
    stopPlayTimer(); S.play = null; go('game'); break;
  }

  /* 🎲 각자 폰 */
  case 'go-yut': go('yut'); break;
  case 'yut-throw': {
    const m = YT();
    if (!m || m.phase !== 'play') return;
    if (myTeam() !== m.turn) return toast('우리 팀 차례가 아니에요');
    if (!m.canThrow) return toast('먼저 태블릿에서 말을 옮기세요');
    const r = throwYut();
    if (S.isHost){                                   // 태블릿을 직접 쥔 사람이 던진 경우
      yutThrowAnim(r, `${pname(S.pid)} 던지기`).then(() => yutApplyThrow(r, S.pid));
      break;
    }
    // ⚠️ 참가자는 yut/throw 에만 쓴다(호스트가 읽어서 반영). 다른 필드를 건드리면 판이 깨진다.
    //    연출은 내 폰에서 먼저 돌리고, 결과는 그대로 서버에 올린다(연출이 결과를 바꾸지 않는다).
    yutThrowAnim(r, '내 차례');
    set(ref(db, `${ROOT}/rooms/${S.code}/yut/throw`), { ...r, by:S.pid, at:now() }).catch(()=>{});
    break;
  }
  case 'yut-halt': {
    const m = YT();
    if (!m || m.phase !== 'play' || m.halt) return;
    if (myTeam() === m.turn) return toast('우리 팀은 지적할 수 없어요');
    const payload = { by:S.pid, team:m.turn, at:now() };
    if (S.isHost){ m.halt = payload; pushYut({ halt:payload }); }
    else set(ref(db, `${ROOT}/rooms/${S.code}/yut/halt`), payload).catch(()=>{});
    SFX.end(); vib([30,50,30]); toast('✋ 잠시! — 태블릿에서 판단합니다'); break;
  }

  /* 🎵 노래 맞히기 */
  case 'song-n': S.play.n = Number(d.v); render(); break;
  case 'song-cat': {
    const c = S.play.cats, i = c.indexOf(d.v);
    i < 0 ? c.push(d.v) : c.splice(i, 1);
    render(); break;
  }
  case 'song-start': {
    const p = S.play;
    if (!p.cats.length) return toast('범위를 하나 이상 골라주세요');
    p.log = []; songBuildDeck();
    if (!p.deck.length) return toast('그 범위에는 낼 곡이 없어요');
    if (p.wrapped) toast('곡을 한 바퀴 다 썼어요 — 처음부터 다시 돕니다');
    songNextCard(); p.phase = 'run';
    SFX.go(); vib(20); render(true); break;
  }
  case 'song-hit': {
    const p = S.play; if (p.phase !== 'run') return;
    p.log.push({ w:p.cur.w, a:p.cur.a, c:p.cur.c, by:d.pid });
    SFX.ok(); vib(16); songNext(); break;
  }
  case 'song-pass': {
    const p = S.play; if (p.phase !== 'run') return;
    p.phase = 'reveal'; SFX.pass(); vib(8); render(true); break;
  }
  case 'song-skip': {
    const p = S.play;
    p.log.push({ w:p.cur.w, a:p.cur.a, c:p.cur.c, by:null });
    songNext(); break;
  }
  case 'song-undo': {
    const p = S.play;
    const x = p.log.pop(); if (!x) return;
    p.cur = { w:x.w, a:x.a, c:x.c }; p.phase = 'run';
    SFX.pass(); vib(8); render(true); break;
  }
  case 'song-done': {
    if (!S.play.log.length) return toast('아직 들은 곡이 없어요');
    songFinish(); break;
  }
  case 'song-save': {
    const sc = songScores();
    toScore(playing().map(([pid]) => pid).sort((a,b) => sc[b] - sc[a]), 'solo');
    break;
  }

  /* 🔠 초성 퀴즈 */
  case 'cho-n': S.play.n = Number(d.v); render(); break;
  case 'cho-start': {
    const p = S.play;
    if (!p.cats.length) return toast('범위를 하나 이상 골라주세요');
    p.log = []; choBuildDeck();
    if (!p.deck.length) return toast('그 범위에는 낼 문제가 없어요 — 범위를 더 골라주세요');
    if (p.wrapped) toast('문제를 한 바퀴 다 썼어요 — 처음부터 다시 돕니다');
    nextWord(); p.phase = 'run';
    SFX.go(); vib(20); render(true); break;
  }
  case 'cho-hit': {
    const p = S.play; if (p.phase !== 'run') return;
    p.log.push({ w:p.cur.w, c:p.cur.c, by:d.pid });
    SFX.ok(); vib(16); choNext(); break;
  }
  case 'cho-pass': {
    const p = S.play; if (p.phase !== 'run') return;
    p.phase = 'reveal'; SFX.pass(); vib(8); render(true); break;
  }
  case 'cho-skip': {
    const p = S.play;
    p.log.push({ w:p.cur.w, c:p.cur.c, by:null });
    choNext(); break;
  }
  case 'cho-undo': {
    // 잘못 탭한 경우 — 그 문제를 되돌려 다시 출제한다(덱 인덱스는 그대로 두면 된다)
    const p = S.play;
    const x = p.log.pop(); if (!x) return;
    p.cur = { w:x.w, c:x.c }; p.phase = 'run';
    SFX.pass(); vib(8); render(true); break;
  }
  case 'cho-done': {
    if (!S.play.log.length) return toast('아직 푼 문제가 없어요');
    choFinish(); break;
  }
  case 'cho-save': {
    const sc = choScores();
    toScore(playing().map(([pid]) => pid).sort((a,b) => sc[b] - sc[a]), 'solo');
    break;
  }

  case 'pl-mark': markWord(d.v === '1'); break;
  case 'pl-stop': endTurn(); break;
  case 'pl-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1){
      p.phase = 'done'; confetti(70);
      // 이 판에 실제로 화면에 뜬 제시어만 기록한다(안 넘긴 카드는 아직 안 쓴 것)
      markUsed(p.gameId, Object.values(p.results).flat().map(x => x.w));
    }
    else { p.turn++; p.phase = 'ready'; ensureLetter(); }
    render(); break;
  }
  case 'pl-save': deckToScore(); break;

  /* ── 멕썸노이즈 · 컵 레이스 (race-* 공유) ── */
  case 'no-brief': case 'no-reroll': {
    const p = S.play;
    p.sen = jo(pname(p.order[p.turn]), '이', '가') + ' ' + noiseSentence();
    p.phase = 'brief'; vib(8); render(true); break;
  }
  case 'race-run': {
    S.play.phase = 'run'; SFX.go(); vib(20);
    render(true); swBegin(); break;
  }
  case 'race-end': {
    const p = S.play; stopPlayTimer();
    const ok = d.v === '1';
    p.rec[p.order[p.turn]] = ok ? Math.round((p.elapsed || 0) * 10) / 10 : null;
    p.phase = 'turnEnd';
    ok ? SFX.ok() : SFX.end(); vib(ok ? [20,40,20] : 30);
    render(true); break;
  }
  case 'race-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1){ p.phase = 'done'; confetti(70); }
    else { p.turn++; p.phase = 'ready'; }
    render(true); break;
  }
  case 'race-save': {
    const p = S.play;
    toScore([...p.order].sort((a,b) => (p.rec[a] ?? 1e9) - (p.rec[b] ?? 1e9)), 'solo');
    break;
  }

  /* ── 연기 대결 ── */
  case 'ac-reroll': actDraw(); vib(8); render(true); break;
  case 'ac-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1) p.phase = 'done';
    else { p.turn++; actDraw(); }
    render(true); break;
  }
  case 'ac-score': { stopPlayTimer(); S.play = null; act('score-start', {}); break; }

  /* ── 스마일~! ── */
  case 'sm-sul': {
    const p = S.play;
    p.sul = d.pid;
    p.pool = playing().map(([pid]) => pid).filter(x => x !== d.pid);
    p.shots = 10; p.sel = []; p.phase = 'run';
    SFX.go(); render(true); break;
  }
  case 'sm-shot': {
    const p = S.play;
    if (p.shots > 0){ p.shots--; SFX.tick(); vib(10); }
    if (p.shots <= 0){ p.phase = 'judge'; p.sel = []; SFX.end(); }
    render(true); break;
  }
  case 'sm-judge': S.play.phase = 'judge'; S.play.sel = []; render(true); break;
  case 'sm-back':  S.play.phase = 'run'; render(true); break;
  case 'sm-sel': {
    const p = S.play, i = p.sel.indexOf(d.pid);
    i < 0 ? p.sel.push(d.pid) : p.sel.splice(i, 1);
    render(true); break;
  }
  case 'sm-apply': {
    const p = S.play;
    p.log.push({ r:p.log.length + 1, sul:p.sul, caught:[...p.sel] });
    if (p.sel.length === 1){
      const nx = p.sel[0];
      p.sul = nx;
      p.pool = playing().map(([pid]) => pid).filter(x => x !== nx);
    }else if (p.sel.length > 1){
      p.pool = [...p.sel];      // 걸린 사람들끼리 재진행 (술래 유지)
    }                            // 0명 → 같은 술래·같은 대상 다시
    p.shots = 10; p.sel = []; p.round++; p.phase = 'run';
    render(true); break;
  }
  case 'sm-done': S.play.phase = 'done'; render(true); break;
  case 'sm-score': { stopPlayTimer(); S.play = null; act('score-start', {}); break; }

  case 'pl-quit': {
    const p = S.play;
    const prog = p && (p.phase === 'run' || (p.turn || 0) > 0
      || Object.keys(p.results || {}).length > 0 || Object.keys(p.rec || {}).length > 0
      || (p.log || []).length > 0);
    if (prog && !confirm('진행 중인 게임을 그만둘까요? 지금까지 결과는 사라져요.')) return;
    stopPlayTimer(); S.play = null; go('game'); break;
  }

  case 'score-start': {
    if (!S.isHost) return toast('순위 입력은 진행자 기기에서 해주세요');
    const g = G(S.gameId);
    const teams = S.room.teams || {count:0};
    if (g.mode === 'team' && teams.count < 2) return toast('팀전이에요 — 대기실에서 팀을 먼저 나눠주세요');
    S.draft = { gameId:g.id, mode:(g.mode==='team' && teams.count>1) ? 'team' : 'solo',
      order:[], weight:g.weight, assign:JSON.parse(JSON.stringify(teams.assign || {})) };
    go('score'); break;
  }
  case 'pickrank': {
    S.draft.order.push(S.draft.mode === 'team' ? Number(d.id) : d.id);
    render(); break;
  }
  case 'undo': S.draft.order.pop(); render(); break;
  case 'score-cancel': S.draft = null; go('game'); break;
  case 'score-save': {
    const dr = S.draft;
    const sid = 's' + now().toString(36) + Math.random().toString(36).slice(2,6);
    if (!S.room.scores) S.room.scores = {};
    S.room.scores[sid] = { gameId:dr.gameId, mode:dr.mode, order:dr.order,
      weight:dr.weight, assign:dr.assign, at:now() };
    pushHostState(); S.draft = null;
    go('board'); confetti(110); vib([20,40,20]);
    toast('순위가 반영됐어요');
    break;
  }
  case 'del-score': {
    if (!S.isHost) return;
    delete S.room.scores[d.sid];
    set(ref(db, `${ROOT}/rooms/${S.code}/scores`), S.room.scores).catch(()=>{});
    render(); break;
  }

  /* 이 기기를 「사회자(화면)」로 — 겨루지 않는다.
     ⚠️ 자기 players/{pid} 노드만 쓴다(참가자도 쓸 수 있는 경로). 권위 필드는 안 건드린다.
     ⚠️ 팀 배정이 남아 있으면 유령 팀원이 되므로 같이 지운다.
        점수 기록(scores)은 지우지 않는다 — 해제하면 그대로 되살아난다. */
  case 'spec-toggle': {
    const me = S.room.players?.[S.pid]; if (!me) break;
    const on = !isSpec(me);
    if (on && playing().length <= 1) return toast('선수가 아무도 안 남아요');
    me.spec = on;
    update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { spec:on }).catch(()=>{});
    if (on && S.room.teams?.assign?.[S.pid] != null){
      delete S.room.teams.assign[S.pid];
      if (S.isHost) pushHostState();
    }
    vib(12); render(true);
    toast(on ? '📺 이 기기는 사회자(화면)입니다 — 겨루지 않아요' : '다시 선수로 참가합니다');
    break;
  }

  case 'rename': {
    const n = ($('#in-rename')?.value || '').trim();
    if (!n) return toast('이름을 입력해 주세요');
    S.room.players[S.pid].name = n;
    update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { name:n }).catch(()=>{});
    saveSession(); render(); toast('이름을 바꿨어요'); break;
  }
  case 'reset-scores': {
    if (!confirm('점수를 전부 지울까요? 되돌릴 수 없어요.')) return;
    S.room.scores = {};
    set(ref(db, `${ROOT}/rooms/${S.code}/scores`), {}).catch(()=>{});
    render(); toast('점수를 초기화했어요'); break;
  }
  case 'reset-rot': {
    S.room.rotation = {}; S._lastPick = {};
    pushHostState(); render(); toast('순번을 초기화했어요'); break;
  }
  case 'leave': {
    if (S.isHost && !confirm('진행자가 나가면 점수 기준 기기가 사라져요. 나갈까요?')) return;
    leaveRoom(); break;
  }
  }
}

/* ══════════════════════════════════════════════
   부팅
══════════════════════════════════════════════ */
watchConnection();
render();

(async () => {
  const q = new URLSearchParams(location.search).get('r');
  const sess = (() => { try{ return JSON.parse(localStorage.getItem(LS) || 'null'); }catch{ return null; } })();
  if (sess && (!q || q === sess.code)){
    if (await rejoin(sess)) return;
    clearSession();
  }
  if (q && /^\d{4}$/.test(q)){
    const el = $('#in-code');
    if (el){ el.value = q; el.dispatchEvent(new Event('input')); }
  }
})();

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
