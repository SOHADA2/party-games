    </div></div>
    <div class="stack">
      <button class="bigbtn ok" data-act="sm-shot" style="width:100%">📸 찍었다!</button>
      <button class="btn" data-act="sm-judge">🧐 판정하기 — 사진 확인</button>
      <button class="btn gh sm" data-act="sm-done" style="width:100%">게임 종료</button>
    </div>`;

  if (p.phase === 'judge'){
    const n = p.sel.length;
    const label = n === 0 ? '아무도 안 걸림 — 같은 술래 다시'
      : n === 1 ? `${jo(pname(p.sel[0]),'이','가')} 다음 술래!`
      : `걸린 ${n}명끼리 재진행`;
    return `
      <div class="sec">사진에 걸린 사람은?</div>
      ${p.pool.map(pid => `
        <button class="pick" data-act="sm-sel" data-pid="${pid}"
          style="${p.sel.includes(pid)?'border-color:var(--rose);background:rgba(255,92,124,.1)':''}">
          ${av(pid, pname(pid), 'sm')}
          <div style="flex:1;font-weight:800;font-size:15px">${h(pname(pid))}</div>
          ${p.sel.includes(pid)?'<span class="chip rose">📸 걸림</span>':''}
        </button>`).join('')}
      <div style="height:12px"></div>
      <div class="stack">
        <button class="btn pri" data-act="sm-apply">${label}</button>
        <button class="btn gh" data-act="sm-back">← 계속 찍기</button>
      </div>`;
  }

  /* done */
  return `
    <div class="sec">라운드 기록</div>
    ${p.log.length ? p.log.map(L => `
      <div class="sumrow"><span class="m">📸</span>
        <span>R${L.r} · 술래 ${h(pname(L.sul))} → ${L.caught.length ? L.caught.map(x=>h(pname(x))).join(', ') : '아무도 안 걸림'}</span>
      </div>`).join('') : '<p class="note" style="margin:0 4px 10px">기록 없음</p>'}
    <div class="card" style="margin-top:12px"><p class="note" style="font-size:13.5px;line-height:1.7">
      순위 기준 — <b style="color:var(--amber)">끝까지 안 걸린 사람이 1등</b>, 술래가 된 순서의 역순.
      다음 화면에서 순서대로 탭해 주세요.</p></div>
    <div class="stack">
      <button class="btn pri" data-act="sm-score">🏆 순위 입력하기</button>
      <button class="btn gh" data-act="pl-quit">나가기</button>
    </div>`;
}

/* ── 순위 입력 ── */
function vScore(){
  const g = G(S.gameId); if (!g) return '';
  const d = S.draft;
  if (!d) return `<div class="empty"><div class="empty-e">🏁</div>
    <div class="empty-t">입력할 순위가 없어요</div>
    <div class="note">게임을 마치고 다시 시도해 주세요</div></div>
    <button class="btn" data-act="go-board" style="margin-top:14px">🏆 종합 순위 보기</button>`;
  const isTeam = d.mode === 'team';
  const teams = S.room.teams || {count:0,assign:{}};

  const entries = isTeam
    ? Array.from({length:teams.count}, (_,i) => ({ id:i, label:`${i+1}팀`,
        sub:Object.entries(teams.assign||{})
          .filter(([p,t])=>Number(t)===i && S.room.players[p] && !isSpec(S.room.players[p]))
          .map(([p])=>pname(p)).join(', '),
        color:TEAM_COLORS[i] }))
    : playing().map(([pid,p]) => ({ id:pid, label:p.name, sub:'', color:avColor(pid) }));

  const remain = entries.filter(e => !d.order.some(o => String(o) === String(e.id)));

  const chosen = d.order.map((oid,i) => {
    const e = entries.find(x => String(x.id) === String(oid));
    return `<div class="rslot">
        <div class="rno ${i<3?'m'+(i+1):''}">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:15px">${h(e?.label || '?')}</div>
          ${e?.sub ? `<div class="note" style="font-size:11.5px">${h(e.sub)}</div>` : ''}
        </div>
        <div class="rpt">+${fmtPt(rankPt(i)*d.weight)}</div>
      </div>`;
  }).join('');

  return `
    ${offBanner()}
    <div class="gh" style="${gcVars(g.color)};padding:17px">
      <div class="gh-n" style="font-size:18px;padding-right:0">${g.emoji} ${h(g.name)}</div>
      <p class="note" style="margin-top:7px;position:relative">${isTeam?'잘한 팀':'잘한 사람'} 순서대로 탭하세요 · 배점 ×${d.weight}</p>
    </div>

    ${chosen ? `<div class="sec">순위</div>${chosen}
      <button class="btn gh sm" data-act="undo" style="width:100%;margin-top:3px">↩︎ 마지막 취소</button>` : ''}

    ${remain.length ? `
      <div class="sec">${d.order.length+1}등 고르기</div>
      ${remain.map(e => `
        <button class="pick" data-act="pickrank" data-id="${e.id}">
          <div class="av sm" style="background:${e.color}">${h(String(e.label)[0])}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:800;font-size:15px">${h(e.label)}</div>
            ${e.sub ? `<div class="note" style="font-size:11.5px">${h(e.sub)}</div>` : ''}
          </div>
        </button>`).join('')}` : ''}

    <div style="height:18px"></div>
    <div class="stack">
      <button class="btn pri" data-act="score-save" ${d.order.length < 2 ? 'disabled' : ''}>
        ${d.order.length < 2 ? '최소 2명(팀)은 정해주세요' : '저장하고 순위 반영'}</button>
      <button class="btn gh" data-act="score-cancel">취소</button>
    </div>`;
}

/* ── 종합 순위 ── */
function vBoard(){
  const pts = calcPoints();
  const rows = playing().map(([pid,p]) => ({ pid, name:p.name, pt:pts[pid]||0 }))
    .sort((a,b) => b.pt - a.pt || a.name.localeCompare(b.name));
  const scores = Object.entries(S.room.scores || {}).sort((a,b) => (b[1].at||0) - (a[1].at||0));
  const hasScore = rows.some(r => r.pt > 0);

  let podium = '';
  if (hasScore && rows.length >= 3){
    const ord = [[rows[1],2],[rows[0],1],[rows[2],3]];
    podium = `<div class="podium">${ord.map(([r,rk],i) => `
      <div class="pod p${rk}" style="animation-delay:${i*90}ms">
        <div class="pod-m">${MEDAL[rk-1]}</div>
        <div class="pod-av">${av(r.pid, r.name, rk===1?'':'sm')}</div>
        <div class="pod-n">${h(r.name)}</div>
        <div class="pod-p">${fmtPt(r.pt)}<small>점</small></div>
      </div>`).join('')}</div>`;
  }
  const listFrom = podium ? 3 : 0;

  return `
    ${offBanner()}
    ${podium}
    ${rows.length ? `<div class="lb">${rows.slice(listFrom).map((r,i) => `
      <div class="lb-r ${r.pid===S.pid?'me':''}" style="animation-delay:${i*35}ms">
        <div class="lb-rk">${listFrom+i+1}</div>
        ${av(r.pid, r.name, 'sm')}
        <div class="lb-n">${h(r.name)}${r.pid===S.pid?'<span class="chip hot">나</span>':''}</div>
        <div class="lb-p">${fmtPt(r.pt)}<small>점</small></div>
      </div>`).join('')}</div>` : ''}

    <div class="sec">진행한 게임 <span class="n">${scores.length}</span></div>
    ${scores.length ? scores.map(([sid,sc]) => {
      const g = G(sc.gameId);
      const names = (sc.order||[]).slice(0,3).map((o,i) =>
        `${MEDAL[i]} ${sc.mode==='team' ? `${Number(o)+1}팀` : h(pname(o))}`).join('  ');
      return `<div class="hist" style="${gcVars(g?.color)}">
        <div class="hist-ic">${g?.emoji||'🎲'}</div>
        <div class="hist-b">
          <div class="hist-n">${h(g?.name || sc.gameId)}</div>
          <div class="note" style="font-size:12px">${names}</div>
        </div>
        ${S.isHost ? `<button class="pl-x" data-act="del-score" data-sid="${sid}">✕</button>` : ''}
      </div>`;
    }).join('') : `<div class="empty">
        <div class="empty-e">🏁</div>
        <div class="empty-t">아직 기록이 없어요</div>
        <div class="note">게임을 하나 끝내고 순위를 입력해 보세요</div>
      </div>`}

    <div style="height:16px"></div>
    <div class="card">
      <div class="sec" style="margin:0 0 9px">점수 방식</div>
      <p class="note">1등 <b style="color:var(--amber)">10점</b> · 2등 7점 · 3등 5점 · 4등 3점 · 5등 2점 · 이하 1점<br>
      여기에 게임별 배점(×0.5 ~ ×1.5)을 곱합니다. 팀전은 팀 순위 점수를 팀원 전원에게 똑같이 줍니다.</p>
    </div>`;
}

      <button class="btn dan sm" data-act="leave" style="width:100%">방 나가기</button>
    </div>
    <p class="note" style="text-align:center;margin-top:20px">${APP_VERSION}</p>`;
}

/* ══════════════════════════════════════════════
   역할 뽑기 연출
══════════════════════════════════════════════ */
async function rollReveal(label, pool, finalPid){
  const ov = document.createElement('div');
  ov.className = 'roll-ov';
  ov.innerHTML = `<div class="roll-b">
      <div class="roll-l">${h(label)}</div>
      <div class="roll-n spin" id="roll-n">&nbsp;</div>
      <div class="roll-tap" id="roll-tap" style="visibility:hidden">화면을 탭하면 닫혀요</div>
    </div>`;
  document.body.appendChild(ov);
  const el = ov.querySelector('#roll-n');

  const names = pool.map(p => pname(p));
  let delay = 55, t = 0;
  while (t < 1500){
    el.textContent = names[(Math.random()*names.length)|0];
    vib(5);
    await sleep(delay);
    t += delay;
    delay = Math.min(240, delay * 1.13);
  }
  el.classList.remove('spin'); el.classList.add('land');
  el.textContent = pname(finalPid);
  vib([28,50,28]); confetti(70);
  ov.querySelector('#roll-tap').style.visibility = 'visible';

  await new Promise(res => {
    const close = () => { ov.remove(); res(); };
    ov.onclick = close;
    setTimeout(() => { if (document.body.contains(ov)) close(); }, 4200);
  });
}

/* ══════════════════════════════════════════════
   이벤트
══════════════════════════════════════════════ */
function bind(root){
  // stopPropagation: 버튼 안에 또 다른 data-act(예: 설치 배너의 ✕)가 있을 때 둘 다 발동하는 것 방지
  root.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); act(el.dataset.act, el.dataset); };
  });

  const ci = root.querySelector('#in-code');
  if (ci){
    const paint = () => {
      const v = ci.value;
      root.querySelectorAll('.code-cell').forEach((c,i) => {
        c.classList.toggle('filled', !!v[i]);
        c.classList.toggle('on', i === v.length && document.activeElement === ci);
        c.innerHTML = v[i] ? h(v[i])
          : (i === v.length && document.activeElement === ci ? '<span class="cursor"></span>' : '<span class="ph"></span>');
      });
    };
    ci.oninput = () => {
      ci.value = ci.value.replace(/\D/g,'').slice(0,4);
      paint(); vib(6);
      if (ci.value.length === 4) act('join', {});
    };
    ci.onfocus = paint; ci.onblur = paint;
    root.querySelector('#code-boxes').onclick = () => ci.focus();
    paint();
  }

}

async function act(a, d){
  vib();
  switch(a){

  case 'create': {
    const name = ($('#in-name')?.value || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    await createRoom(name); break;
  }
  case 'join': {
    const name = ($('#in-name')?.value || '').trim();
    const code = ($('#in-code')?.value || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    if (code.length !== 4) return toast('4자리 방 코드를 입력해 주세요');
    await joinRoom(code, name); break;
  }
  case 'rejoin': {
    const sess = JSON.parse(localStorage.getItem(LS) || 'null'); if (!sess) return;
    if (!(await rejoin(sess))){ clearSession(); toast('예전 방을 찾을 수 없어요'); render(true); }
    break;
  }
  case 'share': shareRoom(); break;

  case 'bot-add': {
    if (!S.isHost) return;
    if (players().length + Number(d.n) > 12) return toast('참가자는 12명까지만요');
    addBots(Number(d.n)); confetti(30); render(true);
    toast(`테스트 참가자 ${d.n}명이 들어왔어요`);
    break;
  }
  case 'bot-clear': {
    if (!S.isHost) return;
    const n = clearBots(); render(true);
    toast(n ? `테스트 참가자 ${n}명을 내보냈어요` : '내보낼 봇이 없어요');
    break;
  }

  case 'install': {
    if (_installEvt){
      _installEvt.prompt();
      const r = await _installEvt.userChoice.catch(() => null);
      _installEvt = null;
      if (r?.outcome !== 'accepted') toast('나중에 크롬 메뉴에서도 설치할 수 있어요');
      render(true);
    }else{
      showIosInstall();
    }
    break;
  }
  case 'install-off': {
    try{ localStorage.setItem('pg_install_off','1'); }catch{}
    render(true); break;
  }

  case 'kick': {
    if (!S.isHost) return;
    delete S.room.players[d.pid];
    remove(ref(db, `${ROOT}/rooms/${S.code}/players/${d.pid}`)).catch(()=>{});
    render(); break;
  }
  case 'teams': {
    const n = Number(d.n);
    if (n < 2){ S.room.teams = {count:0,assign:{}}; pushHostState(); }
    else if (playing().length < n) return toast(`${n}팀을 나누려면 선수가 ${n}명 이상 필요해요`);
    else { makeTeams(n); confetti(45); }
    render(); break;
  }

  case 'go-games': go('games'); break;
  case 'go-board': go('board'); break;
  case 'go-settings': go('settings'); break;
  case 'game': S.gameId = d.id; go('game'); break;

  case 'pick': {
    if (!S.isHost) return toast('진행자만 뽑을 수 있어요');
    const g = G(S.gameId);
    const before = (S.room.rotation?.[g.id] || []).filter(p => S.room.players[p] && !isSpec(S.room.players[p]));
    const all = playing().map(([pid]) => pid);
    const pool = all.filter(p => !before.includes(p));
    const { pick, reset } = pickRole(S.gameId);
    S._lastPick[S.gameId] = pick;
    await rollReveal(g.role, (pool.length ? pool : all), pick);
    render();
    if (reset) toast('전원이 한 바퀴 돌아서 순번을 새로 시작해요');
    break;
  }
  case 'rot-reset': {
    if (!S.isHost) return;
    if (S.room.rotation) delete S.room.rotation[S.gameId];
    delete S._lastPick[S.gameId];
    pushHostState(); render(); toast('순번을 초기화했어요'); break;
  }

  /* ── 진행 도구 ── */
  case 'tool-start': {
    if (!S.isHost) return toast('진행 도구는 진행자 기기에서 열어주세요');
    const g = G(S.gameId), n = playing().length;
    if (g.tool === 'deck'){
      if (g.mode === 'team' && (S.room.teams?.count || 0) < 2)
        return toast('팀전이에요 — 대기실에서 팀을 먼저 나눠주세요');
      startDeckTool();
    }
    else if (g.tool === 'noise'){ if (n < 2) return toast('2명 이상 필요해요'); startNoiseTool(); }
    else if (g.tool === 'cup'){   if (n < 2) return toast('2명 이상 필요해요'); startCupTool(); }
    else if (g.tool === 'act'){   if (n < 2) return toast('2명 이상 필요해요'); startActTool(); }
    else if (g.tool === 'smile'){ if (n < 3) return toast('3명 이상 필요해요'); startSmileTool(); }
    break;
  }
  case 'pl-mode': S.play.mode = d.v; render(); break;
  case 'pl-sec':  S.play.sec = Number(d.v); render(); break;
  case 'pl-cat': {
    const c = S.play.cats;
    const i = c.indexOf(d.v);
    i < 0 ? c.push(d.v) : c.splice(i, 1);
    render(); break;
  }
  case 'pl-start': {
    if (!S.play.cats.length) return toast('카테고리를 하나 이상 골라주세요');
    Object.assign(S.play, { phase:'ready', turn:0, results:{} });
    render(); break;
  }
  case 'pl-begin': {
    const p = S.play, t = p.order[p.turn];
    if (p.mode === 'oneword'){
      const v = ($('#in-letter')?.value || '').trim();
      if (!v) return toast('이 팀이 쓸 한 글자를 정해주세요');
      p.letters[t] = v[0];
    }
    beginTurn(); break;
  }
  case 'pl-mark': markWord(d.v === '1'); break;
  case 'pl-stop': endTurn(); break;
  case 'pl-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1){ p.phase = 'done'; confetti(70); }
    else { p.turn++; p.phase = 'ready'; }
    render(); break;
  }
  case 'pl-save': deckToScore(); break;

  /* ── 멕썸노이즈 · 컵 레이스 (race-* 공유) ── */
  case 'no-brief': case 'no-reroll': {
    const p = S.play;
    p.sen = jo(pname(p.order[p.turn]), '이', '가') + ' ' + noiseSentence();
    p.phase = 'brief'; vib(8); render(true); break;
  }
  case 'race-run': {
    S.play.phase = 'run'; SFX.go(); vib(20);
    render(true); swBegin(); break;
  }
  case 'race-end': {
    const p = S.play; stopPlayTimer();
    const ok = d.v === '1';
    p.rec[p.order[p.turn]] = ok ? Math.round((p.elapsed || 0) * 10) / 10 : null;
    p.phase = 'turnEnd';
    ok ? SFX.ok() : SFX.end(); vib(ok ? [20,40,20] : 30);
    render(true); break;
  }
  case 'race-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1){ p.phase = 'done'; confetti(70); }
    else { p.turn++; p.phase = 'ready'; }
    render(true); break;
  }
  case 'race-save': {
    const p = S.play;
    toScore([...p.order].sort((a,b) => (p.rec[a] ?? 1e9) - (p.rec[b] ?? 1e9)), 'solo');
    break;
  }

  /* ── 연기 대결 ── */
  case 'ac-reroll': actDraw(); vib(8); render(true); break;
  case 'ac-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1) p.phase = 'done';
    else { p.turn++; actDraw(); }
    render(true); break;
  }
  case 'ac-score': { stopPlayTimer(); S.play = null; act('score-start', {}); break; }

  /* ── 스마일~! ── */
  case 'sm-sul': {
    const p = S.play;
    p.sul = d.pid;
    p.pool = playing().map(([pid]) => pid).filter(x => x !== d.pid);
    p.shots = 10; p.sel = []; p.phase = 'run';
    SFX.go(); render(true); break;
  }
  case 'sm-shot': {
    const p = S.play;
    if (p.shots > 0){ p.shots--; SFX.tick(); vib(10); }
    if (p.shots <= 0){ p.phase = 'judge'; p.sel = []; SFX.end(); }
    render(true); break;
  }
  case 'sm-judge': S.play.phase = 'judge'; S.play.sel = []; render(true); break;
  case 'sm-back':  S.play.phase = 'run'; render(true); break;
  case 'sm-sel': {
    const p = S.play, i = p.sel.indexOf(d.pid);
    i < 0 ? p.sel.push(d.pid) : p.sel.splice(i, 1);
    render(true); break;
  }
  case 'sm-apply': {
    const p = S.play;
    p.log.push({ r:p.log.length + 1, sul:p.sul, caught:[...p.sel] });
    if (p.sel.length === 1){
      const nx = p.sel[0];
      p.sul = nx;
      p.pool = playing().map(([pid]) => pid).filter(x => x !== nx);
    }else if (p.sel.length > 1){
      p.pool = [...p.sel];      // 걸린 사람들끼리 재진행 (술래 유지)
    }                            // 0명 → 같은 술래·같은 대상 다시
    p.shots = 10; p.sel = []; p.round++; p.phase = 'run';
    render(true); break;
  }
  case 'sm-done': S.play.phase = 'done'; render(true); break;
  case 'sm-score': { stopPlayTimer(); S.play = null; act('score-start', {}); break; }

  case 'pl-quit': {
    const p = S.play;
    const prog = p && (p.phase === 'run' || (p.turn || 0) > 0
      || Object.keys(p.results || {}).length > 0 || Object.keys(p.rec || {}).length > 0
      || (p.log || []).length > 0);
    if (prog && !confirm('진행 중인 게임을 그만둘까요? 지금까지 결과는 사라져요.')) return;
    stopPlayTimer(); S.play = null; go('game'); break;
  }

  case 'score-start': {
    if (!S.isHost) return toast('순위 입력은 진행자 기기에서 해주세요');
    const g = G(S.gameId);
    const teams = S.room.teams || {count:0};
    if (g.mode === 'team' && teams.count < 2) return toast('팀전이에요 — 대기실에서 팀을 먼저 나눠주세요');
    S.draft = { gameId:g.id, mode:(g.mode==='team' && teams.count>1) ? 'team' : 'solo',
      order:[], weight:g.weight, assign:JSON.parse(JSON.stringify(teams.assign || {})) };
    go('score'); break;
  }
  case 'pickrank': {
    S.draft.order.push(S.draft.mode === 'team' ? Number(d.id) : d.id);
    render(); break;
  }
  case 'undo': S.draft.order.pop(); render(); break;
  case 'score-cancel': S.draft = null; go('game'); break;
  case 'score-save': {
    const dr = S.draft;
    const sid = 's' + now().toString(36) + Math.random().toString(36).slice(2,6);
    if (!S.room.scores) S.room.scores = {};
    S.room.scores[sid] = { gameId:dr.gameId, mode:dr.mode, order:dr.order,
      weight:dr.weight, assign:dr.assign, at:now() };
    pushHostState(); S.draft = null;
    go('board'); confetti(110); vib([20,40,20]);
    toast('순위가 반영됐어요');
    break;
  }
  case 'del-score': {
    if (!S.isHost) return;
    delete S.room.scores[d.sid];
    set(ref(db, `${ROOT}/rooms/${S.code}/scores`), S.room.scores).catch(()=>{});
    render(); break;
  }

  /* 이 기기를 「사회자(화면)」로 — 겨루지 않는다.
     ⚠️ 자기 players/{pid} 노드만 쓴다(참가자도 쓸 수 있는 경로). 권위 필드는 안 건드린다.
     ⚠️ 팀 배정이 남아 있으면 유령 팀원이 되므로 같이 지운다.
        점수 기록(scores)은 지우지 않는다 — 해제하면 그대로 되살아난다. */
  case 'spec-toggle': {
    const me = S.room.players?.[S.pid]; if (!me) break;
    const on = !isSpec(me);
    if (on && playing().length <= 1) return toast('선수가 아무도 안 남아요');
    me.spec = on;
    update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { spec:on }).catch(()=>{});
    if (on && S.room.teams?.assign?.[S.pid] != null){
      delete S.room.teams.assign[S.pid];
      if (S.isHost) pushHostState();
    }
    vib(12); render(true);
    toast(on ? '📺 이 기기는 사회자(화면)입니다 — 겨루지 않아요' : '다시 선수로 참가합니다');
    break;
  }

  case 'rename': {
    const n = ($('#in-rename')?.value || '').trim();
    if (!n) return toast('이름을 입력해 주세요');
    S.room.players[S.pid].name = n;
    update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { name:n }).catch(()=>{});
    saveSession(); render(); toast('이름을 바꿨어요'); break;
  }
  case 'reset-scores': {
    if (!confirm('점수를 전부 지울까요? 되돌릴 수 없어요.')) return;
    S.room.scores = {};
    set(ref(db, `${ROOT}/rooms/${S.code}/scores`), {}).catch(()=>{});
    render(); toast('점수를 초기화했어요'); break;
  }
  case 'reset-rot': {
    S.room.rotation = {}; S._lastPick = {};
    pushHostState(); render(); toast('순번을 초기화했어요'); break;
  }
  case 'leave': {
    if (S.isHost && !confirm('진행자가 나가면 점수 기준 기기가 사라져요. 나갈까요?')) return;
    leaveRoom(); break;
  }
  }
}

  const q = new URLSearchParams(location.search).get('r');
  const sess = (() => { try{ return JSON.parse(localStorage.getItem(LS) || 'null'); }catch{ return null; } })();
  if (sess && (!q || q === sess.code)){
    if (await rejoin(sess)) return;
    clearSession();
  }
  if (q && /^\d{4}$/.test(q)){
    const el = $('#in-code');
    if (el){ el.value = q; el.dispatchEvent(new Event('input')); }
  }
})();

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
