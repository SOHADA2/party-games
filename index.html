    <p class="note" style="margin:2px 4px 16px">게임을 고르면 규칙과 진행 도구가 열립니다. 끝나고 순위를 입력하면 종합 순위에 자동 합산돼요.</p>
    <div class="glist">
      ${GAMES.map((g,i) => `
        <button class="g ${done[g.id]?'done':''}" data-act="game" data-id="${g.id}" style="${gcVars(g.color)};animation-delay:${i*45}ms">
          <div class="g-ic">${g.emoji}</div>
          <div class="g-b">
            <div class="g-n">${h(g.name)}</div>
            <div class="g-m">
              <span class="chip ${g.mode==='team'?'mint':''}">${g.mode==='team'?'팀전':'개인전'}</span>
              <span>${h(g.tag)}</span>
              ${done[g.id] ? `<span class="chip mint">✓ ${done[g.id]}판</span>` : ''}
            </div>
          </div>
          <div class="g-ar">›</div>
        </button>`).join('')}
    </div>`;
}

/* ── 게임 상세 ── */
function vGame(){
  const g = G(S.gameId); if (!g) return '';
  const done = (S.room.rotation?.[g.id] || []).filter(p => S.room.players[p]);
  const all = players();
  const last = S._lastPick?.[g.id];

  return `
    ${offBanner()}
    <div class="gh" style="${gcVars(g.color)}">
      <div class="gh-em">${g.emoji}</div>
      <div class="gh-n">${h(g.name)}</div>
      <div class="gh-m">
        <span class="chip ${g.mode==='team'?'mint':''}">${g.mode==='team'?'팀전':'개인전'}</span>
        <span class="chip amb">배점 ×${g.weight}</span>
        ${g.role ? `<span class="chip">${h(g.role)} 필요</span>` : ''}
      </div>
    </div>

    ${g.role ? `
      <div class="card">
        <div class="sec" style="margin:0 0 12px">${h(g.role)} 뽑기</div>
        ${last ? `<div class="pickres">
            <div class="pickres-l">${h(g.role)}</div>
            <div class="pickres-v">${h(pname(last))}</div>
          </div>` : ''}
        <button class="btn pri" data-act="pick">🎯 ${last ? '다시 뽑기' : `${h(g.role)} 뽑기`}</button>
        <div class="rot-bar">${all.map(([pid]) => `<div class="rot-seg ${done.includes(pid)?'on':''}"></div>`).join('')}</div>
        <p class="note" style="margin-top:9px">아직 ${h(g.role)}를 안 한 사람 중에서 뽑아요 · <b style="color:var(--dim)">${done.length}/${all.length}</b>명 완료${done.length ? `<br>완료: ${done.map(p=>h(pname(p))).join(', ')}` : ''}</p>
        ${done.length && S.isHost ? `<div style="height:10px"></div><button class="btn gh sm" data-act="rot-reset" style="width:100%">순번 초기화</button>` : ''}
      </div>` : ''}

    ${g.todo ? `<div class="warnbox"><span class="i">📝</span><span>${h(g.todo)}</span></div>` : ''}

    <div class="card">
      <div class="sec" style="margin:0 0 13px">규칙</div>
      <div class="rules">${g.rules}</div>
    </div>

    ${g.tool && S.isHost ? `
      <div class="stack">
        <button class="btn pri" data-act="tool-start">${h(g.toolLabel||'▶ 진행 도구로 시작하기')}</button>
        <button class="btn gh" data-act="score-start">순위만 직접 입력</button>
      </div>`
    : `<button class="btn pri" data-act="score-start">✅ 게임 끝 — 순위 입력</button>`}`;
}

/* ── 진행 도구 라우터 ── */
function vPlay(){
  const p = S.play; if (!p) return '';
  switch (p.kind){
    case 'deck':  return vDeck();
    case 'noise': return vNoise();
    case 'cup':   return vCup();
    case 'act':   return vAct();
    case 'smile': return vSmile();
    case 'watch': return vWatch();
    case 'mafia': return vMafiaTool();
  }
  return '';
}

/* ── 제시어 덱 (몸으로/한글자로 말해요) ── */
function vDeck(){
  const p = S.play;
  const g = G(p.gameId);
  const teams = S.room.teams || {count:0,assign:{}};
  const tc = i => TEAM_COLORS[i % TEAM_COLORS.length];
  const members = i => Object.entries(teams.assign||{}).filter(([,t])=>Number(t)===i)
    .map(([pid])=>pname(pid)).join(', ');
  const wordCount = p.cats.reduce((n,k) => n + (WORD_DECKS[k]?.words.length || 0), 0);

  /* 1) 설정 */
  if (p.phase === 'setup') return `
    <div class="gh" style="${gcVars(g.color)};padding:17px">
      <div class="gh-n" style="font-size:18px;padding-right:0">${g.emoji} ${h(g.name)}</div>
      <p class="note" style="margin-top:7px;position:relative">팀마다 한 번씩 돌아가며 진행합니다</p>
    </div>

    <div class="sec">방식</div>
    <div class="seg">
      <button data-act="pl-mode" data-v="body" class="${p.mode==='body'?'on':''}">🕺 몸으로 말해요</button>
      <button data-act="pl-mode" data-v="oneword" class="${p.mode==='oneword'?'on':''}">🗣 한글자로 말해요</button>
    </div>
    <p class="note" style="margin:-2px 4px 0">${p.mode==='body'
      ? '말 없이 몸동작만으로 설명합니다.'
      : '팀이 정한 <b style="color:var(--elec)">한 글자</b>만 써서 설명합니다. 억양·연기는 자유.'}</p>

    <div class="sec">제한 시간</div>
    <div class="seg">
      ${[45,60,90].map(s => `<button data-act="pl-sec" data-v="${s}" class="${p.sec===s?'on':''}">${s}초</button>`).join('')}
    </div>

    <div class="sec">제시어 <span class="n">${wordCount}개</span></div>
    <div class="catgrid">
      ${DECK_KEYS.map(k => `
        <button class="cat ${p.cats.includes(k)?'on':''}" data-act="pl-cat" data-v="${k}">
          <span class="e">${WORD_DECKS[k].emoji}</span>
          <span>${h(WORD_DECKS[k].name)}</span>
          <span class="c">${WORD_DECKS[k].words.length}</span>
        </button>`).join('')}
    </div>

    <div style="height:20px"></div>
    <div class="stack">
      <button class="btn pri" data-act="pl-start" ${!p.cats.length ? 'disabled' : ''}>
        ${p.cats.length ? '▶ 시작하기' : '카테고리를 하나 이상 골라주세요'}</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  /* 2) 턴 대기 */
  if (p.phase === 'ready'){
    const t = p.order[p.turn];
    return `
      <div class="turnhd">
        <span class="sw" style="--tc:${tc(t)}"></span>
        <span class="t">${t+1}팀 차례</span>
        <span class="r">${p.turn+1} / ${p.order.length}</span>
      </div>
      <div class="card">
        <p class="note" style="font-size:14px;color:var(--dim)">${h(members(t)) || '팀원 없음'}</p>
      </div>

      ${p.mode==='oneword' ? `
        <div class="sec">이 팀의 한 글자</div>
        <div class="card">
          <input class="inp" id="in-letter" maxlength="1" placeholder="예: 짜" value="${h(p.letters[t]||'')}"
            style="text-align:center;font-size:30px;font-weight:900;padding:14px">
          <p class="note" style="margin-top:9px">이 글자만 써서 설명해야 합니다</p>
        </div>` : ''}

      <div style="text-align:center;padding:26px 18px;border-radius:var(--r-l);
        background:linear-gradient(150deg,rgba(255,107,74,.14),rgba(255,184,77,.05));
        border:1px solid rgba(255,184,77,.3);margin-bottom:14px">
        <div style="font-size:34px;margin-bottom:10px">📱</div>
        <div style="font-weight:800;font-size:15px;line-height:1.6;word-break:keep-all">
          설명할 사람이 폰을 받으세요<br>
          <span style="color:var(--dim);font-weight:600;font-size:13.5px">나머지는 화면을 보면 안 됩니다</span>
        </div>
      </div>

      <div class="stack">
        <button class="btn pri" data-act="pl-begin">${p.sec}초 시작</button>
        <button class="btn gh" data-act="pl-quit">그만두기</button>
      </div>`;
  }

  /* 3) 진행 중 */
  if (p.phase === 'run'){
    const t = p.order[p.turn];
    const hit = p.hits.filter(x => x.ok).length;
    const wl = (p.cur.w || '').length;
    const long = wl > 14 ? 'xlong' : wl > 8 ? 'long' : '';
    return `
      <div class="turnhd">
        <span class="sw" style="--tc:${tc(t)}"></span>
        <span class="t">${t+1}팀</span>
        <span class="r">${p.turn+1} / ${p.order.length}</span>
      </div>
      <div class="tbar"><i id="t-bar" style="width:100%"></i></div>
      <div class="trow">
        <div class="tsec" id="t-sec">${p.sec}초</div>
        <div class="thit">맞춘 개수 ${hit}</div>
      </div>

      <div class="wcard">
        <div>
          ${p.mode==='oneword' && p.letters[t]
            ? `<div class="wletter">🗣 우리 글자 「${h(p.letters[t])}」</div>`
            : `<div class="wcat">${h(WORD_DECKS[p.cur.c]?.name || '')}</div>`}
          <div class="wtxt ${long}">${h(p.cur.w)}</div>
        </div>
      </div>

      <div class="wbtns">
        <button class="bigbtn pass" data-act="pl-mark" data-v="0">패스</button>
        <button class="bigbtn ok" data-act="pl-mark" data-v="1">정답!</button>
      </div>
      <div style="height:10px"></div>
      <button class="btn gh sm" data-act="pl-stop" style="width:100%">시간 전에 끝내기</button>`;
  }

  /* 4) 턴 종료 */
  if (p.phase === 'turnEnd'){
    const t = p.order[p.turn];
    const list = p.results[t] || [];
    const hit = list.filter(x => x.ok).length;
    const isLast = p.turn >= p.order.length - 1;
    return `
      <div class="pickres">
        <div class="pickres-l">${t+1}팀 결과</div>
        <div class="pickres-v">${hit}개</div>
      </div>
      ${list.length ? `<div class="sec">제시어</div>
        ${list.map(x => `<div class="sumrow ${x.ok?'':'no'}">
            <span class="m">${x.ok?'✅':'⛔'}</span><span class="w">${h(x.w)}</span></div>`).join('')}`
        : '<div class="empty"><div class="empty-e">😶</div><div class="empty-t">한 개도 못 넘겼어요</div></div>'}
      <div style="height:18px"></div>
      <button class="btn pri" data-act="pl-next">
        ${isLast ? '🏁 전체 결과 보기' : `다음 — ${p.order[p.turn+1]+1}팀 차례`}</button>`;
  }

  /* 5) 전체 종료 */
  const cnt = t => (p.results[t] || []).filter(x => x.ok).length;
  const ranked = [...p.order].sort((a,b) => cnt(b) - cnt(a));
  return `
    <div class="sec">최종 결과</div>
    ${ranked.map((t,i) => `
      <div class="tscore" style="--tc:${tc(t)}">
        <div class="rno ${i<3?'m'+(i+1):''}">${i+1}</div>
        <div class="n">${t+1}팀 <span class="note" style="font-weight:600">${h(members(t))}</span></div>
        <div class="v">${cnt(t)}<small>개</small></div>
      </div>`).join('')}
    <div style="height:18px"></div>
    <div class="stack">
      <button class="btn pri" data-act="pl-save">이 순위로 반영하기</button>
      <button class="btn gh" data-act="pl-quit">점수 반영 없이 나가기</button>
    </div>
    <p class="note" style="text-align:center;margin-top:12px">
      동점이거나 순서를 바꾸고 싶으면 다음 화면에서 조정할 수 있어요</p>`;
}

/* ── 멕썸노이즈 ── */
function vNoise(){
  const p = S.play, g = G(p.gameId);
  const runner = p.order[p.turn], nm = pname(runner);
  const head = `<div class="turnhd"><span class="sw" style="--tc:${avColor(runner)}"></span>
      <span class="t">술래 — ${h(nm)}</span><span class="r">${p.turn+1} / ${p.order.length}</span></div>`;

  if (p.phase === 'ready') return `${head}
    <div style="text-align:center;padding:30px 18px;border-radius:var(--r-l);
      background:linear-gradient(150deg,rgba(255,107,74,.14),rgba(255,184,77,.05));
      border:1px solid rgba(255,184,77,.3);margin-bottom:14px">
      <div style="font-size:38px;margin-bottom:10px">🙈</div>
      <div style="font-weight:800;font-size:15.5px;line-height:1.6;word-break:keep-all">
        ${h(nm)}, 잠깐 뒤돌아서 눈 감고 귀 막기!<br>
        <span style="color:var(--dim);font-weight:600;font-size:13.5px">나머지가 미션 문장을 확인할 거예요</span>
      </div>
    </div>
    <div class="stack">
      <button class="btn pri" data-act="no-brief">📜 미션 문장 만들기</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  if (p.phase === 'brief') return `${head}
    <div class="wcard"><div>
      <div class="wcat">🤫 술래 몰래 확인!</div>
      <div class="wtxt ${p.sen.length>16?'xlong':p.sen.length>10?'long':''}">${h(p.sen)}</div>
    </div></div>
    <div class="warnbox"><span class="i">📢</span><span>다 확인했으면 술래를 부르세요. 술래가 정답에 <b>가까워지면 크게 소리</b>, 멀어지면 조용히!</span></div>
    <div class="stack">
      <button class="btn pri" data-act="race-run">🚦 술래 준비 완료 — 시작!</button>
      <button class="btn" data-act="no-reroll">🔄 다른 문장으로</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  if (p.phase === 'run') return `${head}
    <div class="wcard" style="min-height:150px;padding:28px 18px"><div>
      <div class="wcat">경과 시간</div>
      <div class="bignum" id="sw-sec">${fmtSw(p.elapsed||0)}</div>
    </div></div>
    <p class="note" style="text-align:center;margin:0 0 14px">미션 — ${h(p.sen)}<br>(술래에게 보여주지 마세요)</p>
    <div class="wbtns">
      <button class="bigbtn pass" data-act="race-end" data-v="0">🙅 포기</button>
      <button class="bigbtn ok" data-act="race-end" data-v="1">🎉 성공!</button>
    </div>`;

  if (p.phase === 'turnEnd'){
    const r = p.rec[runner];
    return `<div class="pickres">
        <div class="pickres-l">${h(nm)}의 기록</div>
        <div class="pickres-v">${r==null?'실패 😵':fmtSw(r)}</div>
      </div>
      <p class="note" style="text-align:center;margin-bottom:14px">미션 — ${h(p.sen)}</p>
      <button class="btn pri" data-act="race-next">${p.turn>=p.order.length-1?'🏁 전체 결과 보기':'다음 술래 →'}</button>`;
  }
  return vRaceDone(p, '성공까지 걸린 시간이 짧은 순 · 실패는 마지막');
}

/* ── 컵 레이스 ── */
function vCup(){
  const p = S.play;
  const cur = p.order[p.turn], nm = pname(cur);
  const head = `<div class="turnhd"><span class="sw" style="--tc:${avColor(cur)}"></span>
      <span class="t">${h(nm)} 차례</span><span class="r">${p.turn+1} / ${p.order.length}</span></div>`;

  if (p.phase === 'ready') return `${head}
    <div class="card"><p class="note" style="font-size:14px;color:var(--dim);line-height:1.7">
      물이 담긴 컵 아래 휴지를 깔고, 휴지만 당겨서 목표 지점까지!<br>
      물을 쏟거나 휴지가 찢어지면 실패예요.</p></div>
    <div class="stack">
      <button class="btn pri" data-act="race-run">🚦 출발!</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;

  if (p.phase === 'run') return `${head}
    <div class="wcard" style="min-height:170px;padding:30px 18px"><div>
      <div class="wcat">기록</div>
      <div class="bignum" id="sw-sec">${fmtSw(p.elapsed||0)}</div>
    </div></div>
    <div class="wbtns">
      <button class="bigbtn pass" data-act="race-end" data-v="0">💦 실패</button>
      <button class="bigbtn ok" data-act="race-end" data-v="1">🏁 도착!</button>
    </div>`;

  if (p.phase === 'turnEnd'){
    const r = p.rec[cur];
    return `<div class="pickres">
        <div class="pickres-l">${h(nm)}의 기록</div>
        <div class="pickres-v">${r==null?'실패 💦':fmtSw(r)}</div></div>
      <button class="btn pri" data-act="race-next">${p.turn>=p.order.length-1?'🏁 전체 결과 보기':'다음 사람 →'}</button>`;
  }
  return vRaceDone(p, '빠른 순 · 실패는 마지막');
}

/* 시간 기록형 공통 결과 */
function vRaceDone(p, subtitle){
  const order = [...p.order].sort((a,b) => (p.rec[a] ?? 1e9) - (p.rec[b] ?? 1e9));
  return `<div class="sec">최종 기록</div>
    ${order.map((pid,i) => `
      <div class="tscore" style="--tc:${avColor(pid)}">
        <div class="rno ${i<3?'m'+(i+1):''}">${i+1}</div>
        <div class="n">${h(pname(pid))}</div>
        <div class="v" style="font-size:18px">${fmtSw(p.rec[pid])}</div>
      </div>`).join('')}
    <p class="note" style="text-align:center;margin:4px 0 14px">${h(subtitle)}</p>
    <div class="stack">
      <button class="btn pri" data-act="race-save">이 순위로 반영하기</button>
      <button class="btn gh" data-act="pl-quit">점수 반영 없이 나가기</button>
    </div>`;
}

/* ── 연기 대결 ── */
function vAct(){
  const p = S.play;
  if (p.phase === 'done') return `
    <div class="pickres"><div class="pickres-l">전원 연기 완료</div><div class="pickres-v">🎬 심사 시간!</div></div>
    <div class="card"><p class="note" style="font-size:14px;line-height:1.7">
      다 같이 의논해서 <b style="color:var(--amber)">가장 잘한 사람부터</b> 순위를 정하세요.
      다음 화면에서 순서대로 탭하면 됩니다.</p></div>
    <div class="stack">
      <button class="btn pri" data-act="ac-score">🏆 순위 입력하기</button>
      <button class="btn gh" data-act="pl-quit">점수 반영 없이 나가기</button>
    </div>`;
  const cur = p.order[p.turn], nm = pname(cur);
  return `
    <div class="turnhd"><span class="sw" style="--tc:${avColor(cur)}"></span>
      <span class="t">${h(nm)} 차례</span><span class="r">${p.turn+1} / ${p.order.length}</span></div>
    <div class="wcard" style="min-height:230px"><div>
      <div class="wletter">🎭 감정 — ${h(p.card.e)}</div>
      <div class="wtxt" style="font-size:${p.card.l.length>16?24:29}px">“${h(p.card.l)}”</div>
    </div></div>
    <p class="note" style="text-align:center;margin:0 0 14px">이 대사를 저 감정으로 연기하세요</p>
    <div class="stack">
      <button class="btn pri" data-act="ac-next">${p.turn>=p.order.length-1?'연기 끝 — 심사하러 →':'다음 사람 →'}</button>
      <button class="btn" data-act="ac-reroll">🔄 다른 대사 뽑기</button>
      <button class="btn gh" data-act="pl-quit">그만두기</button>
    </div>`;
}

/* ── 스마일~! ── */
function vSmile(){
  const p = S.play;
  const allP = players();

  if (p.phase === 'pick') return `
    <div class="sec">첫 술래 고르기</div>
    ${allP.map(([pid,pl]) => `
      <button class="pick" data-act="sm-sul" data-pid="${pid}">
        ${av(pid, pl.name, 'sm')}
        <div style="font-weight:800;font-size:15px">${h(pl.name)}</div>
      </button>`).join('')}
    <div style="height:8px"></div>
    <button class="btn gh" data-act="pl-quit">그만두기</button>`;

  const sulNm = pname(p.sul);
  const narrowed = p.pool.length < allP.length - 1;

  if (p.phase === 'run') return `
    <div class="turnhd"><span class="sw" style="--tc:${avColor(p.sul)}"></span>
      <span class="t">술래 — ${h(sulNm)}</span><span class="r">라운드 ${p.round}</span></div>
    ${narrowed ? `<div class="banner" style="background:rgba(124,107,255,.1);border:1px solid rgba(124,107,255,.3);color:#B8AEFF">
      🎯 재진행 — 대상: ${p.pool.map(x => h(pname(x))).join(', ')}</div>` : ''}
    <div class="wcard" style="min-height:160px;padding:26px 18px"><div>
      <div class="wcat">남은 사진</div>
      <div class="bignum">${p.shots}<span style="font-size:22px;color:var(--dim2)"> / 10</span></div>
    </div></div>
    <div class="stack">
      <button class="bigbtn ok" data-act="sm-shot" style="width:100%">📸 찍었다!</button>
      <button class="btn" data-act="sm-judge">🧐 판정하기 — 사진 확인</button>
      <button class="btn gh sm" data-act="sm-done" style="width:100%">게임 종료</button>
    </div>`;

  if (p.phase === 'judge'){
    const n = p.sel.length;
    const label = n === 0 ? '아무도 안 걸림 — 같은 술래 다시'
      : n === 1 ? `${jo(pname(p.sel[0]),'이','가')} 다음 술래!`
      : `걸린 ${n}명끼리 재진행`;
    return `
      <div class="sec">사진에 걸린 사람은?</div>
      ${p.pool.map(pid => `
        <button class="pick" data-act="sm-sel" data-pid="${pid}"
          style="${p.sel.includes(pid)?'border-color:var(--rose);background:rgba(255,92,124,.1)':''}">
          ${av(pid, pname(pid), 'sm')}
          <div style="flex:1;font-weight:800;font-size:15px">${h(pname(pid))}</div>
          ${p.sel.includes(pid)?'<span class="chip rose">📸 걸림</span>':''}
        </button>`).join('')}
      <div style="height:12px"></div>
      <div class="stack">
        <button class="btn pri" data-act="sm-apply">${label}</button>
        <button class="btn gh" data-act="sm-back">← 계속 찍기</button>
      </div>`;
  }

  /* done */
  return `
    <div class="sec">라운드 기록</div>
    ${p.log.length ? p.log.map(L => `
      <div class="sumrow"><span class="m">📸</span>
        <span>R${L.r} · 술래 ${h(pname(L.sul))} → ${L.caught.length ? L.caught.map(x=>h(pname(x))).join(', ') : '아무도 안 걸림'}</span>
      </div>`).join('') : '<p class="note" style="margin:0 4px 10px">기록 없음</p>'}
    <div class="card" style="margin-top:12px"><p class="note" style="font-size:13.5px;line-height:1.7">
      순위 기준 — <b style="color:var(--amber)">끝까지 안 걸린 사람이 1등</b>, 술래가 된 순서의 역순.
      다음 화면에서 순서대로 탭해 주세요.</p></div>
    <div class="stack">
      <button class="btn pri" data-act="sm-score">🏆 순위 입력하기</button>
      <button class="btn gh" data-act="pl-quit">나가기</button>
    </div>`;
}

/* ── 상황극 마피아 (사회자 도구) ── */
function vMafiaTool(){
  const p = S.play;
  let pool = players().map(([pid]) => pid);
  if (!p.incHost) pool = pool.filter(x => x !== S.pid);
  const sd = MAFIA_SITS.find(x => x.n === p.sit) || MAFIA_SITS[0];

  if (p.phase === 'setup') return `
    <div class="gh" style="${gcVars('#FF5C7C')};padding:18px">
      <div class="gh-em">🎭</div>
      <div class="gh-n" style="font-size:18px;padding-right:0">역할 나눠주기</div>
      <p class="note" style="margin-top:7px;position:relative">각자 자기 폰(대기실)에서 비밀 역할을 확인하게 됩니다</p>
    </div>

    <div class="sec">배경 상황</div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div style="flex:1;font-weight:900;font-size:18px;letter-spacing:-.03em">${h(sd.n)}</div>
        <button class="btn sm" data-act="mf-sit">🎲 바꾸기</button>
      </div>
      <p class="story">${h(sd.intro)}</p>
      <div class="rolelist">
        <div class="rolerow"><span class="chip rose">${h(sd.mafia.name)}</span><span>${h(sd.mafia.desc)}</span></div>
        ${p.pol ? `<div class="rolerow"><span class="chip elec">${h(sd.cop.name)}</span><span>${h(sd.cop.desc)}</span></div>` : ''}
        ${p.doc ? `<div class="rolerow"><span class="chip mint">${h(sd.doc.name)}</span><span>${h(sd.doc.desc)}</span></div>` : ''}
      </div>
    </div>

    <div class="sec">구성 <span class="n">역할 받을 사람 ${pool.length}명</span></div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:800">${h(sd.mafia.name)} 수</div>
          <div class="note" style="font-size:11.5px">이 판의 마피아 진영</div>
        </div>
        <button class="stepbtn" data-act="mf-cnt" data-v="-1">−</button>
        <div style="font-weight:900;font-size:22px;min-width:26px;text-align:center">${p.cnt}</div>
        <button class="stepbtn" data-act="mf-cnt" data-v="1">＋</button>
      </div>
      <div class="catgrid">
        <button class="cat ${p.pol?'on':''}" data-act="mf-tog" data-v="pol"><span class="e">🔍</span><span>${h(sd.cop.name)}</span></button>
        <button class="cat ${p.doc?'on':''}" data-act="mf-tog" data-v="doc"><span class="e">💉</span><span>${h(sd.doc.name)}</span></button>
      </div>
      <div style="height:10px"></div>
      <button class="cat ${p.incHost?'on':''}" data-act="mf-tog" data-v="incHost" style="width:100%">
        <span class="e">🙋</span><span>나(사회자)도 역할 받기</span></button>
    </div>

    <div style="height:14px"></div>
    <div class="stack">
      <button class="btn pri" data-act="mf-deal">🎭 역할 나눠주기</button>
      <button class="btn gh" data-act="pl-quit">나가기</button>
    </div>`;

  /* ── 진행 중 (앱이 사회자 역할) ── */
  const m = S.room.mafia || { roles:{} };
  const rows = Object.entries(m.roles || {}).filter(([pid]) => S.room.players[pid]);
  const mafiaNm = m.mafiaName || '마피아';
  const alive = mfAlive();
  const ph = m.phase || 'day';
  const ev = mfLastEvent();
  const acts = mfActs(), votes = mfVotes();
  const cop = mfCop(), doc = mfDoc();
  const mafAlive = alive.filter(x => m.roles[x].team === 'mafia');

  const phTag = { day:'☀️ 낮 · 토론', vote:'🗳 투표 중', night:'🌙 밤', ended:'🏁 종료' }[ph] || '';

  /* 단계별 컨트롤 */
  let ctrl = '';
  if (ph === 'day'){
    ctrl = `<div class="stack">
        <button class="btn pri" data-act="mf-vote">🗳 투표 시작</button>
        <button class="btn" data-act="mf-night">🌙 투표 없이 바로 밤으로</button>
      </div>
      <p class="note" style="text-align:center;margin-top:10px">
        ${m.round === 1 ? '첫 라운드예요 — 한 명씩 배역과 알리바이를 소개하게 하세요' : '토론이 끝나면 투표를 시작하세요'}</p>`;
  }
  else if (ph === 'vote'){
    const voted = Object.keys(votes).filter(x => mfIsAlive(x)).length;
    const tally = {};
    Object.values(votes).forEach(t => { if (t) tally[t] = (tally[t] || 0) + 1; });
    const sorted = Object.entries(tally).sort((a,b) => b[1] - a[1]);
    ctrl = `
      <div class="card">
        <div class="sec" style="margin:0 0 10px">투표 현황 <span class="n">${voted} / ${alive.length}</span></div>
        ${sorted.length ? sorted.map(([pid,c]) => `
          <div class="tscore" style="--tc:${avColor(pid)};margin-bottom:6px">
            <div class="n">${h(pname(pid))}</div>
            <div class="v">${c}<small>표</small></div>
          </div>`).join('') : '<p class="note">아직 아무도 투표하지 않았어요</p>'}
      </div>
      <div class="stack">
        <button class="btn pri" data-act="mf-exile">⚖️ 투표 마감 — 결과 공개</button>
        <button class="btn gh" data-act="mf-backday">← 토론으로 돌아가기</button>
      </div>`;
  }
  else if (ph === 'night'){
    const need = [
      { ok:!!acts.kill,  ic:'🔪', nm:mafiaNm, who:mafAlive.map(x => pname(x)).join(', ') },
      cop ? { ok:!!acts.check, ic:'🔍', nm:sd.cop.name, who:pname(cop) } : null,
      doc ? { ok:!!acts.save,  ic:'💉', nm:sd.doc.name, who:pname(doc) } : null,
    ].filter(Boolean);
    const allIn = need.every(x => x.ok);
    ctrl = `
      <div class="card">
        <div class="sec" style="margin:0 0 10px">행동 현황</div>
        ${need.map(x => `
          <div class="tscore" style="--tc:${x.ok?'var(--mint)':'var(--dim2)'};margin-bottom:6px">
            <div class="n" style="padding-left:7px">${x.ic} ${h(x.nm)}
              <div class="note" style="font-size:11.5px">${h(x.who)}</div></div>
            <span class="chip ${x.ok?'mint':''}">${x.ok?'✓ 완료':'대기 중'}</span>
          </div>`).join('')}
        <p class="note" style="margin-top:10px">각자 자기 폰에서 지목하면 여기 체크됩니다</p>
      </div>
      <div class="stack">
        <button class="btn pri" data-act="mf-morning">☀️ 아침 밝히기${allIn?'':' (미완료 무시)'}</button>
      </div>`;
  }
  else if (ph === 'ended'){
    const win = m.winner === 'mafia';
    ctrl = `
      <div class="pickres" style="${win?'background:linear-gradient(150deg,rgba(255,92,124,.2),rgba(255,92,124,.06));border-color:rgba(255,92,124,.4)':''}">
        <div class="pickres-l">게임 종료</div>
        <div class="pickres-v" style="${win?'background:linear-gradient(135deg,#FF5C7C,#FF8F5C);-webkit-background-clip:text;background-clip:text':''}">
          ${win ? '🔪 ' + h(mafiaNm) + ' 승리' : '🕊 시민 승리'}</div>
      </div>
      <div class="card">
        <div class="sec" style="margin:0 0 10px">전체 정체 공개</div>
        ${rows.map(([pid,r]) => `
          <div class="tscore" style="--tc:${r.team==='mafia'?'var(--rose)':avColor(pid)};margin-bottom:6px;${mfIsAlive(pid)?'':'opacity:.5'}">
            <div class="n" style="display:flex;align-items:center;gap:9px">${av(pid, pname(pid), 'sm')}
              <div style="min-width:0"><div>${h(pname(pid))}${mfIsAlive(pid)?'':' <span class="chip">탈락</span>'}</div>
                <div class="note" style="font-size:11.5px">${h(r.char)}</div></div></div>
            <span class="chip ${r.team==='mafia'?'rose':(r.job?'elec':'mint')}">${
              r.team==='mafia' ? '🔪 '+h(mafiaNm) : (r.job ? h(r.job) : '🕊 시민')}</span>
          </div>`).join('')}
      </div>
      <div class="stack">
        <button class="btn pri" data-act="mf-score">🏆 순위 입력하기</button>
        <button class="btn" data-act="mf-redeal">🔄 새 판 시작</button>
        <button class="btn dan" data-act="mf-clear">🧹 역할 회수 — 종료</button>
      </div>`;
  }

  return `
    <div class="gh" style="${gcVars('#FF5C7C')};padding:18px">
      <div class="gh-em">🎭</div>
      <div class="gh-n" style="font-size:19px;padding-right:0">${h(m.sit||'')}</div>
      <div class="gh-m">
        <span class="chip rose">${phTag}</span>
        <span class="chip">${m.round}일차</span>
        <span class="chip">생존 ${alive.length}명</span>
      </div>
    </div>

    ${ev ? `<div class="evbox">
      <div class="ev-ic">${ev.ic}</div>
      <div><div class="ev-t">${h(ev.t)}</div>${ev.s?`<div class="ev-s">${h(ev.s)}</div>`:''}</div>
    </div>` : `<div class="card"><p class="story big">${h(m.intro||'')}</p>
      <p class="note" style="margin-top:10px">📢 소리 내어 읽어주세요</p></div>`}

    ${ph !== 'ended' ? `<div class="truthbox">
      <div class="th">✋ 시민은 거짓말할 수 없습니다</div>
      <p>배역과 알리바이는 사실대로. 오직 <b style="color:var(--rose)">${h(mafiaNm)}</b>만 거짓말할 수 있어요.
      그래서 말이 어긋나는 사람이 범인입니다.</p>
    </div>` : ''}

    ${ctrl}

    ${ph !== 'ended' ? `
      <div class="sec">생존자 <span class="n">${alive.length}명</span></div>
      <button class="btn gh sm" data-act="mf-show" style="width:100%;margin-bottom:10px">
        ${p.show?'🙈 정체 가리기':'👁 정체 보기 (사회자만)'}</button>
      ${rows.map(([pid,r]) => `
        <div class="tscore" style="--tc:${p.show&&r.team==='mafia'?'var(--rose)':avColor(pid)};${mfIsAlive(pid)?'':'opacity:.42'}">
          <div class="n" style="display:flex;align-items:center;gap:9px">${av(pid, pname(pid), 'sm')}
            <div style="min-width:0"><div>${h(pname(pid))}${mfIsAlive(pid)?'':' <span class="chip">탈락</span>'}</div>
              <div class="note" style="font-size:11.5px">${h(r.char)}</div></div></div>
          ${p.show
            ? `<span class="chip ${r.team==='mafia'?'rose':(r.job?'elec':'mint')}">${
                r.team==='mafia' ? '🔪 '+h(mafiaNm) : (r.job ? h(r.job) : '🕊 시민')}</span>`
            : '<span class="chip">비밀</span>'}
        </div>`).join('')}
      <div style="height:14px"></div>
      <div class="stack">
        <button class="btn gh sm" data-act="mf-redeal" style="width:100%">🔄 처음부터 다시 나눠주기</button>
        <button class="btn gh sm" data-act="pl-quit" style="width:100%">나가기 (게임 유지)</button>
      </div>` : ''}`;
}

/* ── 참가자 행동 패널 — 앱이 밤/투표를 직접 받는다 ── */
function mfActionPanel(m, my){
  const sd = MAFIA_SITS.find(x => x.n === m.sit) || MAFIA_SITS[0];
  const ph = m.phase || 'day', mafiaNm = m.mafiaName || '마피아';
  const alive = mfAlive(), acts = mfActs(), votes = mfVotes();
  const dead = !mfIsAlive(S.pid);

  const box = (cls, head, body) =>
    `<div class="actbox ${cls}"><div class="ah">${head}</div>${body}</div>`;
  const picker = (act, cur, list) => `<div class="pgrid">${list.map(pid => `
      <button class="pbtn ${String(cur)===pid?'on':''}" data-act="${act}" data-pid="${pid}">
        ${av(pid, pname(pid), 'sm')}<span>${h(pname(pid))}</span>
        ${String(cur)===pid?'<span class="ck">✓</span>':''}
      </button>`).join('')}</div>`;

  const isCop = my.job === sd.cop.name, isDoc = my.job === sd.doc.name;
  const isMaf = my.team === 'mafia';
  const mates = alive.filter(x => x !== S.pid && m.roles[x]?.team === 'mafia');

  /* ⚠️ 조사 결과는 낮에도 계속 보여야 한다 — 정작 써먹는 시점이 토론 중이다.
     직전 밤(round-1) 결과를 단계와 무관하게 붙인다. */
  const cr = (m.checkRes || {})[m.round - 1];
  const resNote = (isCop && cr)
    ? `<p class="astep res">🔍 지난밤 조사 — <b>${h(pname(cr.target))}</b> :
        <b style="color:${cr.res==='mafia'?'var(--rose)':'var(--mint)'}">${
          cr.res==='mafia' ? '🔪 '+h(mafiaNm)+'입니다!' : '🕊 시민입니다'}</b></p>` : '';
  const mateNote = (isMaf && mates.length)
    ? `<p class="astep">동료 ${h(mafiaNm)} — <b style="color:var(--rose)">${mates.map(x=>h(pname(x))).join(', ')}</b></p>` : '';

  if (ph === 'ended'){
    const win = m.winner === 'mafia';
    const iWon = (my.team === 'mafia') === win;
    return box(win?'lie':'', `${win?'🔪 '+h(mafiaNm):'🕊 시민'} 승리`,
      `<p class="astep" style="font-size:15px;font-weight:800;color:${iWon?'var(--mint)':'var(--dim)'}">
        ${iWon ? '🎉 우리 편이 이겼습니다!' : '아쉽지만 졌습니다…'}</p>`);
  }
  if (dead) return box('', '💀 탈락했습니다',
    `<p class="astep">이제 말할 수 없습니다. 조용히 지켜봐 주세요.</p>` + resNote);

  if (ph === 'day') return box(isCop?'cop':(isMaf?'lie':''), '☀️ 낮 — 토론 시간',
    resNote + mateNote + `<p class="astep" style="margin-bottom:0">${m.round === 1
      ? '자기 배역과 알리바이를 소개하세요. 아래에 다 적혀 있습니다.'
      : '누가 수상한지 이야기하세요. 사회자가 투표를 시작할 때까지.'}</p>`);

  if (ph === 'vote'){
    const mine = votes[S.pid];
    return box('vote', '🗳 투표 — 누가 수상한가요?',
      resNote + mateNote
      + (mine ? `<p class="astep">✓ <b>${h(pname(mine))}</b>님에게 투표했습니다. 바꾸려면 다시 고르세요.</p>` : '')

  if (isMaf) return box('lie', '🌙 밤 — 오늘 없앨 사람은?',
    (mates.length ? `<p class="astep">동료 ${h(mafiaNm)} — <b style="color:var(--rose)">${mates.map(x=>h(pname(x))).join(', ')}</b> · 서로 상의해서 한 명만 고르세요</p>` : '')
    + (acts.kill ? `<p class="astep">✓ <b>${h(pname(acts.kill))}</b>님을 지목했습니다.</p>` : '')
    + picker('mf-act-kill', acts.kill, alive.filter(x => m.roles[x]?.team !== 'mafia')));

  if (isCop) return box('cop', `🔍 ${h(sd.cop.name)} — 알아볼 사람은?`,
    resNote
    + (acts.check ? `<p class="astep">✓ <b>${h(pname(acts.check))}</b>님을 조사합니다. 결과는 아침에.</p>` : '')
    + picker('mf-act-check', acts.check, alive.filter(x => x !== S.pid)));

  if (isDoc) return box('doc', `💉 ${h(sd.doc.name)} — 오늘 지킬 사람은?`,
    (acts.save ? `<p class="astep">✓ <b>${h(pname(acts.save))}</b>님을 지킵니다.</p>` : '')
    + picker('mf-act-save', acts.save, alive));

  return box('', '🌙 밤 — 눈을 감고 기다려 주세요', `<p class="astep">아침이 되면 알려드릴게요.</p>`);
}

async function rollReveal(label, pool, finalPid){
  const ov = document.createElement('div');
  ov.className = 'roll-ov';
  ov.innerHTML = `<div class="roll-b">
      <div class="roll-l">${h(label)}</div>
      <div class="roll-n spin" id="roll-n">&nbsp;</div>
      <div class="roll-tap" id="roll-tap" style="visibility:hidden">화면을 탭하면 닫혀요</div>
    </div>`;
  document.body.appendChild(ov);
  const el = ov.querySelector('#roll-n');

  const names = pool.map(p => pname(p));
  let delay = 55, t = 0;
  while (t < 1500){
    el.textContent = names[(Math.random()*names.length)|0];
    vib(5);
    await sleep(delay);
    t += delay;
    delay = Math.min(240, delay * 1.13);
  }
  el.classList.remove('spin'); el.classList.add('land');
  el.textContent = pname(finalPid);
  vib([28,50,28]); confetti(70);
  ov.querySelector('#roll-tap').style.visibility = 'visible';

  await new Promise(res => {
    const close = () => { ov.remove(); res(); };
    ov.onclick = close;
    setTimeout(() => { if (document.body.contains(ov)) close(); }, 4200);
  });
}

/* ══════════════════════════════════════════════
   이벤트
══════════════════════════════════════════════ */
function bind(root){
  // stopPropagation: 버튼 안에 또 다른 data-act(예: 설치 배너의 ✕)가 있을 때 둘 다 발동하는 것 방지
  root.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); act(el.dataset.act, el.dataset); };
  });

  const ci = root.querySelector('#in-code');
  if (ci){
    const paint = () => {
      const v = ci.value;
      root.querySelectorAll('.code-cell').forEach((c,i) => {
        c.classList.toggle('filled', !!v[i]);
        c.classList.toggle('on', i === v.length && document.activeElement === ci);
        c.innerHTML = v[i] ? h(v[i])
          : (i === v.length && document.activeElement === ci ? '<span class="cursor"></span>' : '<span class="ph"></span>');
      });
    };
    ci.oninput = () => {
      ci.value = ci.value.replace(/\D/g,'').slice(0,4);
      paint(); vib(6);
      if (ci.value.length === 4) act('join', {});
    };
    ci.onfocus = paint; ci.onblur = paint;
    root.querySelector('#code-boxes').onclick = () => ci.focus();
    paint();
  }

  /* 비밀 역할: 꾹 누르는 동안만 표시 */
  const rh = root.querySelector('#role-hold');
  if (rh){
    const show = e => { e.preventDefault(); rh.classList.add('show'); vib(14); };
    const hide = () => rh.classList.remove('show');
    rh.onpointerdown = show;
    rh.onpointerup = rh.onpointerleave = rh.onpointercancel = hide;
    rh.oncontextmenu = e => e.preventDefault();
  }
}

async function act(a, d){
  vib();
  switch(a){

  case 'create': {
    const name = ($('#in-name')?.value || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    await createRoom(name); break;
  }
  case 'join': {
    const name = ($('#in-name')?.value || '').trim();
    const code = ($('#in-code')?.value || '').trim();
    if (!name) return toast('이름을 입력해 주세요');
    if (code.length !== 4) return toast('4자리 방 코드를 입력해 주세요');
    await joinRoom(code, name); break;
  }
  case 'rejoin': {
    const sess = JSON.parse(localStorage.getItem(LS) || 'null'); if (!sess) return;
    if (!(await rejoin(sess))){ clearSession(); toast('예전 방을 찾을 수 없어요'); render(true); }
    break;
  }
  case 'share': shareRoom(); break;

  case 'bot-add': {
    if (!S.isHost) return;
    if (players().length + Number(d.n) > 12) return toast('참가자는 12명까지만요');
    addBots(Number(d.n)); confetti(30); render(true);
    toast(`테스트 참가자 ${d.n}명이 들어왔어요`);
    break;
  }
  case 'bot-clear': {
    if (!S.isHost) return;
    const n = clearBots(); render(true);
    toast(n ? `테스트 참가자 ${n}명을 내보냈어요` : '내보낼 봇이 없어요');
    break;
  }

  case 'install': {
    if (_installEvt){
      _installEvt.prompt();
      const r = await _installEvt.userChoice.catch(() => null);
      _installEvt = null;
      if (r?.outcome !== 'accepted') toast('나중에 크롬 메뉴에서도 설치할 수 있어요');
      render(true);
    }else{
      showIosInstall();
    }
    break;
  }
  case 'install-off': {
    try{ localStorage.setItem('pg_install_off','1'); }catch{}
    render(true); break;
  }

  case 'kick': {
    if (!S.isHost) return;
    delete S.room.players[d.pid];
    remove(ref(db, `${ROOT}/rooms/${S.code}/players/${d.pid}`)).catch(()=>{});
    render(); break;
  }
  case 'teams': {
    const n = Number(d.n);
    if (n < 2){ S.room.teams = {count:0,assign:{}}; pushHostState(); }
    else if (players().length < n) return toast(`${n}팀을 나누려면 ${n}명 이상 필요해요`);
    else { makeTeams(n); confetti(45); }
    render(); break;
  }

  case 'go-games': go('games'); break;
  case 'go-board': go('board'); break;
  case 'go-settings': go('settings'); break;
  case 'game': S.gameId = d.id; go('game'); break;

  case 'pick': {
    if (!S.isHost) return toast('진행자만 뽑을 수 있어요');
    const g = G(S.gameId);
    const before = (S.room.rotation?.[g.id] || []).filter(p => S.room.players[p]);
    const all = players().map(([pid]) => pid);
    const pool = all.filter(p => !before.includes(p));
    const { pick, reset } = pickRole(S.gameId);
    S._lastPick[S.gameId] = pick;
    await rollReveal(g.role, (pool.length ? pool : all), pick);
    render();
    if (reset) toast('전원이 한 바퀴 돌아서 순번을 새로 시작해요');
    break;
  }
  case 'rot-reset': {
    if (!S.isHost) return;
    if (S.room.rotation) delete S.room.rotation[S.gameId];
    delete S._lastPick[S.gameId];
    pushHostState(); render(); toast('순번을 초기화했어요'); break;
  }

  /* ── 진행 도구 ── */
  case 'tool-start': {
    if (!S.isHost) return toast('진행 도구는 진행자 기기에서 열어주세요');
    const g = G(S.gameId), n = players().length;
    if (g.tool === 'deck'){
      if (g.mode === 'team' && (S.room.teams?.count || 0) < 2)
        return toast('팀전이에요 — 대기실에서 팀을 먼저 나눠주세요');
      startDeckTool();
    }
    else if (g.tool === 'noise'){ if (n < 2) return toast('2명 이상 필요해요'); startNoiseTool(); }
    else if (g.tool === 'cup'){   if (n < 2) return toast('2명 이상 필요해요'); startCupTool(); }
    else if (g.tool === 'act'){   if (n < 2) return toast('2명 이상 필요해요'); startActTool(); }
    else if (g.tool === 'smile'){ if (n < 3) return toast('3명 이상 필요해요'); startSmileTool(); }
    else if (g.tool === 'watch') startWatchTool();
    else if (g.tool === 'mafia') startMafiaTool();
    break;
  }
  case 'pl-mode': S.play.mode = d.v; render(); break;
  case 'pl-sec':  S.play.sec = Number(d.v); render(); break;
  case 'pl-cat': {
    const c = S.play.cats;
    const i = c.indexOf(d.v);
    i < 0 ? c.push(d.v) : c.splice(i, 1);
    render(); break;
  }
  case 'pl-start': {
    if (!S.play.cats.length) return toast('카테고리를 하나 이상 골라주세요');
    Object.assign(S.play, { phase:'ready', turn:0, results:{} });
    render(); break;
  }
  case 'pl-begin': {
    const p = S.play, t = p.order[p.turn];
    if (p.mode === 'oneword'){
      const v = ($('#in-letter')?.value || '').trim();
      if (!v) return toast('이 팀이 쓸 한 글자를 정해주세요');
      p.letters[t] = v[0];
    }
    beginTurn(); break;
  }
  case 'pl-mark': markWord(d.v === '1'); break;
  case 'pl-stop': endTurn(); break;
  case 'pl-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1){ p.phase = 'done'; confetti(70); }
    else { p.turn++; p.phase = 'ready'; }
    render(); break;
  }
  case 'pl-save': deckToScore(); break;

  /* ── 멕썸노이즈 · 컵 레이스 (race-* 공유) ── */
  case 'no-brief': case 'no-reroll': {
    const p = S.play;
    p.sen = jo(pname(p.order[p.turn]), '이', '가') + ' ' + noiseSentence();
    p.phase = 'brief'; vib(8); render(true); break;
  }
  case 'race-run': {
    S.play.phase = 'run'; SFX.go(); vib(20);
    render(true); swBegin(); break;
  }
  case 'race-end': {
    const p = S.play; stopPlayTimer();
    const ok = d.v === '1';
    p.rec[p.order[p.turn]] = ok ? Math.round((p.elapsed || 0) * 10) / 10 : null;
    p.phase = 'turnEnd';
    ok ? SFX.ok() : SFX.end(); vib(ok ? [20,40,20] : 30);
    render(true); break;
  }
  case 'race-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1){ p.phase = 'done'; confetti(70); }
    else { p.turn++; p.phase = 'ready'; }
    render(true); break;
  }
  case 'race-save': {
    const p = S.play;
    toScore([...p.order].sort((a,b) => (p.rec[a] ?? 1e9) - (p.rec[b] ?? 1e9)), 'solo');
    break;
  }

  /* ── 연기 대결 ── */
  case 'ac-reroll': actDraw(); vib(8); render(true); break;
  case 'ac-next': {
    const p = S.play;
    if (p.turn >= p.order.length - 1) p.phase = 'done';
    else { p.turn++; actDraw(); }
    render(true); break;
  }
  case 'ac-score': { stopPlayTimer(); S.play = null; act('score-start', {}); break; }

  /* ── 스마일~! ── */
  case 'sm-sul': {
    const p = S.play;
    p.sul = d.pid;
    p.pool = players().map(([pid]) => pid).filter(x => x !== d.pid);
    p.shots = 10; p.sel = []; p.phase = 'run';
    SFX.go(); render(true); break;
  }
  case 'sm-shot': {
    const p = S.play;
    if (p.shots > 0){ p.shots--; SFX.tick(); vib(10); }
    if (p.shots <= 0){ p.phase = 'judge'; p.sel = []; SFX.end(); }
    render(true); break;
  }
  case 'sm-judge': S.play.phase = 'judge'; S.play.sel = []; render(true); break;
  case 'sm-back':  S.play.phase = 'run'; render(true); break;
  case 'sm-sel': {
    const p = S.play, i = p.sel.indexOf(d.pid);
    i < 0 ? p.sel.push(d.pid) : p.sel.splice(i, 1);
    render(true); break;
  }
  case 'sm-apply': {
    const p = S.play;
    p.log.push({ r:p.log.length + 1, sul:p.sul, caught:[...p.sel] });
    if (p.sel.length === 1){
      const nx = p.sel[0];
      p.sul = nx;
      p.pool = players().map(([pid]) => pid).filter(x => x !== nx);
    }else if (p.sel.length > 1){
      p.pool = [...p.sel];      // 걸린 사람들끼리 재진행 (술래 유지)
    }                            // 0명 → 같은 술래·같은 대상 다시
    p.shots = 10; p.sel = []; p.round++; p.phase = 'run';
    render(true); break;
  }
  case 'sm-done': S.play.phase = 'done'; render(true); break;
  case 'sm-score': { stopPlayTimer(); S.play = null; act('score-start', {}); break; }

  /* ── 안 봤어도 들키지마 ── */
  case 'wa-sec': {
    const p = S.play;
    if (p.running) return toast('타이머를 멈추고 바꿔주세요');
    p.sec = Number(d.v); p.left = p.sec; p.over = false;
    render(true); break;
  }
  case 'wa-toggle': {
    const p = S.play;
    if (p.running){ stopPlayTimer(); p.running = false; render(true); }
    else { if (p.left <= 0){ p.left = p.sec; p.over = false; } watchTimerStart(); }
    break;
  }
  case 'wa-reset': {
    const p = S.play;
    stopPlayTimer(); p.running = false; p.over = false; p.left = p.sec;
    render(true); break;
  }
  case 'wa-coin': {
    const p = S.play, dv = Number(d.v);
    p.coins[d.pid] = Math.max(0, (p.coins[d.pid] || 0) + dv);
    if (dv > 0) SFX.ok(); vib(8);
    render(true); break;
  }
  case 'wa-save': {
    const p = S.play;
    toScore(players().map(([pid]) => pid).sort((a,b) => (p.coins[b]||0) - (p.coins[a]||0)), 'solo');
    break;
  }

  /* ── 상황극 마피아 ── */
  case 'mf-cnt': S.play.cnt = Math.max(1, S.play.cnt + Number(d.v)); render(true); break;
  case 'mf-tog': S.play[d.v] = !S.play[d.v]; render(true); break;
  case 'mf-sit': {
    const p = S.play; let s;
    do { s = MAFIA_SITS[(Math.random()*MAFIA_SITS.length)|0].n; } while (s === p.sit && MAFIA_SITS.length > 1);
    p.sit = s; render(true); break;
  }
  case 'mf-deal': {
    const p = S.play;
    let pool = players().map(([pid]) => pid);
    if (!p.incHost) pool = pool.filter(x => x !== S.pid);
    if (pool.length < 3) return toast('역할을 받을 사람이 3명 이상 필요해요');
    if (p.cnt >= pool.length) return toast('마피아 수가 너무 많아요');
    shuffle(pool);
    const sit = MAFIA_SITS.find(x => x.n === p.sit) || MAFIA_SITS[0];
    const chars = shuffle([...sit.chars]);
    const roles = {};
    pool.forEach((pid,i) => {
      const c = chars[i % chars.length];
      roles[pid] = { team: i < p.cnt ? 'mafia' : 'civil', job:'', jobDesc:'',
        char:c.n, charDesc:c.d, alibi:c.a || '', tip:c.t || '', lines:c.l || [] };
    });
    const civ = pool.slice(p.cnt);
    if (p.pol && civ.length){     roles[civ[0]].job = sit.cop.name;  roles[civ[0]].jobDesc = sit.cop.desc; }
    if (p.doc && civ.length > 1){ roles[civ[1]].job = sit.doc.name;  roles[civ[1]].jobDesc = sit.doc.desc; }
    // 세계관 명칭을 함께 저장 — 참가자 폰이 MAFIA_SITS를 다시 찾지 않아도 되게
    const alive = {}; pool.forEach(pid => { alive[pid] = 1; });
    S.room.mafia = { round:1, phase:'day', sit:sit.n, intro:sit.intro,
      mafiaName:sit.mafia.name, mafiaDesc:sit.mafia.desc,
      roles, alive, acts:{}, votes:{}, checkRes:{}, log:[], winner:null };
    set(ref(db, `${ROOT}/rooms/${S.code}/mafia`), S.room.mafia).catch(()=>{});
    p.phase = 'dealt'; p.show = false;
    confetti(50); render(true); break;
  }
  case 'mf-show': S.play.show = !S.play.show; render(true); break;

  /* 진행 컨트롤 (사회자) */
  case 'mf-vote':    S.room.mafia.phase = 'vote';  pushMafia({ phase:'vote' });  SFX.go(); render(true); break;
  case 'mf-backday': S.room.mafia.phase = 'day';   pushMafia({ phase:'day' });   render(true); break;
  case 'mf-night':   S.room.mafia.phase = 'night'; pushMafia({ phase:'night' }); SFX.end(); render(true); break;
  case 'mf-exile':   mfResolveVote(); break;
  case 'mf-morning': mfResolveNight(); break;
  case 'mf-score': {
    const m = S.room.mafia;
    const winTeam = m.winner;
    const ordered = [
      ...Object.keys(m.roles).filter(p => S.room.players[p] && m.roles[p].team === winTeam),
      ...Object.keys(m.roles).filter(p => S.room.players[p] && m.roles[p].team !== winTeam),
    ];
    stopPlayTimer(); S.play = null;
    S.draft = { gameId:'mafia', mode:'solo', order:ordered,
      weight:G('mafia')?.weight ?? 1, assign:{} };
    go('score');
    toast('승리 진영이 위로 정렬됐어요 — MVP를 앞으로 옮겨주세요');
    break;
  }

  /* 참가자 행동 */
  case 'mf-act-kill':  mfSubmitAct('kill',  d.pid); break;
  case 'mf-act-check': mfSubmitAct('check', d.pid); break;
  case 'mf-act-save':  mfSubmitAct('save',  d.pid); break;
  case 'mf-vote-pick': mfSubmitVote(d.pid); break;
  case 'mf-redeal': {
    if (!confirm('역할을 새로 나눠줄까요?')) return;
    S.play.phase = 'setup'; render(true); break;
  }
  case 'mf-clear': {
    if (!confirm('역할을 회수하고 게임을 끝낼까요?')) return;
    S.room.mafia = null;
    remove(ref(db, `${ROOT}/rooms/${S.code}/mafia`)).catch(()=>{});
    S.play.phase = 'setup'; render(true);
    toast('역할을 회수했어요'); break;
  }
  case 'mf-open': S.gameId = 'mafia'; startMafiaTool(); break;
  case 'go-role': go('role'); break;

  case 'pl-quit': {
    const p = S.play;
    if (p?.kind === 'mafia'){ stopPlayTimer(); S.play = null; go('game'); break; }   // 역할은 방에 유지
    const prog = p && ((p.phase === 'run' && p.kind !== 'watch') || (p.turn || 0) > 0
      || Object.keys(p.results || {}).length > 0 || Object.keys(p.rec || {}).length > 0
      || Object.values(p.coins || {}).some(v => v > 0) || (p.log || []).length > 0
      || (p.kind === 'watch' && p.left < p.sec));
    if (prog && !confirm('진행 중인 게임을 그만둘까요? 지금까지 결과는 사라져요.')) return;
    stopPlayTimer(); S.play = null; go('game'); break;
  }

  case 'score-start': {
    if (!S.isHost) return toast('순위 입력은 진행자 기기에서 해주세요');
    const g = G(S.gameId);
    const teams = S.room.teams || {count:0};
    if (g.mode === 'team' && teams.count < 2) return toast('팀전이에요 — 대기실에서 팀을 먼저 나눠주세요');
    S.draft = { gameId:g.id, mode:(g.mode==='team' && teams.count>1) ? 'team' : 'solo',
      order:[], weight:g.weight, assign:JSON.parse(JSON.stringify(teams.assign || {})) };
    go('score'); break;
  }
  case 'pickrank': {
    S.draft.order.push(S.draft.mode === 'team' ? Number(d.id) : d.id);
    render(); break;
  }
  case 'undo': S.draft.order.pop(); render(); break;
  case 'score-cancel': S.draft = null; go('game'); break;
  case 'score-save': {
    const dr = S.draft;
    const sid = 's' + now().toString(36) + Math.random().toString(36).slice(2,6);
    if (!S.room.scores) S.room.scores = {};
    S.room.scores[sid] = { gameId:dr.gameId, mode:dr.mode, order:dr.order,
      weight:dr.weight, assign:dr.assign, at:now() };
    pushHostState(); S.draft = null;
    go('board'); confetti(110); vib([20,40,20]);
    toast('순위가 반영됐어요');
    break;
  }
  case 'del-score': {
    if (!S.isHost) return;
    delete S.room.scores[d.sid];
    set(ref(db, `${ROOT}/rooms/${S.code}/scores`), S.room.scores).catch(()=>{});
    render(); break;
  }

  case 'rename': {
    const n = ($('#in-rename')?.value || '').trim();
    if (!n) return toast('이름을 입력해 주세요');
    S.room.players[S.pid].name = n;
    update(ref(db, `${ROOT}/rooms/${S.code}/players/${S.pid}`), { name:n }).catch(()=>{});
    saveSession(); render(); toast('이름을 바꿨어요'); break;
  }
  case 'reset-scores': {
    if (!confirm('점수를 전부 지울까요? 되돌릴 수 없어요.')) return;
    S.room.scores = {};
    set(ref(db, `${ROOT}/rooms/${S.code}/scores`), {}).catch(()=>{});
    render(); toast('점수를 초기화했어요'); break;
  }
  case 'reset-rot': {
    S.room.rotation = {}; S._lastPick = {};
    pushHostState(); render(); toast('순번을 초기화했어요'); break;
  }
  case 'leave': {
    if (S.isHost && !confirm('진행자가 나가면 점수 기준 기기가 사라져요. 나갈까요?')) return;
    leaveRoom(); break;
  }
  }
}

/* ══════════════════════════════════════════════
   부팅
══════════════════════════════════════════════ */
watchConnection();
render();

(async () => {
  const q = new URLSearchParams(location.search).get('r');
  const sess = (() => { try{ return JSON.parse(localStorage.getItem(LS) || 'null'); }catch{ return null; } })();
  if (sess && (!q || q === sess.code)){
    if (await rejoin(sess)) return;
    clearSession();
  }
  if (q && /^\d{4}$/.test(q)){
    const el = $('#in-code');
    if (el){ el.value = q; el.dispatchEvent(new Event('input')); }
  }
})();

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
